# cargo-about config: builds the third-party licence bundle shipped with releases.
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
# Keep `accepted` in step with deny.toml (policy: docs/licences.md).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0", # only option-ext; deny.toml enforces that
]
# Bundle only what ships: skip dev-dependencies and build tooling crates.
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring"]
