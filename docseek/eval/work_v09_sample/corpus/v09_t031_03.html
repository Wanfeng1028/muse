<h1>麻婆豆腐的麻和烫，上桌前怎么保住</h1>
<p>麻婆豆腐讲究麻辣烫香酥嫩鲜活，最难保住的是麻和烫。花椒面分三次放，是很多老师傅的做法。</p>
<h2>花椒面的三次投放</h2>
<p>第一次：炒牛肉末时放一半花椒面，让麻味进油。第二次：豆腐烧入味勾芡后撒四分之一。第三次：起锅装碗后再撒剩下的四分之一。这样麻味有层次，不是一股脑的冲。</p>
<h2>烫的保持</h2>
<ul>
<li>碗先用开水烫过，擦干再用</li>
<li>豆腐烧好立刻装碗，别在锅里晾</li>
<li>勾芡分两次，第一次薄芡，第二次厚芡，汤汁裹住豆腐才保温</li>
</ul>
<p>豆腐切2厘米见方，盐水泡五分钟去豆腥。烧的时候用勺背推，别用铲子翻，豆腐才不碎。豆瓣酱和豆豉都要剁细，否则口感发渣。</p>
