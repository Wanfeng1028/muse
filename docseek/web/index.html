(function () {
  "use strict";

  var API = {
    search: "/api/search",
    stats: "/api/stats",
    index: "/api/index",
    watch: "/api/watch",
    locate: "/api/locate"
  };

  function $(id) {
    return document.getElementById(id);
  }

  function showMsg(el, text, ok) {
    if (!el) { return; }
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  function hideMsg(el) {
    if (!el) { return; }
    el.className = "msg";
    el.textContent = "";
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) { return ""; }
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // 将摘要中的 <b>...</b> 或 <em>...</em> 高亮标记安全转换为 <em>，
  // 其余文本一律转义，防止注入。
  function renderSnippet(raw) {
    if (!raw) { return ""; }
    var text = String(raw);
    var out = "";
    var i = 0;
    var re = /<\s*(b|em|strong)\s*>([\s\S]*?)<\s*\/\s*\1\s*>/gi;
    var m;
    while ((m = re.exec(text)) !== null) {
      out += escapeHtml(text.slice(i, m.index));
      out += "<em>" + escapeHtml(m[2]) + "</em>";
      i = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(i));
    return out;
  }

  // 转义正则特殊字符，供 highlight 构造 RegExp 使用。
  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  }

  // 判断是否为 CJK 字符（中文按字切分片段边界用）。
  function isCJK(ch) {
    var c = ch.charCodeAt(0);
    return (c >= 0x4E00 && c <= 0x9FFF) ||
           (c >= 0x3400 && c <= 0x4DBF) ||
           (c >= 0x3000 && c <= 0x303F) ||
           (c >= 0xFF00 && c <= 0xFFEF);
  }

  // 判断字符是否为单词字符（英文/数字/下划线），用于不截断单词。
  function isWordChar(ch) {
    return /[A-Za-z0-9_]/.test(ch);
  }

  // 从 pos 向左扩展到词边界（不截断单词；中文按字）。
  function expandLeft(text, pos) {
    var i = pos;
    while (i > 0) {
      var prev = text.charAt(i - 1);
      if (isWordChar(prev) || isCJK(prev)) { i--; } else { break; }
    }
    return i;
  }

  // 从 pos 向右扩展到词边界（不截断单词；中文按字）。
  function expandRight(text, pos) {
    var i = pos;
    while (i < text.length) {
      var cur = text.charAt(i);
      if (isWordChar(cur) || isCJK(cur)) { i++; } else { break; }
    }
    return i;
  }

  // 在 text 中找出所有 keywords 的命中区间 [start, end)，大小写不敏感。
  // 返回按 start 升序、互不重叠的区间数组。
  function findKeywordRanges(text, keywords) {
    var ranges = [];
    if (!keywords || keywords.length === 0) { return ranges; }
    for (var k = 0; k < keywords.length; k++) {
      var kw = keywords[k];
      if (!kw) { continue; }
      var re = new RegExp(escapeRegExp(kw), "gi");
      var m;
      while ((m = re.exec(text)) !== null) {
        if (m[0].length === 0) { re.lastIndex++; continue; }
        ranges.push({ start: m.index, end: m.index + m[0].length });
        if (re.lastIndex <= m.index) { re.lastIndex = m.index + 1; }
      }
    }
    ranges.sort(function (a, b) {
      if (a.start !== b.start) { return a.start - b.start; }
      return a.end - b.end;
    });
    var merged = [];
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if (merged.length > 0 && r.start <= merged[merged.length - 1].end) {
        if (r.end > merged[merged.length - 1].end) {
          merged[merged.length - 1].end = r.end;
        }
      } else {
        merged.push({ start: r.start, end: r.end });
      }
    }
    return merged;
  }

  // 在 text 上做关键词高亮，返回 HTML 字符串。
  // - 大小写不敏感
  // - 转义正则特殊字符（如 "C++"）
  // - 转义 HTML（防注入）
  // - 用 <mark> 包裹命中词
  function highlight(text, keywords) {
    if (text === null || text === undefined) { return ""; }
    var s = String(text);
    var ranges = findKeywordRanges(s, keywords);
    if (ranges.length === 0) {
      return escapeHtml(s);
    }
    var out = "";
    var cursor = 0;
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      out += escapeHtml(s.slice(cursor, r.start));
      out += "<mark>" + escapeHtml(s.slice(r.start, r.end)) + "</mark>";
      cursor = r.end;
    }
    out += escapeHtml(s.slice(cursor));
    return out;
  }

  // 生成带高亮的摘要片段：以第一个命中词为中心，前后各 60 字符，
  // 片段边界扩展到词边界（中文按字）。未命中时返回开头 120 字符。
  function buildSnippet(text, keywords) {
    if (text === null || text === undefined) { return ""; }
    var s = String(text);
    var ranges = findKeywordRanges(s, keywords);
    var start;
    var end;
    if (ranges.length === 0) {
      start = 0;
      end = Math.min(s.length, 120);
      end = expandRight(s, end);
    } else {
      var first = ranges[0];
      start = first.start - 60;
      if (start < 0) { start = 0; } else { start = expandLeft(s, start); }
      end = first.end + 60;
      if (end > s.length) { end = s.length; } else { end = expandRight(s, end); }
    }
    var prefix = start > 0 ? "…" : "";
    var suffix = end < s.length ? "…" : "";
    return prefix + highlight(s.slice(start, end), keywords) + suffix;
  }

  // 从用户查询串里切出关键词，用于搜索页高亮。
  // 按空白切分；同时把整串作为一个关键词（保留 "C++" 这类含特殊字符的整体）。
  function splitKeywords(q) {
    var s = (q === null || q === undefined) ? "" : String(q).trim();
    if (!s) { return []; }
    var parts = s.split(/\s+/);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) { out.push(parts[i]); }
    }
    return out;
  }

# docseek serve 的 Web UI 搜索高亮

本文说明 `docseek serve` 子命令自带 Web UI（`web/index.html`）里搜索结果的
关键词高亮行为，以及需要留意的边界情况。

## 高亮做什么

在“搜索”卡片里输入关键词并点“搜索”后，结果列表每一项的标题、路径、摘要
三处都会把命中词用 `<mark>` 包起来。颜色由 CSS 变量 `--mark-bg` 控制：

- 浅色（默认）：`#fff3b0`
- 深色（`@media (prefers-color-scheme: dark)`）：`#5c4a00`

页面上负责这件事的是 `highlight(text, keywords)` 函数，配套的还有
`buildSnippet(text, keywords)` 用来从摘要原文里切一段带高亮的片段。

## highlight 的行为

- 大小写不敏感。搜 `Python` 能命中 `python`，搜 `python` 也能命中 `Python`。
- 关键词里的正则特殊字符会被转义后再构造 `RegExp`，所以像 `C++`、`a.b`、
  `(x)`、`$100`、`[test]` 这类词都能原样命中，不会当成正则。
- 文本先切分再对每段调用 `escapeHtml`，所以原文里的 `<script>`、`&`、`"` 等
  会被转义成 `&lt;script&gt;`、`&amp;`、`&quot;`，不会注入页面。
- 多个关键词各自扫描，命中区间合并去重，重叠部分只包一层 `<mark>`。
- 命中词之间的文本和命中词内部的文本都走 `escapeHtml`，只有命中词本身被
  `<mark>` 包裹。

## 摘要片段怎么切

`buildSnippet` 以第一个命中词为中心：

- 命中词前 60 个字符、后 60 个字符组成片段。
- 片段左边界向左扩展到词边界，右边界向右扩展到词边界。也就是说不会把
  一个英文单词从中间截断。
- 中文按字处理，汉字之间不会做词边界扩展，直接以字符为准。
- 片段被裁剪时（左边有裁、右边有裁）在对应侧加省略号 `…`。
- 整段摘要没有任何命中词时，退化为开头最多 120 个字符（同样向右扩展到词
  边界）。

## 关键词怎么切

用户输入的查询串由 `splitKeywords(q)` 按空白切分：

- 输入 `机器学习 模型` 得到 `["机器学习", "模型"]`。
- 输入 `C++` 得到 `["C++"]`，整串作为一个关键词，含 `+` 也不会被当正则。
- 输入为空或全是空白时返回空数组，此时 `highlight` 只做 HTML 转义，不加
  `<mark>`。

## 边界与注意

- **query 为空不请求**：`doSearch` 里先 `trim` 再判断，空串直接显示
  “请输入关键词后再搜索”，不会发 HTTP 请求。`/api/search` 只在有非空 query
  时被调用。
- **关键词含正则字符**：`C++`、`a.b`、`x*y`、`(foo)`、`[bar]`、`{n}`、`$`、`^`、
  `|`、`\` 都能正确高亮。函数里用 `escapeRegExp` 逐个转义，再用 `"gi"` 构造
  `RegExp`。
- **XSS**：原文里的 `<img onerror=...>`、`<script>` 之类都会先转义再拼 HTML，
  高亮不会绕过转义。
- **重叠命中**：关键词 `ab` 和 `abc` 同时存在时，命中区间合并，`abc` 只包一层
  `<mark>`，不会出现嵌套 `<mark>`。
- **空关键词**：`splitKeywords` 会丢弃空串，`highlight` 遇到空数组时只转义。
- **服务端 snippet 已有 `<em>` 标记**：`renderSnippet` 会把服务端返回的
  `<b>`/`<em>`/`<strong>` 转成 `<em>`；搜索页现在走的是前端
  `buildSnippet` + `highlight` 这条路，`renderSnippet` 保留给其它入口用。
- **深色模式**：只改 `--mark-bg`，文字颜色用 `inherit`，不会在深色背景上出现
  亮底黑字的刺眼组合。

## 本地手工验证

1. 启动：`docseek serve`（默认监听本地端口，具体见命令帮助）。
2. 浏览器打开首页，在“搜索”输入框里输入 `C++`，点搜索。
3. 期望：结果里出现的 `C++` 被黄色（浅色模式）或暗黄（深色模式）背景包住，
   标题、路径、摘要三处都生效。
4. 输入框留空点搜索，期望：结果区显示“请输入关键词后再搜索”，网络面板里没有
   `/api/search` 请求。
5. 输入 `机器学习`，期望摘要片段里命中词前后各约 60 字，被截断处有 `…`，
   英文单词不会被从中间切开。

  function requestJSON(method, url, body) {
    var opts = {
      method: method,
      headers: { "Accept": "application/json" }
    };
    if (body !== undefined && body !== null) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (resp) {
      return resp.text().then(function (text) {
        var data = null;
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (e) {
            data = { error: "服务返回了非 JSON 响应（HTTP " + resp.status + "）" };
          }
        } else {
          data = {};
        }
        if (!resp.ok) {
          var emsg = (data && data.error) ? data.error : ("请求失败（HTTP " + resp.status + "）");
          throw new Error(emsg);
        }
        if (data && data.error) {
          throw new Error(data.error);
        }
        return data;
      });
    });
  }

  function formatBytes(n) {
    if (n === null || n === undefined || isNaN(n)) { return "-"; }
    var v = Number(n);
    if (v < 1024) { return v + " B"; }
    var units = ["KB", "MB", "GB", "TB"];
    var u = -1;
    do {
      v = v / 1024;
      u++;
    } while (v >= 1024 && u < units.length - 1);
    return v.toFixed(2) + " " + units[u];
  }

  function formatUptime(sec) {
    if (sec === null || sec === undefined || isNaN(sec)) { return "-"; }
    var s = Math.floor(Number(sec));
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    var parts = [];
    if (d > 0) { parts.push(d + " 天"); }
    if (h > 0 || d > 0) { parts.push(h + " 时"); }
    if (m > 0 || h > 0 || d > 0) { parts.push(m + " 分"); }
    parts.push(ss + " 秒");
    return parts.join(" ");
  }

  // ---------- 搜索 ----------
  function doSearch() {
    var q = $("q").value.trim();
    var limit = parseInt($("limit").value, 10) || 20;
    var box = $("results");
    if (!q) {
      box.innerHTML = '<div class="empty">请输入关键词后再搜索</div>';
      return;
    }
    box.innerHTML = '<div class="empty">搜索中…</div>';
    var btn = $("btnSearch");
    btn.disabled = true;
    var url = API.search + "?q=" + encodeURIComponent(q) + "&limit=" + limit;
    requestJSON("GET", url).then(function (data) {
      renderResults(data, q);
    }).catch(function (err) {
      box.innerHTML = '<div class="empty">搜索失败</div>';
      alert("搜索失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function renderResults(data, q) {
    var box = $("results");
    var items = [];
    if (Array.isArray(data)) {
      items = data;
    } else if (data && Array.isArray(data.results)) {
      items = data.results;
    } else if (data && Array.isArray(data.hits)) {
      items = data.hits;
    }
    if (items.length === 0) {
      box.innerHTML = '<div class="empty">未找到与“' + escapeHtml(q) + '”相关的文档</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      var idx = i + 1;
      var title = it.title ? it.title : "(无标题)";
      var path = it.path ? it.path : "";
      var score = (it.score !== undefined && it.score !== null) ? Number(it.score).toFixed(4) : "-";
      var snippet = it.snippet ? it.snippet : "";
      html += '<div class="result-item">';
      html += '<div class="result-head">';
      var ext = "";
      var dotPos = path.lastIndexOf(".");
      if (dotPos >= 0) { ext = path.slice(dotPos + 1).toLowerCase(); }
      var typeLabel = it.file_type ? it.file_type : "";
      if (!typeLabel) {
        if (ext === "html" || ext === "htm") { typeLabel = "HTML"; }
        else if (ext === "md" || ext === "markdown") { typeLabel = "MD"; }
        else if (ext === "txt" || ext === "text") { typeLabel = "TXT"; }
        else if (ext === "pdf") { typeLabel = "PDF"; }
      }
      html += '<span class="result-idx">' + idx + '</span>';
      html += '<span class="result-title">' + escapeHtml(title) + '</span>';
      if (typeLabel) { html += '<span class="result-type">' + escapeHtml(typeLabel) + '</span>'; }
      html += '<span class="result-score">score ' + escapeHtml(score) + '</span>';
      html += '</div>';
      html += '<div class="result-path">' + escapeHtml(path) + '</div>';
      if (snippet) {
        html += '<div class="result-snippet">' + renderSnippet(snippet) + '</div>';
      }
      html += '</div>';
    }
    box.innerHTML = html;
  }

  // ---------- 服务状态 ----------
  function refreshStats() {
    var btn = $("btnStats");
    btn.disabled = true;
    requestJSON("GET", API.stats).then(function (data) {
      var docs = (data.documents !== undefined) ? data.documents :
                 ((data.doc_count !== undefined) ? data.doc_count : (data.count));
      var bytes = (data.total_bytes !== undefined) ? data.total_bytes :
                  ((data.index_bytes !== undefined) ? data.index_bytes :
                  ((data.bytes !== undefined) ? data.bytes : (data.size_bytes)));
      var watches = (data.watches !== undefined) ? data.watches :
                    ((data.watch_count !== undefined) ? data.watch_count :
                    (data.watched_dirs));
      if (Array.isArray(watches)) { watches = watches.length; }
      var uptime = (data.uptime_sec !== undefined) ? data.uptime_sec :
                   ((data.uptime_seconds !== undefined) ? data.uptime_seconds :
                   ((data.uptime !== undefined) ? data.uptime : (data.uptime_secs)));

      $("statDocs").textContent = (docs !== undefined && docs !== null) ? docs : "-";
      $("statBytes").textContent = (bytes !== undefined && bytes !== null) ? formatBytes(bytes) : "-";
      $("statWatches").textContent = (watches !== undefined && watches !== null) ? watches : "-";
      $("statUptime").textContent = (uptime !== undefined && uptime !== null) ? formatUptime(uptime) : "-";
    }).catch(function (err) {
      alert("获取服务状态失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 建立索引 ----------
  function doIndex() {
    var p = $("indexPath").value.trim();
    var msg = $("indexMsg");
    if (!p) {
      showMsg(msg, "请输入要建立索引的文件或目录路径", false);
      return;
    }
    var btn = $("btnIndex");
    btn.disabled = true;
    hideMsg(msg);
    requestJSON("POST", API.index, { path: p }).then(function (data) {
      var scanned = (data.scanned !== undefined) ? data.scanned : 0;
      var added = (data.added !== undefined) ? data.added : 0;
      var updated = (data.updated !== undefined) ? data.updated : 0;
      var extra = "";
      if (data.removed !== undefined) {
        extra += "，移除 " + data.removed;
      }
      if (data.skipped !== undefined) {
        extra += "，跳过 " + data.skipped;
      }
      showMsg(msg, "索引完成：扫描 " + scanned + "，新增 " + added + "，更新 " + updated + extra, true);
      refreshStats();
    }).catch(function (err) {
      showMsg(msg, "建立索引失败：" + err.message, false);
      alert("建立索引失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 监控 ----------
  function renderWatches(paths) {
    var box = $("watchList");
    if (!paths || paths.length === 0) {
      box.innerHTML = '<div class="empty">暂无监控目录</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < paths.length; i++) {
      var p = paths[i];
      html += '<div class="watch-item">';
      html += '<span class="path">' + escapeHtml(p) + '</span>';
      html += '<button class="danger" data-path="' + escapeHtml(p) + '">移除</button>';
      html += '</div>';
    }
    box.innerHTML = html;
    var btns = box.querySelectorAll("button.danger");
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener("click", onRemoveWatch);
    }
  }

  function loadWatches() {
    requestJSON("GET", API.watch).then(function (data) {
      var paths = [];
      if (Array.isArray(data)) {
        paths = data;
      } else if (data && Array.isArray(data.paths)) {
        paths = data.paths;
      } else if (data && Array.isArray(data.watches)) {
        paths = data.watches;
      }
      renderWatches(paths);
    }).catch(function (err) {
      alert("获取监控目录失败：" + err.message);
    });
  }

  function addWatch() {
    var p = $("watchPath").value.trim();
    var msg = $("watchMsg");
    if (!p) {
      showMsg(msg, "请输入要监控的目录路径", false);
      return;
    }
    var btn = $("btnWatch");
    btn.disabled = true;
    hideMsg(msg);
    requestJSON("POST", API.watch, { path: p }).then(function (data) {
      showMsg(msg, "已添加监控：" + p, true);
      $("watchPath").value = "";
      if (data && Array.isArray(data.paths)) {
        renderWatches(data.paths);
      } else {
        loadWatches();
      }
      refreshStats();
    }).catch(function (err) {
      showMsg(msg, "添加监控失败：" + err.message, false);
      alert("添加监控失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function onRemoveWatch(ev) {
    var btn = ev.currentTarget;
    var p = btn.getAttribute("data-path");
    if (!p) { return; }
    btn.disabled = true;
    var url = API.watch + "?path=" + encodeURIComponent(p);
    requestJSON("DELETE", url).then(function (data) {
      if (data && Array.isArray(data.paths)) {
        renderWatches(data.paths);
      } else {
        loadWatches();
      }
      refreshStats();
    }).catch(function (err) {
      alert("移除监控失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 自然语言定位 ----------
  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  }

  function highlightTerms(text, terms) {
    var esc = escapeHtml(text);
    if (!terms || terms.length === 0) { return esc; }
    var sorted = terms.slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < sorted.length; i++) {
      var t = sorted[i];
      if (!t) { continue; }
      var re = new RegExp(escapeRegExp(escapeHtml(t)), "gi");
      esc = esc.replace(re, "<em>$&</em>");
    }
    return esc;
  }

  function doLocate() {
    var q = $("lq").value.trim();
    var limit = parseInt($("llimit").value, 10) || 5;
    var box = $("locateResults");
    if (!q) {
      box.innerHTML = '<div class="empty">请先输入问题</div>';
      return;
    }
    box.innerHTML = '<div class="empty">定位中…</div>';
    var btn = $("btnLocate");
    btn.disabled = true;
    var url = API.locate + "?q=" + encodeURIComponent(q) + "&limit=" + limit;
    requestJSON("GET", url).then(function (data) {
      renderAnchors(data, q);
    }).catch(function (err) {
      box.innerHTML = '<div class="empty">定位失败</div>';
      alert("定位失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function renderAnchors(data, q) {
    var box = $("locateResults");
    var anchors = (data && Array.isArray(data.anchors)) ? data.anchors : [];
    var keywords = (data && Array.isArray(data.keywords)) ? data.keywords : [];
    if (anchors.length === 0) {
      box.innerHTML = '<div class="empty">未找到与“' + escapeHtml(q) + '”相关的原文段落，换个说法试试</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i] || {};
      var idx = i + 1;
      var path = a.path ? a.path : "";
      var ls = (a.line_start !== undefined) ? a.line_start : "-";
      var le = (a.line_end !== undefined) ? a.line_end : "-";
      var score = (a.score !== undefined && a.score !== null) ? Number(a.score).toFixed(3) : "-";
      var terms = (a.matched_terms && a.matched_terms.length) ? a.matched_terms : keywords;
      var text = a.text ? a.text : "";
      html += '<div class="result-item">';
      html += '<div class="result-head">';
      html += '<span class="result-idx">' + idx + '</span>';
      html += '<span class="result-title">' + escapeHtml(path) + '</span>';
      html += '<span class="result-score">score ' + escapeHtml(score) + '</span>';
      html += '</div>';
      html += '<div class="result-loc">第 <b>' + escapeHtml(String(ls)) + '</b>–<b>' + escapeHtml(String(le)) + '</b> 行</div>';
      if (text) {
        html += '<div class="result-snippet">' + highlightTerms(text, terms) + "</div>";
      }
      html += "</div>";
    }
    // 换行保留：段落内换行转 <br>
    html = html.split("\n").join("<br>");
    box.innerHTML = html;
  }

  // ---------- 事件绑定与初始化 ----------
  function bindEnter(inputId, fn) {
    $(inputId).addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { fn(); }
    });
  }
  $("btnSearch").addEventListener("click", doSearch);
  bindEnter("q", doSearch);
  $("btnStats").addEventListener("click", refreshStats);
  $("btnIndex").addEventListener("click", doIndex);
  bindEnter("indexPath", doIndex);
  $("btnWatch").addEventListener("click", addWatch);
  bindEnter("watchPath", addWatch);
  $("btnLocate").addEventListener("click", doLocate);
  bindEnter("lq", doLocate);
  loadWatches();
  refreshStats();
})();
