<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 视觉逻辑：案卷检索桌——左对齐的检索台账：纸色底、墨色字、朱红点睛，细线分隔代替悬浮卡片，无衬线正文 + 等宽路径/分数/行号。 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文溯 DocSeek · 全文检索服务</title>
<style>
  :root {
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #f6f3ec;
    color: #211d17;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 1180px;
    margin: 0;
    padding: 0 32px 56px;
  }
  header.top {
    text-align: left;
    padding: 28px 0 16px;
    border-bottom: 3px solid #211d17;
  }
  header.top h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: #211d17;
    letter-spacing: 0.5px;
  }
  header.top .sub {
    margin-top: 4px;
    font-size: 13px;
    color: #6d6659;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 48px;
    margin-top: 24px;
    align-items: start;
  }
  .card {
    padding: 22px 0 26px;
    border-top: 1px solid #ddd5c2;
    background: none;
  }
  .card:first-child {
    border-top: none;
    padding-top: 6px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 600;
    color: #211d17;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #211d17;
    flex: 0 0 auto;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  input[type="text"], select {
    flex: 1 1 200px;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #ddd5c2;
    border-radius: 2px;
    font-size: 14px;
    font-family: inherit;
    color: #211d17;
    background: #fffdf8;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, select:focus {
    border-color: #b3402a;
    box-shadow: 0 0 0 3px rgba(179, 64, 42, 0.18);
  }
  select {
    flex: 0 0 auto;
    width: 112px;
  }
  button {
    padding: 8px 18px;
    border: 1px solid #b3402a;
    border-radius: 2px;
    background: #b3402a;
    color: #f6f3ec;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  button:hover { background: #93392a; border-color: #93392a; }
  button:active { background: #93392a; border-color: #93392a; }
  button.ghost {
    background: transparent;
    color: #211d17;
    border-color: #211d17;
  }
  button.ghost:hover {
    background: #211d17;
    border-color: #211d17;
    color: #f6f3ec;
  }
  button.danger {
    background: transparent;
    color: #93392a;
    border-color: #93392a;
    padding: 4px 12px;
    font-size: 12px;
  }
  button.danger:hover {
    background: #93392a;
    border-color: #93392a;
    color: #f6f3ec;
  }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .results {
    margin-top: 16px;
  }
  .result-item {
    padding: 14px 0 16px;
    border-bottom: 1px solid #ddd5c2;
  }
  .results .result-item:first-child {
    border-top: 2px solid #211d17;
    padding-top: 14px;
  }
  .result-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .result-idx {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: #b3402a;
    min-width: 22px;
  }
  .result-title {
    font-weight: 600;
    color: #211d17;
    word-break: break-all;
  }
  .result-score {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 12px;
    color: #6d6659;
    text-align: right;
  }
  .result-type {
    font-family: var(--mono);
    font-size: 11px;
    color: #6d6659;
    border: 1px solid #ddd5c2;
    border-radius: 2px;
    padding: 0 6px;
    line-height: 1.6;
    white-space: nowrap;
  }
  .result-path {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 12px;
    color: #6d6659;
    overflow-wrap: break-word;
  }
  .result-loc {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 12px;
    color: #6d6659;
    overflow-wrap: break-word;
  }
  .result-loc b {
    color: #211d17;
    font-weight: 600;
  }
  .result-explain {
    margin-top: 10px;
    padding: 8px 0 2px;
    border-top: 1px solid #ddd5c2;
    font-size: 12px;
    color: #6d6659;
  }
  .result-explain summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: #211d17;
  }
  .result-explain-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .result-explain-label {
    flex: 0 0 auto;
    min-width: 84px;
    font-size: 12px;
    color: #6d6659;
  }
  .result-explain-bar {
    flex: 1 1 auto;
    height: 6px;
    background: #ddd5c2;
    overflow: hidden;
  }
  .result-explain-fill {
    display: block;
    height: 100%;
    background: #211d17;
  }
  .result-explain-val {
    flex: 0 0 auto;
    min-width: 48px;
    text-align: right;
    font-family: var(--mono);
    font-size: 12px;
    color: #6d6659;
  }
  .result-explain-desc {
    margin: 2px 0 0 92px;
    font-size: 12px;
    color: #6d6659;
  }
  .result-explain-final {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #ddd5c2;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: #211d17;
  }
  .result-snippet {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.7;
    color: #211d17;
    overflow-wrap: break-word;
  }
  .result-snippet em,
  .result-snippet mark {
    font-style: normal;
    background: #ffe9a8;
    color: #211d17;
    padding: 0 2px;
    border-radius: 2px;
  }
  .empty {
    text-align: left;
    color: #6d6659;
    padding: 14px 0;
    font-size: 13px;
  }
  .stats-grid {
    display: block;
    margin-bottom: 16px;
  }
  .stats-grid .stat-box:first-child {
    border-top: 2px solid #211d17;
  }
  .stat-box {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid #ddd5c2;
  }
  .stat-box .label {
    font-size: 13px;
    color: #6d6659;
  }
  .stat-box .value {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: #211d17;
    overflow-wrap: break-word;
    text-align: right;
  }
  .watch-list {
    margin-top: 14px;
  }
  .watch-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #ddd5c2;
  }
  .watch-item:first-child {
    border-top: 2px solid #211d17;
  }
  .watch-item .path {
    flex: 1 1 auto;
    font-family: var(--mono);
    font-size: 13px;
    color: #211d17;
    overflow-wrap: break-word;
  }
  .hint {
    font-size: 12px;
    color: #6d6659;
    margin-top: 10px;
  }
  .msg {
    margin-top: 12px;
    font-size: 13px;
    padding: 8px 0 8px 12px;
    display: none;
  }
  .msg.ok {
    display: block;
    border-left: 3px solid #2f5e3f;
    color: #2f5e3f;
  }
  .msg.err {
    display: block;
    border-left: 3px solid #93392a;
    color: #93392a;
  }
  @media (max-width: 900px) {
    .wrap {
      padding: 0 16px 48px;
    }
    .columns {
      grid-template-columns: 1fr;
      gap: 0;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>文溯 DocSeek · 全文检索服务</h1>
    <div class="sub">本地全文检索引擎 · 常驻 HTTP 服务 · 实时文件监控</div>
  </header>

  <div class="columns">
  <div class="col-main">

  <!-- ① 搜索 -->
  <section class="card">
    <h2><span class="dot"></span>搜索</h2>
    <div class="row">
      <input type="text" id="q" placeholder="输入关键词，例如：机器学习" autocomplete="off">
      <select id="limit">
        <option value="10">10 条</option>
        <option value="20" selected>20 条</option>
        <option value="50">50 条</option>
      </select>
      <button id="btnSearch">搜索</button>
    </div>
    <div class="results" id="results">
      <div class="empty">输入关键词后点击“搜索”查看结果</div>
    </div>
  </section>

  <!-- ④ 自然语言定位 -->
  <section class="card">
    <h2><span class="dot"></span>自然语言定位</h2>
    <div class="row">
      <input type="text" id="lq" placeholder="用平时说话的方式提问，例如：退款流程写在哪一段" autocomplete="off">
      <select id="llimit">
        <option value="3">3 段</option>
        <option value="5" selected>5 段</option>
        <option value="10">10 段</option>
      </select>
      <button id="btnLocate">定位</button>
    </div>
    <div class="hint">不用想关键词，直接问；文溯把你带到原文那一段（文件:行号）。</div>
    <div class="results" id="locateResults">
      <div class="empty">提问后，这里会列出原文段落与行号</div>
    </div>
  </section>

  </div>
  <div class="col-side">

  <!-- ② 服务状态 -->
  <section class="card">
    <h2><span class="dot"></span>服务状态</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="label">文档数</div>
        <div class="value" id="statDocs">-</div>
      </div>
      <div class="stat-box">
        <div class="label">索引字节</div>
        <div class="value" id="statBytes">-</div>
      </div>
      <div class="stat-box">
        <div class="label">监控目录数</div>
        <div class="value" id="statWatches">-</div>
      </div>
      <div class="stat-box">
        <div class="label">运行秒数</div>
        <div class="value" id="statUptime">-</div>
      </div>
    </div>
    <div class="row">
      <button class="ghost" id="btnStats">刷新状态</button>
    </div>
  </section>

  <!-- ③ 索引与监控 -->
  <section class="card">
    <h2><span class="dot"></span>索引与监控</h2>

    <div class="row">
      <input type="text" id="indexPath" placeholder="要建立索引的文件或目录路径" autocomplete="off">
      <button id="btnIndex">建立索引</button>
    </div>
    <div class="msg" id="indexMsg"></div>

    <div class="row" style="margin-top:16px;">
      <input type="text" id="watchPath" placeholder="要实时监控的目录路径" autocomplete="off">
      <button id="btnWatch">添加监控</button>
    </div>
    <div class="msg" id="watchMsg"></div>

    <div class="watch-list" id="watchList">
      <div class="empty">暂无监控目录</div>
    </div>
    <div class="hint">提示：监控目录发生变化时会自动增量索引（带防抖合并）。</div>
  </section>
  </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var API = {
    search: "/api/search",
    stats: "/api/stats",
    index: "/api/index",
    watch: "/api/watch",
    locate: "/api/locate"
  };

  function $(id) {
    return document.getElementById(id);
  }

  function showMsg(el, text, ok) {
    if (!el) { return; }
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  function hideMsg(el) {
    if (!el) { return; }
    el.className = "msg";
    el.textContent = "";
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) { return ""; }
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // 将摘要中的 <b>...</b> 或 <em>...</em> 高亮标记安全转换为 <em>，
  // 其余文本一律转义，防止注入。
  function renderSnippet(raw) {
    if (!raw) { return ""; }
    var text = String(raw);
    var out = "";
    var i = 0;
    var re = /<\s*(b|em|strong)\s*>([\s\S]*?)<\s*\/\s*\1\s*>/gi;
    var m;
    while ((m = re.exec(text)) !== null) {
      out += escapeHtml(text.slice(i, m.index));
      out += "<em>" + escapeHtml(m[2]) + "</em>";
      i = m.index + m[0].length;
    }
    out += escapeHtml(text.slice(i));
    return out;
  }

  // 转义正则特殊字符，供 highlight 构造 RegExp 使用。
  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  }

  // 判断是否为 CJK 字符（中文按字切分片段边界用）。
  function isCJK(ch) {
    var c = ch.charCodeAt(0);
    return (c >= 0x4E00 && c <= 0x9FFF) ||
           (c >= 0x3400 && c <= 0x4DBF) ||
           (c >= 0x3000 && c <= 0x303F) ||
           (c >= 0xFF00 && c <= 0xFFEF);
  }

  // 判断字符是否为单词字符（英文/数字/下划线），用于不截断单词。
  function isWordChar(ch) {
    return /[A-Za-z0-9_]/.test(ch);
  }

  // 从 pos 向左扩展到词边界（不截断单词；中文按字）。
  function expandLeft(text, pos) {
    var i = pos;
    while (i > 0) {
      var prev = text.charAt(i - 1);
      if (isWordChar(prev) || isCJK(prev)) { i--; } else { break; }
    }
    return i;
  }

  // 从 pos 向右扩展到词边界（不截断单词；中文按字）。
  function expandRight(text, pos) {
    var i = pos;
    while (i < text.length) {
      var cur = text.charAt(i);
      if (isWordChar(cur) || isCJK(cur)) { i++; } else { break; }
    }
    return i;
  }

  // 在 text 中找出所有 keywords 的命中区间 [start, end)，大小写不敏感。
  // 返回按 start 升序、互不重叠的区间数组。
  function findKeywordRanges(text, keywords) {
    var ranges = [];
    if (!keywords || keywords.length === 0) { return ranges; }
    for (var k = 0; k < keywords.length; k++) {
      var kw = keywords[k];
      if (!kw) { continue; }
      var re = new RegExp(escapeRegExp(kw), "gi");
      var m;
      while ((m = re.exec(text)) !== null) {
        if (m[0].length === 0) { re.lastIndex++; continue; }
        ranges.push({ start: m.index, end: m.index + m[0].length });
        if (re.lastIndex <= m.index) { re.lastIndex = m.index + 1; }
      }
    }
    ranges.sort(function (a, b) {
      if (a.start !== b.start) { return a.start - b.start; }
      return a.end - b.end;
    });
    var merged = [];
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if (merged.length > 0 && r.start <= merged[merged.length - 1].end) {
        if (r.end > merged[merged.length - 1].end) {
          merged[merged.length - 1].end = r.end;
        }
      } else {
        merged.push({ start: r.start, end: r.end });
      }
    }
    return merged;
  }

  // 在 text 上做关键词高亮，返回 HTML 字符串。
  // - 大小写不敏感
  // - 转义正则特殊字符（如 "C++"）
  // - 转义 HTML（防注入）
  // - 用 <mark> 包裹命中词
  function highlight(text, keywords) {
    if (text === null || text === undefined) { return ""; }
    var s = String(text);
    var ranges = findKeywordRanges(s, keywords);
    if (ranges.length === 0) {
      return escapeHtml(s);
    }
    var out = "";
    var cursor = 0;
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      out += escapeHtml(s.slice(cursor, r.start));
      out += "<mark>" + escapeHtml(s.slice(r.start, r.end)) + "</mark>";
      cursor = r.end;
    }
    out += escapeHtml(s.slice(cursor));
    return out;
  }

  // 生成带高亮的摘要片段：以第一个命中词为中心，前后各 60 字符，
  // 片段边界扩展到词边界（中文按字）。未命中时返回开头 120 字符。
  function buildSnippet(text, keywords) {
    if (text === null || text === undefined) { return ""; }
    var s = String(text);
    var ranges = findKeywordRanges(s, keywords);
    var start;
    var end;
    if (ranges.length === 0) {
      start = 0;
      end = Math.min(s.length, 120);
      end = expandRight(s, end);
    } else {
      var first = ranges[0];
      start = first.start - 60;
      if (start < 0) { start = 0; } else { start = expandLeft(s, start); }
      end = first.end + 60;
      if (end > s.length) { end = s.length; } else { end = expandRight(s, end); }
    }
    var prefix = start > 0 ? "…" : "";
    var suffix = end < s.length ? "…" : "";
    return prefix + highlight(s.slice(start, end), keywords) + suffix;
  }

  // 从用户查询串里切出关键词，用于搜索页高亮。
  // 按空白切分；同时把整串作为一个关键词（保留 "C++" 这类含特殊字符的整体）。
  function splitKeywords(q) {
    var s = (q === null || q === undefined) ? "" : String(q).trim();
    if (!s) { return []; }
    var parts = s.split(/\s+/);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) { out.push(parts[i]); }
    }
    return out;
  }

  function requestJSON(method, url, body) {
    var opts = {
      method: method,
      headers: { "Accept": "application/json" }
    };
    if (body !== undefined && body !== null) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (resp) {
      return resp.text().then(function (text) {
        var data = null;
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (e) {
            data = { error: "服务返回了非 JSON 响应（HTTP " + resp.status + "）" };
          }
        } else {
          data = {};
        }
        if (!resp.ok) {
          var emsg = (data && data.error) ? data.error : ("请求失败（HTTP " + resp.status + "）");
          throw new Error(emsg);
        }
        if (data && data.error) {
          throw new Error(data.error);
        }
        return data;
      });
    });
  }

  function formatBytes(n) {
    if (n === null || n === undefined || isNaN(n)) { return "-"; }
    var v = Number(n);
    if (v < 1024) { return v + " B"; }
    var units = ["KB", "MB", "GB", "TB"];
    var u = -1;
    do {
      v = v / 1024;
      u++;
    } while (v >= 1024 && u < units.length - 1);
    return v.toFixed(2) + " " + units[u];
  }

  function formatUptime(sec) {
    if (sec === null || sec === undefined || isNaN(sec)) { return "-"; }
    var s = Math.floor(Number(sec));
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    var ss = s % 60;
    var parts = [];
    if (d > 0) { parts.push(d + " 天"); }
    if (h > 0 || d > 0) { parts.push(h + " 时"); }
    if (m > 0 || h > 0 || d > 0) { parts.push(m + " 分"); }
    parts.push(ss + " 秒");
    return parts.join(" ");
  }

  // ---------- 搜索 ----------
  function doSearch() {
    var q = $("q").value.trim();
    var limit = parseInt($("limit").value, 10) || 20;
    var box = $("results");
    if (!q) {
      box.innerHTML = '<div class="empty">请输入关键词后再搜索</div>';
      return;
    }
    box.innerHTML = '<div class="empty">搜索中…</div>';
    var btn = $("btnSearch");
    btn.disabled = true;
    var url = API.search + "?q=" + encodeURIComponent(q) + "&limit=" + limit + "&explain=true";
    requestJSON("GET", url).then(function (data) {
      renderResults(data, q);
    }).catch(function (err) {
      box.innerHTML = '<div class="empty">搜索失败</div>';
      alert("搜索失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function renderResults(data, q) {
    var box = $("results");
    var items = [];
    if (Array.isArray(data)) {
      items = data;
    } else if (data && Array.isArray(data.results)) {
      items = data.results;
    } else if (data && Array.isArray(data.hits)) {
      items = data.hits;
    }
    if (items.length === 0) {
      box.innerHTML = '<div class="empty">未找到与“' + escapeHtml(q) + '”相关的文档</div>';
      return;
    }
    var keywords = splitKeywords(q);
    var html = "";
    for (var i = 0; i < items.length; i++) {

      var it = items[i] || {};
      var idx = i + 1;
      var title = it.title ? it.title : "(无标题)";
      var path = it.path ? it.path : "";
      var score = (it.score !== undefined && it.score !== null) ? Number(it.score).toFixed(4) : "-";
      var snippet = it.snippet ? it.snippet : "";
      html += '<div class="result-item">';
      html += '<div class="result-head">';
      var ext = "";
      var dotPos = path.lastIndexOf(".");
      if (dotPos >= 0) { ext = path.slice(dotPos + 1).toLowerCase(); }
      var typeLabel = it.file_type ? it.file_type : "";
      if (!typeLabel) {
        if (ext === "html" || ext === "htm") { typeLabel = "HTML"; }
        else if (ext === "md" || ext === "markdown") { typeLabel = "MD"; }
        else if (ext === "txt" || ext === "text") { typeLabel = "TXT"; }
        else if (ext === "pdf") { typeLabel = "PDF"; }
      }
      html += '<span class="result-idx">' + idx + '</span>';
      html += '<span class="result-title">' + highlight(title, keywords) + '</span>';

      if (typeLabel) { html += '<span class="result-type">' + escapeHtml(typeLabel) + '</span>'; }
      html += '<span class="result-score">score ' + escapeHtml(score) + '</span>';
      html += '</div>';
      html += '<div class="result-path">' + highlight(path, keywords) + '</div>';
      if (snippet) {
        html += '<div class="result-snippet">' + buildSnippet(snippet, keywords) + '</div>';
      }
      if (it.explain) {
        var ex = it.explain;
        var exBase = Number(ex.base_bm25) || 0;
        var exTitle = Number(ex.title_bonus) || 0;
        var exPhrase = Number(ex.phrase_bonus) || 0;
        var exStruct = Number(ex.structural_bonus) || 0;
        var exFinal = Number(ex.final) || 0;
        var exMax = Math.max(exBase, exTitle, exPhrase, exStruct);
        if (exMax <= 0) { exMax = 1; }
        html += '<details class="result-explain">';
        html += '<summary>为什么这篇排第一</summary>';
        html += '<div class="result-explain-row">';
        html += '<span class="result-explain-label">基础相关性</span>';
        html += '<span class="result-explain-bar"><span class="result-explain-fill" style="width:' + (exBase / exMax * 100).toFixed(2) + '%"></span></span>';
        html += '<span class="result-explain-val">' + escapeHtml(exBase.toFixed(3)) + '</span>';
        html += '</div>';
        html += '<div class="result-explain-desc">正文词频算出来的底分</div>';
        html += '<div class="result-explain-row">';
        html += '<span class="result-explain-label">标题命中加成</span>';
        html += '<span class="result-explain-bar"><span class="result-explain-fill" style="width:' + (exTitle / exMax * 100).toFixed(2) + '%"></span></span>';
        html += '<span class="result-explain-val">' + escapeHtml(exTitle.toFixed(3)) + '</span>';
        html += '</div>';
        html += '<div class="result-explain-desc">关键词出现在标题里</div>';
        html += '<div class="result-explain-row">';
        html += '<span class="result-explain-label">短语命中加成</span>';
        html += '<span class="result-explain-bar"><span class="result-explain-fill" style="width:' + (exPhrase / exMax * 100).toFixed(2) + '%"></span></span>';
        html += '<span class="result-explain-val">' + escapeHtml(exPhrase.toFixed(3)) + '</span>';
        html += '</div>';
        html += '<div class="result-explain-desc">完整短语连续出现</div>';
        html += '<div class="result-explain-row">';
        html += '<span class="result-explain-label">结构加成</span>';
        html += '<span class="result-explain-bar"><span class="result-explain-fill" style="width:' + (exStruct / exMax * 100).toFixed(2) + '%"></span></span>';
        html += '<span class="result-explain-val">' + escapeHtml(exStruct.toFixed(3)) + '</span>';
        html += '</div>';
        html += '<div class="result-explain-desc">位置与版式等结构信号</div>';
        html += '<div class="result-explain-final">综合得分 ' + escapeHtml(exFinal.toFixed(3)) + '</div>';
        html += '</details>';
      }
      html += '</div>';

    }
    box.innerHTML = html;
  }

  // ---------- 服务状态 ----------
  function refreshStats() {
    var btn = $("btnStats");
    btn.disabled = true;
    requestJSON("GET", API.stats).then(function (data) {
      var docs = (data.documents !== undefined) ? data.documents :
                 ((data.doc_count !== undefined) ? data.doc_count : (data.count));
      var bytes = (data.total_bytes !== undefined) ? data.total_bytes :
                  ((data.index_bytes !== undefined) ? data.index_bytes :
                  ((data.bytes !== undefined) ? data.bytes : (data.size_bytes)));
      var watches = (data.watches !== undefined) ? data.watches :
                    ((data.watch_count !== undefined) ? data.watch_count :
                    (data.watched_dirs));
      if (Array.isArray(watches)) { watches = watches.length; }
      var uptime = (data.uptime_sec !== undefined) ? data.uptime_sec :
                   ((data.uptime_seconds !== undefined) ? data.uptime_seconds :
                   ((data.uptime !== undefined) ? data.uptime : (data.uptime_secs)));

      $("statDocs").textContent = (docs !== undefined && docs !== null) ? docs : "-";
      $("statBytes").textContent = (bytes !== undefined && bytes !== null) ? formatBytes(bytes) : "-";
      $("statWatches").textContent = (watches !== undefined && watches !== null) ? watches : "-";
      $("statUptime").textContent = (uptime !== undefined && uptime !== null) ? formatUptime(uptime) : "-";
    }).catch(function (err) {
      alert("获取服务状态失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 建立索引 ----------
  function doIndex() {
    var p = $("indexPath").value.trim();
    var msg = $("indexMsg");
    if (!p) {
      showMsg(msg, "请输入要建立索引的文件或目录路径", false);
      return;
    }
    var btn = $("btnIndex");
    btn.disabled = true;
    hideMsg(msg);
    requestJSON("POST", API.index, { path: p }).then(function (data) {
      var scanned = (data.scanned !== undefined) ? data.scanned : 0;
      var added = (data.added !== undefined) ? data.added : 0;
      var updated = (data.updated !== undefined) ? data.updated : 0;
      var extra = "";
      if (data.removed !== undefined) {
        extra += "，移除 " + data.removed;
      }
      if (data.skipped !== undefined) {
        extra += "，跳过 " + data.skipped;
      }
      showMsg(msg, "索引完成：扫描 " + scanned + "，新增 " + added + "，更新 " + updated + extra, true);
      refreshStats();
    }).catch(function (err) {
      showMsg(msg, "建立索引失败：" + err.message, false);
      alert("建立索引失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 监控 ----------
  function renderWatches(paths) {
    var box = $("watchList");
    if (!paths || paths.length === 0) {
      box.innerHTML = '<div class="empty">暂无监控目录</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < paths.length; i++) {
      var p = paths[i];
      html += '<div class="watch-item">';
      html += '<span class="path">' + escapeHtml(p) + '</span>';
      html += '<button class="danger" data-path="' + escapeHtml(p) + '">移除</button>';
      html += '</div>';
    }
    box.innerHTML = html;
    var btns = box.querySelectorAll("button.danger");
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener("click", onRemoveWatch);
    }
  }

  function loadWatches() {
    requestJSON("GET", API.watch).then(function (data) {
      var paths = [];
      if (Array.isArray(data)) {
        paths = data;
      } else if (data && Array.isArray(data.paths)) {
        paths = data.paths;
      } else if (data && Array.isArray(data.watches)) {
        paths = data.watches;
      }
      renderWatches(paths);
    }).catch(function (err) {
      alert("获取监控目录失败：" + err.message);
    });
  }

  function addWatch() {
    var p = $("watchPath").value.trim();
    var msg = $("watchMsg");
    if (!p) {
      showMsg(msg, "请输入要监控的目录路径", false);
      return;
    }
    var btn = $("btnWatch");
    btn.disabled = true;
    hideMsg(msg);
    requestJSON("POST", API.watch, { path: p }).then(function (data) {
      showMsg(msg, "已添加监控：" + p, true);
      $("watchPath").value = "";
      if (data && Array.isArray(data.paths)) {
        renderWatches(data.paths);
      } else {
        loadWatches();
      }
      refreshStats();
    }).catch(function (err) {
      showMsg(msg, "添加监控失败：" + err.message, false);
      alert("添加监控失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function onRemoveWatch(ev) {
    var btn = ev.currentTarget;
    var p = btn.getAttribute("data-path");
    if (!p) { return; }
    btn.disabled = true;
    var url = API.watch + "?path=" + encodeURIComponent(p);
    requestJSON("DELETE", url).then(function (data) {
      if (data && Array.isArray(data.paths)) {
        renderWatches(data.paths);
      } else {
        loadWatches();
      }
      refreshStats();
    }).catch(function (err) {
      alert("移除监控失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  // ---------- 自然语言定位 ----------
  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^$()|[\]\\{}]/g, "\\$&");
  }

  function highlightTerms(text, terms) {
    var esc = escapeHtml(text);
    if (!terms || terms.length === 0) { return esc; }
    var sorted = terms.slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < sorted.length; i++) {
      var t = sorted[i];
      if (!t) { continue; }
      var re = new RegExp(escapeRegExp(escapeHtml(t)), "gi");
      esc = esc.replace(re, "<em>$&</em>");
    }
    return esc;
  }

  function doLocate() {
    var q = $("lq").value.trim();
    var limit = parseInt($("llimit").value, 10) || 5;
    var box = $("locateResults");
    if (!q) {
      box.innerHTML = '<div class="empty">请先输入问题</div>';
      return;
    }
    box.innerHTML = '<div class="empty">定位中…</div>';
    var btn = $("btnLocate");
    btn.disabled = true;
    var url = API.locate + "?q=" + encodeURIComponent(q) + "&limit=" + limit;
    requestJSON("GET", url).then(function (data) {
      renderAnchors(data, q);
    }).catch(function (err) {
      box.innerHTML = '<div class="empty">定位失败</div>';
      alert("定位失败：" + err.message);
    }).then(function () {
      btn.disabled = false;
    });
  }

  function renderAnchors(data, q) {
    var box = $("locateResults");
    var anchors = (data && Array.isArray(data.anchors)) ? data.anchors : [];
    var keywords = (data && Array.isArray(data.keywords)) ? data.keywords : [];
    if (anchors.length === 0) {
      box.innerHTML = '<div class="empty">未找到与“' + escapeHtml(q) + '”相关的原文段落，换个说法试试</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i] || {};
      var idx = i + 1;
      var path = a.path ? a.path : "";
      var ls = (a.line_start !== undefined) ? a.line_start : "-";
      var le = (a.line_end !== undefined) ? a.line_end : "-";
      var score = (a.score !== undefined && a.score !== null) ? Number(a.score).toFixed(3) : "-";
      var terms = (a.matched_terms && a.matched_terms.length) ? a.matched_terms : keywords;
      var text = a.text ? a.text : "";
      html += '<div class="result-item">';
      html += '<div class="result-head">';
      html += '<span class="result-idx">' + idx + '</span>';
      html += '<span class="result-title">' + escapeHtml(path) + '</span>';
      html += '<span class="result-score">score ' + escapeHtml(score) + '</span>';
      html += '</div>';
      html += '<div class="result-loc">第 <b>' + escapeHtml(String(ls)) + '</b>–<b>' + escapeHtml(String(le)) + '</b> 行</div>';
      if (text) {
        html += '<div class="result-snippet">' + highlightTerms(text, terms) + "</div>";
      }
      html += "</div>";
    }
    // 换行保留：段落内换行转 <br>
    html = html.split("\n").join("<br>");
    box.innerHTML = html;
  }

  // ---------- 事件绑定与初始化 ----------
  function bindEnter(inputId, fn) {
    $(inputId).addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { fn(); }
    });
  }
  $("btnSearch").addEventListener("click", doSearch);
  bindEnter("q", doSearch);
  $("btnStats").addEventListener("click", refreshStats);
  $("btnIndex").addEventListener("click", doIndex);
  bindEnter("indexPath", doIndex);
  $("btnWatch").addEventListener("click", addWatch);
  bindEnter("watchPath", addWatch);
  $("btnLocate").addEventListener("click", doLocate);
  bindEnter("lq", doLocate);
  loadWatches();
  refreshStats();
})();
</script>
</body>
</html>
