# Dependabot 依赖自动更新配置（v2.5 生产级补强第 4 轮）。
# 说明：本仓库的 CI 暂时放在各项目自己的 .github 目录下，
# 根目录迁移被 token 权限卡住，所以这份配置也先放这里。
version: 2
updates:
  # Maven：跟踪 pom.xml 里声明的依赖版本（含 springdoc 2.6.0、resilience4j、logstash encoder 等）
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions：跟踪 .github/workflows 下的 action 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Docker：跟踪 compose.yml / Dockerfile 里的基础镜像 tag
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
