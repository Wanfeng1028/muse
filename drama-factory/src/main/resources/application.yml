spring:
  application:
    name: drama-factory
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/drama-factory}
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # 启用 Flyway 版本化迁移
    enabled: true
    # 老库首次启动时以基线方式接入，不重跑 V1；新库完整执行 V1
    baseline-on-migrate: true
  task:
    scheduling:
      shutdown:
        # 应用关闭时等待调度线程池中在途任务执行完毕
        await-termination: true
        # 等待在途任务完成的最长时间，超过则强制关闭
        await-termination-period: 30s

server:
  port: ${PORT:8081}
  # POC 无鉴权，仅绑本地回环，不许改成 0.0.0.0 对外暴露
  address: 127.0.0.1
  # 优雅关闭：收到关闭信号后先停止接收新请求，等待在途请求处理完成再退出
  shutdown: graceful

management:
  # v2.4 生产级补强第 3 轮：只暴露 prometheus 端点（/actuator/prometheus），
  # 供 Prometheus 抓取；不经过 /api/**，不受 JwtAuthFilter 鉴权影响
  endpoints:
    web:
      exposure:
        include: prometheus

# v2.5 生产级补强第 4 轮：OpenAPI 文档端点。
# /v3/api-docs 与 /swagger-ui/** 默认公开——JwtAuthFilter 只拦 /api/**，这两个路径不在里面。
# 生产环境不要把本服务直接暴露到公网，否则接口文档会被人随手翻。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    docExpansion: none

drama:
  script:
    llm:
      enabled: ${DRAMA_SCRIPT_LLM_ENABLED:true}
      model: ${DRAMA_SCRIPT_LLM_MODEL:Deepseek-v4-flash}
      max-tokens: ${DRAMA_SCRIPT_LLM_MAX_TOKENS:3000}
      timeout-seconds: ${DRAMA_SCRIPT_LLM_TIMEOUT_SECONDS:120}
      max-retries: ${DRAMA_SCRIPT_LLM_MAX_RETRIES:2}
      # CLI 回退：受限环境（Java 出站被拦截）下 HTTP 失败时改调 chat.py；
      # 为空则自动探测 ~/workspace/skills/weixin-chatapi/bin/chat.py，探测不到则无回退
      cli-path: ${DRAMA_SCRIPT_LLM_CLI_PATH:}
  video:
    provider: ${VIDEO_PROVIDER:mock}
    poll-interval-ms: ${VIDEO_POLL_MS:10000}
    max-attempts: ${VIDEO_MAX_ATTEMPTS:8}
  storage: ${DRAMA_STORAGE:./data/media}
  ffmpeg: ${FFMPEG_PATH:ffmpeg}
  ffprobe: ${FFPROBE_PATH:ffprobe}

logging:
  # JSON 结构化日志：设置环境变量 SPRING_PROFILES_ACTIVE=json 即切换为 Logstash JSON 输出（含 request_id）
  level:
    com.dramafactory: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

resilience4j:
  circuitbreaker:
    instances:
      agnes:
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      agnes:
        # 单次 provider 调用超时上限；HttpClient 自身另有 60s 请求超时
        timeout-duration: 90s
  ratelimiter:
    instances:
      videoSubmit:
        # 视频任务提交接口：每 10 秒最多 10 次，超限立即返回 429
        limit-for-period: 10
        limit-refresh-period: 10s
        timeout-duration: 0s

# 资源方 JWT 验签：与 auth-service 共用 AUTH_JWT_SECRET；为空=开放模式
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
