<title>{{TITLE}}</title>
<style>
/* Audition page for library sound effects (studio.py audition): every candidate per kind, playable, with its licence
   and what earshot heard. The owner picks by ear and the picks become catalog roles (studio.py role). */
:root {
  --bg: #f6f5f1; --panel: #ffffff; --line: #dedbd3; --ink: #1d1c1a; --muted: #6b675f; --accent: #b4532a; --ok: #2f6b3a;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f0f0e; --panel: #181816; --line: #2c2b28; --ink: #e9e7e2; --muted: #9b978e; --accent: #e07a4a; --ok: #7cc48a; }
}
:root[data-theme="dark"] { --bg: #0f0f0e; --panel: #181816; --line: #2c2b28; --ink: #e9e7e2; --muted: #9b978e; --accent: #e07a4a; --ok: #7cc48a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 28px; }
h1 { font-size: clamp(24px, 4vw, 34px); line-height: 1.15; margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 68ch; }
h2 { font-size: 18px; margin: 0 0 4px; text-transform: capitalize; }
.q { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.c { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 6px; min-width: 0; }
.c.role { border-color: var(--ok); }
.k { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.m { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; margin-right: 4px; }
.b-role { color: var(--ok); border: 1px solid var(--ok); }
.b-top { color: var(--accent); border: 1px solid var(--accent); }
audio { width: 100%; }
.foot { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{LEDE}}</p>
  </header>
  {{SECTIONS}}
  <p class="foot">{{FOOT}}</p>
</main>
