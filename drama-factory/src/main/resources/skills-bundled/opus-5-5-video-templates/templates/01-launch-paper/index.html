            bands.forEach((b) => {
              const u = E.outQuad(prog(t, b.s0, b.s0 + b.d));
              b.el.style.opacity = t >= 11.18 ? 1 : 0;
              b.el.style.transform = `translateX(${b.dir * u * 1320}px)`;
            });
          }

          // ----- end card -----
          const endOn = t >= 11.18;
          show($("svgG"), endOn); show($("word"), endOn); show($("tag"), endOn && t >= 12.9); show($("url"), endOn); show($("disc"), endOn);
          if (endOn) {
            const au = prog(t, 11.5, 12.38), ghostOut = 1 - prog(t, 12.8, 13.5);
            arcGhostEls.forEach((c, i) => { c.style.opacity = au > arcGhostU[i] + 0.03 ? ghostOut : 0; });
            let d = ""; const n = Math.round(60 * au);
            for (let i = 0; i <= n; i++) { const p = arcPt(au * (i / Math.max(1, n))); d += (i ? " L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }
            $("arcDots").setAttribute("d", au > 0 ? d : ""); $("arcDots").style.opacity = ghostOut;
            draw($("ring"), E.inOutCubic(prog(t, 11.66, 12.02))); $("ring").style.opacity = 1 - prog(t, 12.52, 12.62);
            show($("mark"), t >= 12.48);
            const iu = E.outBack(prog(t, 12.48, 12.74), 1.4);
            $("iconWrap").style.transformOrigin = `${SUN[0]}px ${SUN[1]}px`;
            $("iconWrap").style.transform = `scale(${Math.max(0.001, lerp(0.14, 1, iu))})`;
            $("sunC").style.opacity = t >= 12.54 ? 1 : 0;
            draw($("frame"), E.inOutCubic(prog(t, 12.6, 12.9)));
            const mu = E.outBack(prog(t, 12.7, 12.9), 1.3);
            $("mountG").style.transformOrigin = "430px 670px"; $("mountG").style.transform = `scaleY(${Math.max(0, mu)})`;
            const su = E.outBack(prog(t, 12.86, 13.06), 2.2);
            $("spark").style.transformOrigin = "637px 245px"; $("spark").style.transform = `scale(${Math.max(0, su)}) rotate(${(1 - clamp(su)) * -70}deg)`;
            $("disc").style.opacity = prog(t, 13.9, 14.2);
            wordSpans.forEach((s, i) => {
              const u = prog(t, 12.56 + i * 0.038, 12.56 + i * 0.038 + 0.2);
              s.style.opacity = u; const c = Math.round(lerp(190, 16, u));
              s.style.color = `rgb(${c},${c + 1},${Math.max(12, c - 4)})`;
              s.style.transform = `translateX(${(1 - E.outCubic(u)) * 14}px)`;
            });
            const tp = prog(t, 12.95, 13.55) * 125 - 15;
            $("tag").style.webkitMaskImage = $("tag").style.maskImage = `linear-gradient(90deg, #000 ${tp}%, rgba(0,0,0,0.35) ${tp + 8}%, transparent ${tp + 16}%)`;
            $("url").style.opacity = prog(t, 13.55, 13.78);
            draw($("urlRing"), E.inOutCubic(prog(t, 13.76, 14.12)));
          }
        }

        window.__render = render;
        render(0);
        const state = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
