    <script>
      (function () {
        const v = K.vars();
        K.bind(v);
        const $ = K.$, E = K.E, P = K.prog, C = K.clamp, L = K.lerp, R = K.rnd;
        const DUR = 20, TAU = Math.PI * 2;
        const ioq = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const px = (n) => n.toFixed(1) + "px";
        const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        const blurS = (b) => (b > 0.25 ? "blur(" + b.toFixed(1) + "px)" : "none");
        const hex = (h) => { const n = parseInt(String(h).replace("#", ""), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
        const mixC = (a, b, u) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((x, i) => Math.round(L(x, B[i], u))).join(",") + ")"; };
        const list = (s) => String(s).split(";").map((x) => x.trim());
        const fmtN = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        const OR = v.orange, INK = v.ink;
        const AVC = [["#f2a65a", "#c2582e"], ["#7fb3e6", "#3b6fb0"], ["#e8c07a", "#9a6b2f"], ["#9fd3a9", "#3f8a58"], ["#d9a0c9", "#8d4a7c"], ["#a7b0f0", "#5563c7"]];
        const avatar = (el, name, k) => { const c = AVC[k % AVC.length]; el.style.background = "linear-gradient(140deg," + c[0] + "," + c[1] + ")"; el.textContent = name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); };
        const RET = (c) => '<svg viewBox="0 0 24 24"><path d="M19 6v5.5a2 2 0 0 1-2 2H6.5M10 9.5l-4 4 4 4" fill="none" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const CHK = (c, w) => '<svg viewBox="0 0 24 24" style="width:' + w + "px;height:" + w + 'px"><path d="M5.5 12.5l4.2 4.2L18.5 8" fill="none" stroke="' + c + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        // ---------- surface states: [w, h, radius (-1 = round), colour] ----------
        const S = {
          logo: [450, 126, -1, INK], btn: [585, 126, -1, INK], input: [702, 104, -1, "#ffffff"], card: [619, 416, 31, "#ffffff"],
          spin: [211, 211, -1, INK], dot: [81, 81, -1, OR], sphere: [832, 832, -1, "#ffffff"], mdot: [76, 76, -1, OR],
          match: [621, 126, -1, INK], list: [576, 450, 36, INK], tabs: [630, 351, 31, "#ffffff"], event: [630, 414, 31, "#ffffff"],
          search: [666, 407, 31, "#ffffff"], end: [450, 126, -1, INK],
        };
        // [from, to, t0, t1, colour window start, colour window end, new-content delay]
        const M = [
          ["logo", "btn", 0.95, 1.22], ["btn", "input", 1.8, 2.08, 0.3, 0.9], ["input", "card", 3.24, 3.46], ["card", "spin", 4.5, 4.74, 0.1, 0.6, 0, null, 0.95],
          ["spin", "dot", 5.62, 5.88, 0.5, 1, 0, "out"], ["dot", "sphere", 6.48, 6.62, 0, 0.45, 0, "out"], ["sphere", "mdot", 9.45, 9.95, 0.7, 1, 0, "out"], ["mdot", "match", 10.1, 10.34],
          ["match", "list", 10.95, 11.22], ["list", "tabs", 12.1, 12.45, 0.4, 1], ["tabs", "event", 13.95, 14.2, 0, 0.45, 0.14],
          ["event", "search", 15.6, 15.85, 0, 0.45, 0.22], ["search", "end", 18.15, 18.72, 0.55, 1],
        ];
        const shellAt = (t) => {
          let a = "logo", b = "logo", ul = 0, c0 = 0, c1 = 0.45, dl = 0, ez = ioq, r1 = 0.35, win = false;
          for (const m of M) { if (t >= m[3]) { a = b = m[1]; ul = 0; } else if (t >= m[2]) { a = m[0]; b = m[1]; ul = P(t, m[2], m[3]); if (m[4] != null) { c0 = m[4]; c1 = m[5]; win = true; } dl = m[6] || 0; if (m[7] === "out") ez = E.outQuad; if (m[8]) r1 = m[8]; break; } else break; }
          const A = S[a], B = S[b], u = ez(ul), rU = r1 > 0.5 ? ioq(P(ul, 0, r1)) : E.outCubic(P(ul, 0, r1)), cU = win ? ioq(P(ul, c0, c1)) : E.outCubic(P(ul, c0, c1));
          const w = L(A[0], B[0], u), h = L(A[1], B[1], u), half = Math.min(w, h) / 2;
          return { w, h, r: L(A[2] < 0 ? half : A[2], B[2] < 0 ? half : B[2], rU), col: mixC(A[3], B[3], cU), a, b, u, ul, dl };
        };

        // ---------- contents ----------
        const CONT = {};
        Object.keys(S).forEach((k) => { const c = $("c-" + k); if (!c) return; CONT[k] = c; c.style.width = px(S[k][0]); c.style.height = px(S[k][1]); c.style.left = px(-S[k][0] / 2); c.style.top = px(-S[k][1] / 2); });
        document.querySelectorAll(".bn").forEach((e) => { e.textContent = v.brand; });
        $("c-btn").textContent = v.cta;
        $("inKey").innerHTML = RET("#8d8d8d");
        $("pAsk").textContent = v.askLabel; avatar($("pAv"), v.name, 0);
        $("pName").textContent = v.name; $("pHandle").textContent = "@" + v.handle + " · " + v.followers; $("pBio").textContent = v.bio;
        $("pCountry").querySelector("span").textContent = v.country; $("pNot").textContent = v.notMe; $("pYes").textContent = v.thatsMe;
        $("onMap").textContent = v.onMap;
        $("gCount").querySelector("span").textContent = v.makersWord;
        const PEOPLE = list(v.people).map((s) => { const i = s.indexOf(","); return [s.slice(0, i).trim(), s.slice(i + 1).trim()]; });
        const header = (w) => '<div class="av" style="left:29px;top:29px;width:68px;height:68px;font-size:22px;border:3px solid #141414"></div><div class="av" style="left:73px;top:29px;width:68px;height:68px;font-size:22px;border:3px solid #141414"></div><div class="av" style="left:117px;top:29px;width:68px;height:68px;font-size:22px;border:3px solid #141414"></div><div class="mt abs" style="left:212px;top:31px"><b>' + esc(v.matches) + "</b><span>" + esc(v.matchesSub) + '</span></div><div class="mdot" style="left:' + (w - 74) + 'px;top:40.5px"><i></i></div>';

        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(lastT));
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
</html>
