      (function () {

        const MBF = {};
        const mblur = (el, key, sx, sy) => {

            const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter");
            f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-50%"); f.setAttribute("y", "-50%"); f.setAttribute("width", "200%"); f.setAttribute("height", "200%");
            g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g);
            let defs = document.getElementById("mbDefs");
            if (!defs) { const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute"; defs = document.createElementNS(ns, "defs"); defs.id = "mbDefs"; svg.appendChild(defs); document.body.appendChild(svg); }
            defs.appendChild(f); MBF[key] = g;
          }

        };
        const hex = (h) => { const n = parseInt(String(h).replace("#", ""), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
        const mixC = (a, b, u) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((x, i) => Math.round(L(x, B[i], u))).join(",") + ")"; };
        const words = (el, text) => { el.innerHTML = text.split(" ").map((w) => '<span class="w">' + esc(w) + "</span>").join('<span class="w"> </span>'); return [...el.querySelectorAll(".w")].filter((w) => w.textContent !== " "); };
        const GL = "abcdefghijklmnopqrstuvwxyz";

        const cIcon = $("c-icon"), cPlus = $("c-plus"), cPill = $("c-pill"), cCard = $("c-card"), cTabs = $("c-tabs"), cWeek = $("c-week"), cWid = $("c-wid"), cBook = $("c-book"), cCheck = $("c-check");

        const wTitleW = words($("wTitle"), v.weekTitle), habEls = [...cWeek.querySelectorAll(".hab")];

        habEls.forEach((h, r) => { for (let c = 0; c < 7; c++) { const s = document.createElement("div"); s.className = "sq"; s.style.left = px(345 + c * 53); h.appendChild(s); SQ.push({ el: s, r, c, on: c < FILL[r] }); } });
        cWid.innerHTML = '<div id="wiT"></div><div id="wiS"></div><div id="wiB">' + I.book(ACC) + '</div><div id="wiP"><svg viewBox="0 0 98 98"><circle cx="49" cy="49" r="29" fill="none" stroke="#3d3d42" stroke-width="6"/><circle id="wiRing" cx="49" cy="49" r="29" fill="none" stroke="' + ACC + '" stroke-width="6" stroke-linecap="round" pathLength="1" transform="rotate(-90 49 49)"/><path d="M44 39.5v19l15-9.5z" fill="' + ACC + '"/></svg></div><div id="wiA"><svg viewBox="0 0 56 56"><rect x="6" y="6" width="44" height="44" rx="10" fill="none" stroke="' + ACC + '" stroke-width="4"/><path d="M28 17v22M17 28h22" stroke="' + ACC + '" stroke-width="4" stroke-linecap="round"/></svg></div>';

        const bTitleW = words($("bTitle"), v.bookTitle);
        $("bProg").textContent = v.progress; $("bTime").querySelector("span").textContent = v.timeLeft;
        cCheck.innerHTML = '<svg viewBox="0 0 24 24" style="width:110px;height:110px"><path id="ckP" d="M5.5 12.6l4.4 4.4L18.8 7.8" fill="none" stroke="#fff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>';

        const S = {
          icon: [240, 240, 54, v.iconBg], plus: [180, 180, -1, ACC], pill: [496, 100, -1, "#5b5b5f"], card: [568, 298, 38, "#434346"],

        };
        const CONT = { icon: cIcon, plus: cPlus, pill: cPill, card: cCard, tabs: cTabs, week: cWeek, wid: cWid, book: cBook, check: cCheck };
        Object.keys(CONT).forEach((k) => { const c = CONT[k], s = S[k]; c.style.width = px(s[0]); c.style.height = px(s[1]); c.style.left = px(-s[0] / 2); c.style.top = px(-s[1] / 2); });
        cPill.style.justifyContent = "center";
        // morphs: [from, to, t0, t1]
        // [from, to, t0, t1, colour window as a fraction of the morph]
        const M = [["icon", "plus", 1.0, 1.25], ["plus", "pill", 1.8, 2.05, 0.4, 0.75], ["pill", "card", 2.95, 3.26], ["card", "tabs", 4.12, 4.38], ["tabs", "week", 5.92, 6.2], ["week", "wid", 7.12, 7.4], ["wid", "book", 8.3, 8.56], ["book", "check", 9.0, 9.26, 0.45, 0.8]];
        const shellAt = (t) => {
          let a = "icon", b = "icon", ul = 0, c0 = 0, c1 = 0.45;
          for (const m of M) { if (t >= m[3]) { a = b = m[1]; ul = 0; } else if (t >= m[2]) { a = m[0]; b = m[1]; ul = P(t, m[2], m[3]); if (m[4] != null) { c0 = m[4]; c1 = m[5]; } break; } else break; }
          // size eases in and out; corner radius (and usually colour) lead so the new shape reads early
          const A = S[a], B = S[b], u = ioq(ul), rU = E.outCubic(P(ul, 0, 0.35)), cU = E.outCubic(P(ul, c0, c1));
          const w = L(A[0], B[0], u), h = L(A[1], B[1], u), half = Math.min(w, h) / 2;
          const r = L(A[2] < 0 ? half : A[2], B[2] < 0 ? half : B[2], rU);
          return { w, h, r, col: mixC(A[3], B[3], cU), orange: (a === "book" ? 1 - cU : 0) + (b === "book" ? cU : 0), a, b, u, ul };
        };
        // the frame's centre: the tab bar slides under the cursor, everything else sits in the middle
        const TABC = [[4.12, 560], [4.38, 800], [4.5, 836], [4.62, 830], [4.78, 830], [4.95, 640], [5.1, 640], [5.28, 450], [5.92, 452], [6.2, 540]];
        const frameX = (t) => {
          if (t < TABC[0][0] || t >= TABC[TABC.length - 1][0]) return 540;
          for (let k = 0; k < TABC.length - 1; k++) if (t < TABC[k + 1][0]) { const u = (t - TABC[k][0]) / (TABC[k + 1][0] - TABC[k][0]); return L(TABC[k][1], TABC[k + 1][1], k === 1 ? E.outCubic(u) : ioq(u)); }
          return 540;
        };
        // cursor keyframes [t, x, y] (fingertip) and taps
        const CK = [[0.9, 900, 830], [1.1, 812, 745], [1.3, 668, 625], [1.5, 616, 600], [1.62, 598, 590], [1.75, 590, 596], [1.9, 450, 607], [2.05, 392, 598], [2.25, 466, 457], [2.5, 540, 353], [2.75, 545, 450], [2.85, 545, 490], [2.95, 547, 600], [3.1, 553, 713], [3.4, 600, 736], [3.65, 690, 738], [3.9, 650, 700], [4.02, 566, 562], [4.2, 506, 443], [4.4, 560, 420], [4.62, 552, 530], [4.8, 556, 480], [5.0, 552, 530], [5.15, 556, 482], [5.33, 552, 530], [5.6, 556, 522], [5.9, 603, 592], [6.05, 670, 749], [6.4, 866, 623], [6.7, 974, 540], [7.0, 934, 540], [7.35, 353, 556], [7.6, 315, 556], [7.85, 430, 600], [7.95, 447, 606], [8.1, 472, 612], [8.4, 477, 619], [8.7, 670, 506], [8.9, 832, 432], [9.1, 770, 455], [9.3, 446, 675], [9.5, 330, 820]];
        const TAPS = [1.62, 2.85, 4.02, 4.62, 5.0, 5.33, 7.95, 8.9];
        const cursorAt = (t) => {
          if (t <= CK[0][0]) return [CK[0][1], CK[0][2], 0];
          for (let k = 0; k < CK.length - 1; k++) if (t < CK[k + 1][0]) { const u = ioq((t - CK[k][0]) / (CK[k + 1][0] - CK[k][0])); return [L(CK[k][1], CK[k + 1][1], u), L(CK[k][2], CK[k + 1][2], u), k]; }
          const l = CK[CK.length - 1]; return [l[1], l[2], CK.length - 1];
        };
        const press = (t) => TAPS.reduce((m, a) => Math.max(m, bump(t, a - 0.02, a + 0.12)), 0);

        function render(t) {
          const endOn = t >= 10.02;
          K.show($("endL"), endOn);
          const sh = shellAt(t), frame = $("frame"), shell = $("shell");
          // icon spins in
          let rot = 0, sc = 1, fy = 540, op = 1, fb = 0;
          if (t < 1.0) {
            const u = P(t, 0, 0.95);
            sc = L(0.5, 1, E.outQuad(u));
            const key = (ks) => { for (let k = 0; k < ks.length - 1; k++) if (t < ks[k + 1][0]) return L(ks[k][1], ks[k + 1][1], (1 - Math.cos(Math.PI * P(t, ks[k][0], ks[k + 1][0]))) / 2); return ks[ks.length - 1][1]; };
            rot = key([[0, -30], [0.1, -20], [0.3, 6], [0.5, -3], [0.7, 1], [0.9, 0]]);
            fy = key([[0, 600], [0.1, 574], [0.3, 522], [0.5, 549], [0.8, 537], [1.0, 540]]);
            op = C(0.35 + u * 2); fb = 7 * Math.pow(1 - C(u * 1.6), 2);
          }
          // pill arrives tilted
          if (t >= 1.95 && t < 2.5) rot = -8 * bump(t, 1.95, 2.5) * (t < 2.22 ? 1 : 1);
          const press1 = press(t) * (t > 1.5 ? 1 : 0);
          sc *= 1 - 0.035 * press1;
          const fx = frameX(t);
          frame.style.transform = "translate(" + px(fx) + "," + px(fy) + ") rotate(" + rot.toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
          frame.style.opacity = t >= 10.02 ? "0" : op.toFixed(3);
          const mb = M.reduce((m, x) => Math.max(m, bump(t, x[2], x[3])), 0);
          shell.style.width = px(sh.w); shell.style.height = px(sh.h); shell.style.left = px(-sh.w / 2); shell.style.top = px(-sh.h / 2);
          shell.style.borderRadius = px(sh.r); shell.style.background = sh.col;
          $("shellO").style.opacity = sh.orange.toFixed(3);
          const slide = t >= 4.12 && t < 6.3 ? Math.abs(frameX(t + 0.02) - frameX(t - 0.02)) / 0.04 : 0;
          if (slide > 600) mblur(frame, "fr", Math.min(22, (slide - 600) / 120), 0); else frame.style.filter = blurS(fb + 9 * mb);
          shell.style.boxShadow = sh.a === "tabs" || sh.b === "tabs" ? "none" : "0 " + px(10 + 8 * (sh.w / 700)) + " " + px(26) + " rgba(20,20,40," + (sh.a === "icon" ? 0.22 : 0.16) + ")";
          // gloss sweep over the icon
          $("gloss").style.opacity = t < 1.05 ? "1" : "0";
          $("gloss").style.backgroundPosition = (L(120, -40, P(t, 0.25, 0.85))).toFixed(1) + "% 0";
          // contents
          Object.keys(CONT).forEach((k) => {
            const c = CONT[k], N = S[k];
            let o = 0;
            if (sh.a === k && sh.b === k) o = 1;
            else if (sh.a === k) o = 1 - P(sh.ul, 0.4, 0.85);
            else if (sh.b === k) o = P(sh.ul, 0.3, 0.8);
            K.show(c, o > 0.002);
            if (o <= 0.002) return;
            c.style.opacity = o.toFixed(3);
            c.style.transform = sh.a === sh.b ? "none" : "scale(" + (sh.w / N[0]).toFixed(4) + "," + (sh.h / N[1]).toFixed(4) + ")";
          });
          // pill words drop in, tilted
          pillW.forEach((w, k) => { const a = 1.98 + k * 0.06, u = E.outBack(P(t, a, a + 0.22), 1.4); w.style.transform = "translateY(" + px(-26 * (1 - C(u, 0, 1.2))) + ") rotate(" + (-12 * (1 - C(u))).toFixed(2) + "deg)"; w.style.opacity = C(u * 2).toFixed(3); w.style.filter = blurS(8 * (1 - C(u))); });
          // form card: title types, rows scramble in
          if (t >= 3.0 && t < 4.2) {
            const tu = P(t, 3.08, 3.4);
            const full = v.cardTitle, cut = full.indexOf(" ");
            cTitle.innerHTML = esc(scr(full, tu, 3, t));
            cTitle.style.transform = "scale(" + (1 + 0.06 * bump(t, 3.2, 3.42)).toFixed(3) + ")"; cTitle.style.transformOrigin = "0 50%";
            ROWS.forEach((r, k) => {
              const a = 3.1 + k * 0.05, u1 = P(t, a, a + 0.4), u2 = P(t, a + 0.12, a + 0.62);
              rowEls[k].querySelector(".l").textContent = scr(r[0], u1, 11 + k, t);
              rowEls[k].querySelector(".v").textContent = scr(r[1], u2, 21 + k, t);
              rowEls[k].style.opacity = C(P(t, a - 0.04, a + 0.1)).toFixed(3);
            });
          }
          // tab bar: the tab under the cursor lights up
          const TT = [4.62, 5.0, 5.33], act = t >= TT[2] ? 2 : t >= TT[1] ? 1 : t >= TT[0] ? 0 : -1;
          tabEls.forEach((tb, k) => { const on = k === act; tb.style.color = on ? "#fff" : "#5d5d62"; tb.style.transform = on ? "scale(" + (1 + 0.08 * bump(t, TT[k], TT[k] + 0.25)).toFixed(3) + ")" : "none"; });
          // week card
          if (t >= 6.05 && t < 7.2) {
            wTitleW.forEach((w, k) => { const a = 6.14 + k * 0.07, u = E.outBack(P(t, a, a + 0.2), 1.6); w.style.transform = "translateY(" + px(-18 * (1 - C(u, 0, 1.2))) + ")"; w.style.opacity = C(u * 2).toFixed(3); w.style.filter = blurS(6 * (1 - C(u))); });
            habEls.forEach((h, k) => { const u = E.outCubic(P(t, 6.24 + k * 0.08, 6.5 + k * 0.08)); h.querySelector("span").style.opacity = u.toFixed(3); h.querySelector("span").style.transform = "translateX(" + px(-14 * (1 - u)) + ")"; });
            $("wRange").style.opacity = P(t, 6.3, 6.5).toFixed(3);
            SQ.forEach((q) => { const a = 6.52 + q.c * 0.09 + q.r * 0.05, u = q.on ? E.outBack(P(t, a, a + 0.16), 2.2) : 0; q.el.style.background = q.on && u > 0 ? mixC("#2a2a2d", ACC, C(u)) : "#2a2a2d"; q.el.style.transform = "scale(" + (q.on ? L(0.8, 1, C(u, 0, 1.25)) : 1).toFixed(3) + ")"; q.el.style.opacity = C(P(t, 6.3 + q.c * 0.02, 6.45 + q.c * 0.02)).toFixed(3); });
          }
          // widget
          if (t >= 7.3 && t < 8.4) {
            const tu = P(t, 7.4, 7.62);
            $("wiT").innerHTML = esc(scr(v.h3, tu, 5, t)).replace(/ (\S+)$/, "<br>$1");
            $("wiS").textContent = scr(v.widSub, P(t, 7.55, 8.1), 9, t);
            const bu = E.outBack(P(t, 7.38, 7.6), 1.8);
            $("wiB").style.transform = "scale(" + C(bu, 0, 1.2).toFixed(3) + ")";
            const ring = $("wiRing"), ru = E.outCubic(P(t, 7.96, 8.3)) * 0.72;
            ring.style.strokeDasharray = "1"; ring.style.strokeDashoffset = String(1 - ru); ring.style.visibility = ru > 0.001 ? "visible" : "hidden";
            $("wiP").style.transform = "scale(" + (1 - 0.08 * bump(t, 7.93, 8.08)).toFixed(3) + ")";
          }
          // book card
          if (t >= 8.45 && t < 9.1) {
            const cu = E.outCubic(P(t, 8.5, 8.72));
            $("bCover").style.transform = "translateX(" + px(-30 * (1 - cu)) + ")"; $("bCover").style.opacity = cu.toFixed(3);
            bTitleW.forEach((w, k) => { const a = 8.56 + k * 0.08, u = E.outBack(P(t, a, a + 0.2), 1.5); w.style.transform = "translateY(" + px(-16 * (1 - C(u, 0, 1.2))) + ")"; w.style.opacity = C(u * 2).toFixed(3); w.style.filter = blurS(6 * (1 - C(u))); });
            $("bProg").style.opacity = P(t, 8.7, 8.85).toFixed(3); $("bTime").style.opacity = P(t, 8.72, 8.88).toFixed(3);
            $("bIcon").style.transform = "scale(" + (1 - 0.1 * bump(t, 8.88, 9.0)).toFixed(3) + ")";
          }
          // check
          if (t >= 9.1) {
            const pu = E.outBack(P(t, 9.2, 9.42), 2.2);
            cCheck.style.transform = "scale(" + C(L(0.6, 1, pu), 0, 1.2).toFixed(3) + ")";
            K.draw($("ckP"), E.outCubic(P(t, 9.26, 9.46)));
          }
          // end card
          if (endOn) {
            const u = E.outCubic(P(t, 10.05, 10.5));
            const e = $("endT");
            e.style.opacity = u.toFixed(3); e.style.filter = blurS(12 * (1 - u));
            e.style.transform = "scale(" + L(0.94, 1, u).toFixed(3) + ")";
            const g = 0.55 + 0.15 * Math.sin((t - 10) * 3);
            e.style.textShadow = "0 0 18px rgba(255,255,255," + (g * u).toFixed(3) + "), 0 0 46px rgba(255,255,255," + (0.3 * u).toFixed(3) + ")";
          }
          // cursor
          const cur = $("cursor"), cp = cursorAt(t);
          const con = t >= 0.9 && t < 9.52;
          K.show(cur, con);
          if (con) {
            const d = cursorAt(t + 0.02), d0 = cursorAt(t - 0.02), vx = (d[0] - d0[0]) / 0.04, vy = (d[1] - d0[1]) / 0.04;
            const s = 1 - 0.14 * press(t);
            cur.style.transform = "translate(" + px(cp[0] - 28) + "," + px(cp[1] - 5) + ") scale(" + s.toFixed(3) + ")";
            cur.style.opacity = (C(P(t, 0.9, 1.05)) * (1 - P(t, 9.3, 9.5))).toFixed(3);
            mblur(cur, "cu", Math.min(10, Math.abs(vx) / 260), Math.min(10, Math.abs(vy) / 260));
          }
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(lastT));
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
