<!doctype html><meta charset="utf-8"><title>travelling-mark demo</title>
<style>
body{margin:0;background:#12101c;font-family:system-ui,sans-serif;color:#ddd}
#wrap{position:relative;width:1280px;height:720px;margin:20px auto;overflow:hidden;border-radius:16px}
#stage{position:absolute;left:0;top:0;width:2560px;height:1440px;transform:scale(.5);transform-origin:0 0;background:#f4f1fb;overflow:hidden}   /* the module's constants (landing 250, cursor 180, arcs 240–380, inflate 6400) are 2560×1440 stage units; scale the stage, not the numbers */
#page{position:absolute;inset:0;background:#fff;display:flex}
#rail{width:340px;background:#f6f4fb;border-right:1px solid #e4e0f0;padding:32px}
#glyph{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899)}
#card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 128px/1 system-ui;color:#1c1633;white-space:nowrap}
#card .w{display:inline-block;opacity:0}
#mark{position:absolute;left:0;top:0;opacity:0}
#mark .in{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:0 10px 30px rgba(99,102,241,.35)}
#hud{width:1280px;margin:0 auto;display:flex;gap:12px;align-items:center}
</style>
<div id="wrap"><div id="stage">
  <div id="page"><div id="rail"><div id="glyph"></div></div></div>
  <div id="card"><span class="w">Find</span> <span class="w">the</span> <span class="w">cracks</span> <span class="w">first.</span></div>
  <div id="mark"><div class="in"></div></div>
</div></div>
<div id="hud"><button id="play">Play</button><input id="t" type="range" min="0" max="3.4" step="0.01" value="0" style="flex:1"><span id="tv">0.00 s</span>
<select id="enter"><option>zip</option><option>drop</option><option>spiral</option><option>hops</option><option>orbit</option></select>
<select id="exit"><option>inflate</option><option>roll</option><option>dive</option></select></div>
<script src="mark.js"></script>
<script>
/* One chapter in 3.4 s: 0–2.7 the title (flight .7 s, heading spring, hold breath), 2.7–3.4 the exit into the sidebar glyph. Pure function of t. */
const $=s=>document.querySelector(s); const M=window.MARK, E=M.ease;
const stage=$('#stage'), page=$('#page'), card=$('#card'), mark=$('#mark'), inner=mark.firstElementChild, words=[...card.querySelectorAll('.w')];
const T_TITLE=2.7, T_IN=M.defaults.T_IN;
const K=2;   // screen px -> stage units (the stage is scaled .5)
function measure(){ const sr=stage.getBoundingClientRect(); const g=M.centreOf($('#glyph')); const S={x:(g.x-sr.left)*K,y:(g.y-sr.top)*K,s:g.s*K};
  card.style.visibility='hidden'; card.style.display='block'; const cr=card.getBoundingClientRect(); const L={x:(cr.left-sr.left)*K-170,y:(cr.top-sr.top+cr.height/2)*K};
  const ws=words.map(w=>{const r=w.getBoundingClientRect(); return {cx:(r.left-sr.left+r.width/2)*K};}); card.style.visibility=''; return {S,L,ws}; }
function render(t){ const {S,L,ws}=measure(); const kind=$('#enter').value, ex=$('#exit').value;
  if(t<T_TITLE){ page.style.clipPath='inset(0 100% 0 0)'; page.style.opacity=1; page.style.transform='';
    const pose=M.flight(kind,t,L,{x:S.x,y:S.y,s:S.s}); pose.o=1; pose.tr=t>=T_IN+.32?`scale(${M.breath(t,T_IN+.32,T_TITLE).toFixed(4)})`:''; M.place(mark,pose,inner);
    words.forEach((w,i)=>{ const e=E.eb(E.seg(t,.62+i*.05,1.07+i*.05)), f=E.eo(E.seg(t,.62+i*.05,.92+i*.05)); w.style.opacity=f; w.style.transform=`translate(${((L.x-ws[i].cx)*(1-e)).toFixed(1)}px,0)`; }); }
  else { const px=(t-T_TITLE)/M.defaults.EXIT_DUR; const G={x:S.x,y:S.y,s:S.s*1.6}; const pose=M.EXIT[ex](px,L,G); pose.o=1; M.place(mark,pose,inner);
    page.style.clipPath=pose.clip==='none'?'none':pose.clip; page.style.opacity=pose.pageOpacity; page.style.transform=`scale(${pose.pageScale})`;
    words.forEach(w=>{ w.style.opacity=ex==='inflate'?1-E.seg(px,0,.3):1-E.seg(px,0,.5); }); }
  $('#tv').textContent=t.toFixed(2)+' s'; }
let playing=false,last=null,t=0; const slider=$('#t');
function tick(now){ if(!playing) return; if(last==null) last=now; t=Math.min(3.4,t+(now-last)/1000); last=now; slider.value=t; render(t); if(t<3.4) requestAnimationFrame(tick); else playing=false; }
$('#play').onclick=()=>{ if(t>=3.4) t=0; playing=!playing; last=null; if(playing) requestAnimationFrame(tick); };
slider.oninput=()=>{ playing=false; t=+slider.value; render(t); };
$('#enter').onchange=$('#exit').onchange=()=>render(t); render(0);
</script>
