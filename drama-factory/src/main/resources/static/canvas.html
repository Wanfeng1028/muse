<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分镜画布 - drama-factory</title>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<style>
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .page-head-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .canvas-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .canvas-toolbar .form-select {
    min-width: 180px;
    max-width: 260px;
  }
  .timeline-strip {
    display: flex;
    gap: 4px;
    align-items: stretch;
    overflow-x: auto;
    padding: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    min-height: 54px;
  }
  .timeline-node {
    flex-grow: 1;
    flex-basis: 0;
    min-width: 68px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    line-height: 1.3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
    transition: border-color .12s, background .12s;
  }
  .timeline-node:hover {
    border-color: var(--text-3);
  }
  .timeline-node .tn-no {
    font-weight: 600;
    color: var(--text);
  }
  .timeline-node .tn-dur {
    color: var(--text-3);
  }
  .timeline-empty {
    color: var(--text-3);
    font-size: 13px;
    padding: 8px;
  }
  .shot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
  }
  .shot-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .shot-card:hover {
    border-color: var(--text-3);
  }
  .shot-card.flash {
    border-color: var(--red);
    background: var(--surface-2);
  }
  .shot-card.dragging {
    opacity: .4;
  }
  .shot-card-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .shot-no {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
  }
  .shot-spacer {
    flex: 1;
  }
  .badge-status {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-2);
    background: var(--surface-2);
    white-space: nowrap;
  }
  .badge-status.badge-PENDING { color: var(--text-2); border-color: var(--border); }
  .badge-status.badge-PROCESSING { color: var(--text-2); border-color: var(--border); }
  .badge-status.badge-DONE { color: var(--green); border-color: var(--green); }
  .badge-status.badge-FAILED { color: var(--red); border-color: var(--red); }
  .drag-handle {
    cursor: grab;
    color: var(--text-3);
    display: inline-flex;
    align-items: center;
    padding: 2px;
  }
  .drag-handle:active {
    cursor: grabbing;
  }
  .shot-desc {
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .shot-dialogue {
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.4;
  }
  .shot-dialogue .lbl {
    color: var(--text-3);
    margin-right: 4px;
  }
  .shot-meta {
    color: var(--text-3);
    font-size: 12px;
  }
  .insert-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--red);
    border-radius: 2px;
    pointer-events: none;
  }
  .insert-line.left { left: -8px; }
  .insert-line.right { right: -8px; }
  .empty-block {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-3);
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 14px;
  }
  .empty-block a {
    color: var(--text);
    text-decoration: underline;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    z-index: 1050;
    overflow-y: auto;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 640px;
    padding: 18px 20px;
  }
  .modal-box h2 {
    font-size: 16px;
    margin: 0 0 14px;
    color: var(--text);
  }
  .field-row {
    margin-bottom: 12px;
  }
  .field-row label {
    display: block;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 4px;
  }
  .field-row textarea,
  .field-row input,
  .field-row select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 13px;
    font-family: inherit;
  }
  .field-row textarea {
    min-height: 68px;
    resize: vertical;
  }
  .field-row.video-prompt textarea {
    min-height: 100px;
  }
  .field-inline-err {
    color: var(--red);
    font-size: 12px;
    margin-top: 4px;
    min-height: 14px;
  }
  .field-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }
  .toast-host {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 1100;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--text-3);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    min-width: 200px;
    max-width: 340px;
  }
  .toast-item.toast-error {
    border-left-color: var(--red);
  }
  .toast-item.toast-ok {
    border-left-color: var(--green);
  }
  .form-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>分镜画布</h1>
    <div class="page-head-actions">
      <button type="button" class="btn btn-outline-secondary btn-sm" id="btnRefresh">
        <i data-lucide="refresh-cw"></i>
        <span>刷新</span>
      </button>
      <button type="button" class="btn btn-primary btn-sm" id="btnAddShot">
        <i data-lucide="plus"></i>
        <span>新增镜头</span>
      </button>
    </div>
  </div>

  <div class="canvas-toolbar">
    <select class="form-select form-select-sm" id="projectSelect"></select>
    <select class="form-select form-select-sm" id="episodeSelect"></select>
  </div>

  <div class="timeline-strip" id="timelineStrip"></div>

  <div id="gridHost"></div>
  <div class="card mt-3">
    <div class="card-body">
      <h2 class="card-title">编排画布</h2>
      <p class="text-secondary">拖拽节点编排 AI 工作流，改动点左上角"保存"写回。</p>
      <agent-canvas src="/api/canvas/project"></agent-canvas>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<div id="modalHost"></div>

<script src="/tabler.min.js"></script>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/canvas.js"></script>
<script src="/agent-canvas/agent-canvas.js"></script>
</body>
</html>
