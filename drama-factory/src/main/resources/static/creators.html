<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="cr.pageTitle">创作者计划 · AI 短剧工坊</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1 data-i18n="cr.heading">创作者计划</h1>
    <p class="text-secondary" data-i18n="cr.subtitle">创作者主页、资料与关注；分成与激励规则待商业方案公布</p>
  </div>

<div class="card">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label" for="creatorSearch" data-i18n="cr.search">搜索</label>
        <input type="text" class="form-control" id="creatorSearch" data-i18n-ph="cr.searchPh" placeholder="按主页标识或名称搜索">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="creatorSort" data-i18n="cr.sort">排序</label>
        <select class="form-select" id="creatorSort">
          <option value="newest" data-i18n="cr.sortNewest">最新创建</option>
          <option value="followers" data-i18n="cr.sortFollowers">关注最多</option>
          <option value="skills" data-i18n="cr.sortSkills">Skill 最多</option>
        </select>
      </div>
    </div>
    <div class="row g-3 mt-1" id="creatorGrid"></div>
    <div class="text-secondary text-center py-4" id="creatorEmpty" hidden data-i18n="cr.empty">还没有创作者主页</div>
  </div>
</div>
<div id="toast" class="alert alert-info" role="alert" hidden></div>

<div class="card mt-3" id="creatorDetailCard" hidden>
  <div class="card-header">
    <h3 class="card-title" id="creatorDetailTitle"></h3>
  </div>
  <div class="card-body">
    <p id="creatorDetailBio"></p>
    <div class="row g-3">
      <div class="col"><span data-i18n="cr.skills">Skill</span>: <span id="creatorStatSkills"></span></div>
      <div class="col"><span data-i18n="cr.installs">安装</span>: <span id="creatorStatInstalls"></span></div>
      <div class="col"><span data-i18n="cr.rating">评分</span>: <span id="creatorStatRating"></span></div>
      <div class="col"><span data-i18n="cr.followers">关注</span>: <span id="creatorStatFollowers"></span></div>
    </div>
    <div id="creatorDetailSkills"></div>
    <div class="mt-3">
      <button type="button" id="creatorFollowBtn" class="btn btn-primary"></button>
      <button type="button" id="creatorBackBtn" class="btn"></button>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-header">
    <h3 class="card-title" data-i18n="cr.formTitle">创建或编辑我的主页</h3>
  </div>
  <div class="card-body">
    <form id="creatorForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="crHandle" data-i18n="cr.handle">主页标识</label>
          <input type="text" class="form-control" id="crHandle" required data-i18n-ph="cr.handlePh" placeholder="小写字母/数字/短横线，如 neo">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="crDisplayName" data-i18n="cr.displayName">展示名称</label>
          <input type="text" class="form-control" id="crDisplayName" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="crBio" data-i18n="cr.bio">简介</label>
          <textarea class="form-control" id="crBio" rows="2"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="crWebsite" data-i18n="cr.website">个人网站</label>
          <input type="text" class="form-control" id="crWebsite">
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary" id="creatorSubmitBtn" data-i18n="cr.save">保存主页</button>
      </div>
    </form>
    <p class="text-secondary mt-3" data-i18n="cr.incentiveNote">分成与激励规则尚未公布，这里不展示任何收益数字</p>
  </div>
</div>
</div>

<script src="/i18n.js"></script>
<script src="/tabler.min.js"></script>
<script src="/shell.js"></script>
<script src="/creators.js"></script>
</body>
</html>
