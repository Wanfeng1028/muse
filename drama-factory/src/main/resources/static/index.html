<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 短剧工坊 · 控制台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="page">
  <header class="navbar navbar-expand-md navbar-dark d-print-none">
    <div class="container-xl">
      <div class="navbar-brand navbar-brand-autodark d-flex align-items-center">
        <span class="me-2">剪辑室</span>
        <span class="fw-bold">AI 短剧工坊</span>
      </div>
      <div class="navbar-nav flex-row order-md-last">
        <div class="nav-item d-none d-md-flex align-items-center gap-2 me-2">
          <div class="text-secondary small">项目</div>
          <div class="h3 mb-0" id="stat-projects">0</div>
        </div>
        <div class="nav-item d-none d-md-flex align-items-center gap-2 me-2">
          <div class="text-secondary small">剧集</div>
          <div class="h3 mb-0" id="stat-episodes">0</div>
        </div>
        <div class="nav-item d-none d-md-flex align-items-center gap-2 me-2">
          <div class="text-secondary small">角色</div>
          <div class="h3 mb-0" id="stat-characters">0</div>
        </div>
        <div class="nav-item d-none d-md-flex align-items-center gap-2">
          <div class="text-secondary small">场景</div>
          <div class="h3 mb-0" id="stat-scenes">0</div>
        </div>
      </div>
      <div class="collapse navbar-collapse" id="navbar-menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="/index.html">控制台首页</a></li>
          <li class="nav-item"><a class="nav-link" href="/storyboard.html">分镜板</a></li>
          <li class="nav-item"><a class="nav-link" href="/tasks.html">任务队列</a></li>
          <li class="nav-item"><a class="nav-link" href="/finals.html">成片库</a></li>
          <li class="nav-item"><a class="nav-link" href="/pipeline.html">生产看板</a></li>
          <li class="nav-item"><a class="nav-link" href="/chat.html">AI 对话</a></li>
        </ul>
      </div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <div class="page-pretitle">场记板 · 控制台</div>
            <h2 class="page-title">项目与剧集总览</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-xl">
        <div class="alert alert-info" id="message" role="alert" style="display:none;"></div>

        <div class="row row-deck row-cards">
          <div class="col-12 col-lg-4">
            <div class="card mb-3">
              <div class="card-header">
                <h3 class="card-title">项目列表</h3>
              </div>
              <div class="card-body">
                <div id="project-list" class="d-flex flex-column gap-2"></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">新建项目</h3>
              </div>
              <div class="card-body">
                <form id="project-form">
                  <div class="mb-3">
                    <label class="form-label" for="project-title">标题</label>
                    <input type="text" class="form-control" id="project-title" required placeholder="例如：逆袭千金">
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="project-genre">类型</label>
                    <input type="text" class="form-control" id="project-genre" placeholder="例如：都市/爽文">
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="project-synopsis">简介</label>
                    <textarea class="form-control" id="project-synopsis" rows="3" placeholder="一句话概括故事"></textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="project-target-episodes">目标集数</label>
                    <input type="number" class="form-control" id="project-target-episodes" min="1" value="20">
                  </div>
                  <div>
                    <button type="submit" class="btn btn-primary">创建项目</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-8">
            <div id="project-detail" class="card" style="display:none;">
              <div class="card-header">
                <h3 class="card-title" id="project-detail-title">项目详情</h3>
              </div>
              <div class="card-body">
                <p id="project-detail-meta" class="text-secondary"></p>
                <p id="project-detail-synopsis"></p>

                <div class="row row-deck row-cards">
                  <div class="col-12 col-md-6">
                    <div class="card mb-3" id="episode-panel">
                      <div class="card-header">
                        <h3 class="card-title">剧集</h3>
                      </div>
                      <div class="card-body">
                        <div id="episode-list" class="d-flex flex-column gap-2"></div>
                      </div>
                    </div>

                    <div class="card">
                      <div class="card-header">
                        <h3 class="card-title">新建剧集</h3>
                      </div>
                      <div class="card-body">
                        <form id="episode-form">
                          <div class="mb-3">
                            <label class="form-label" for="episode-no">集数</label>
                            <input type="number" class="form-control" id="episode-no" min="1" required>
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="episode-title">标题</label>
                            <input type="text" class="form-control" id="episode-title">
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="episode-outline">大纲</label>
                            <textarea class="form-control" id="episode-outline" rows="3"></textarea>
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="episode-duration">时长（秒）</label>
                            <input type="number" class="form-control" id="episode-duration" min="0">
                          </div>
                          <div>
                            <button type="submit" class="btn btn-primary">添加剧集</button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <div class="card mb-3" id="character-panel">
                      <div class="card-header">
                        <h3 class="card-title">角色</h3>
                      </div>
                      <div class="card-body">
                        <div id="character-list" class="d-flex flex-column gap-2"></div>
                      </div>
                    </div>

                    <div class="card">
                      <div class="card-header">
                        <h3 class="card-title">新建角色</h3>
                      </div>
                      <div class="card-body">
                        <form id="character-form">
                          <div class="mb-3">
                            <label class="form-label" for="character-name">姓名</label>
                            <input type="text" class="form-control" id="character-name" required>
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="character-role">定位</label>
                            <select class="form-select" id="character-role">
                              <option value="LEAD">主角</option>
                              <option value="SUPPORTING" selected>配角</option>
                              <option value="EXTRA">群演</option>
                            </select>
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="character-description">描述</label>
                            <textarea class="form-control" id="character-description" rows="2"></textarea>
                          </div>
                          <div class="mb-3">
                            <label class="form-label" for="character-traits">特征</label>
                            <input type="text" class="form-control" id="character-traits" placeholder="例如：冷傲、腹黑">
                          </div>
                          <div>
                            <button type="submit" class="btn btn-primary">添加角色</button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="card mt-3" id="scene-panel" style="display:none;">
                  <div class="card-header">
                    <h3 class="card-title">场景</h3>
                  </div>
                  <div class="card-body">
                    <div id="scene-list" class="d-flex flex-column gap-2"></div>
                  </div>
                </div>

                <div class="card mt-3">
                  <div class="card-header">
                    <h3 class="card-title">剧本</h3>
                  </div>
                  <div class="card-body">
                    <pre id="script-box" class="text-body m-0" style="white-space:pre-wrap;"></pre>
                  </div>
                </div>
              </div>
            </div>

            <div id="empty-hint" class="card">
              <div class="card-body">
                <p class="text-secondary m-0">请选择或创建一个项目</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<template id="scene-form-template">
  <form class="scene-form">
    <div class="mb-3">
      <label class="form-label">场号</label>
      <input type="number" class="form-control scene-no" min="1" required>
    </div>
    <div class="mb-3">
      <label class="form-label">地点</label>
      <input type="text" class="form-control scene-location">
    </div>
    <div class="mb-3">
      <label class="form-label">时间</label>
      <input type="text" class="form-control scene-time">
    </div>
    <div class="mb-3">
      <label class="form-label">描述</label>
      <textarea class="form-control scene-description" rows="2"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">对白</label>
      <textarea class="form-control scene-dialogue" rows="2"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">提示词</label>
      <textarea class="form-control scene-prompt" rows="2"></textarea>
    </div>
    <div>
      <button type="submit" class="btn btn-primary">添加场景</button>
    </div>
  </form>
</template>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
