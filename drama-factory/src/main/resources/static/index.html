<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作区 · AI 短剧工坊</title>
<link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- shell.js 注入侧边栏 + 顶栏 + 命令面板 -->

<div class="page-head">
  <div class="pretitle">AI 工作区 · WORKSPACE</div>
  <h1>和 AI 一起做短剧</h1>
  <p>左侧和 AI 编剧聊剧本、拆分镜；右侧实时看到生产状态。按 <span class="kbd">Ctrl+K</span> 唤起命令面板。</p>
</div>

<div class="workspace">
  <!-- 左：AI 对话（一级入口） -->
  <section class="ws-chat">
    <div class="alert alert-warning" role="alert" style="margin-bottom:16px;">
      对话会消耗你的 DeepSeek API 额度（微信 ChatAPI），请按需使用。
    </div>

    <div class="card">
      <div class="card-body border-bottom">
        <div class="d-flex gap-3 flex-wrap">
          <div class="flex-fill" style="min-width:200px;">
            <label class="form-label" for="projectSelect">项目</label>
            <select id="projectSelect" class="form-select"></select>
          </div>
          <div class="flex-fill" style="min-width:200px;">
            <label class="form-label" for="episodeSelect">目标剧集（确认落库用）</label>
            <select id="episodeSelect" class="form-select"></select>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div id="chatLog" class="mb-3" style="min-height:340px; max-height:54vh; overflow-y:auto;"></div>

        <div class="mb-3 d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-sm chip" data-text="写一个3镜小剧本">写一个3镜小剧本</button>
          <button type="button" class="btn btn-sm chip" data-text="把上面的剧本拆成…">把上面的剧本拆成…</button>
          <button type="button" class="btn btn-sm chip" data-text="优化第1镜的视频提示词">优化第1镜的视频提示词</button>
        </div>

        <div class="mb-2">
          <textarea id="chatInput" class="form-control" rows="3" placeholder="和 AI 编剧聊剧本、分镜、提示词…"></textarea>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-secondary small"><span class="kbd">Ctrl+Enter</span></span>
          <button id="sendBtn" class="btn btn-primary">发送</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 右：生产概览 -->
  <aside class="ws-side">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">生产概览</h3>
      </div>
      <div class="card-body" id="ws-stats">
        <div class="stat-row"><span class="k">分镜完成率</span><span class="v" id="ws-shot-rate">—</span></div>
        <div class="stat-row"><span class="k">任务成功率</span><span class="v" id="ws-task-rate">—</span></div>
        <div class="stat-row"><span class="k">累计渲染时长</span><span class="v" id="ws-render-time">—</span></div>
        <div class="stat-row"><span class="k">待质检成片</span><span class="v" id="ws-pending-qc">—</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title">项目</h3>
        <button class="btn btn-sm" id="ws-new-project-btn" type="button">新建</button>
      </div>
      <div class="card-body">
        <div id="ws-project-list" class="d-flex flex-column gap-2"></div>
        <form id="ws-project-form" style="display:none;" class="mt-2">
          <div class="mb-2">
            <input type="text" class="form-control" id="ws-project-title" required placeholder="项目标题，例如：逆袭千金">
          </div>
          <div class="mb-2">
            <input type="text" class="form-control" id="ws-project-genre" placeholder="类型，例如：都市/爽文">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm">创建</button>
            <button type="button" class="btn btn-sm" id="ws-project-cancel">取消</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title">剧集</h3>
        <button class="btn btn-sm" id="ws-new-episode-btn" type="button">新建</button>
      </div>
      <div class="card-body">
        <div id="ws-episode-list" class="d-flex flex-column gap-2"></div>
        <form id="ws-episode-form" style="display:none;" class="mt-2">
          <div class="row g-2 mb-2">
            <div class="col-4">
              <input type="number" class="form-control" id="ws-episode-no" min="1" required placeholder="集号">
            </div>
            <div class="col-8">
              <input type="text" class="form-control" id="ws-episode-title" placeholder="标题（可选）">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary btn-sm">创建</button>
            <button type="button" class="btn btn-sm" id="ws-episode-cancel">取消</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="card-title">待质检</h3>
        <a class="btn btn-sm btn-outline-primary" href="/finals.html">去成片库</a>
      </div>
      <div class="card-body" id="ws-qc-list">
        <p class="text-secondary small m-0">暂无待质检成片</p>
      </div>
    </div>
  </aside>
</div>

<div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="/tabler.min.js"></script>
<script src="/shell.js"></script>
<script src="/chat.js"></script>
<script src="/workspace.js"></script>
</body>
</html>
