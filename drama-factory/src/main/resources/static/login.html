<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Drama Factory</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="login-hero">
    <h1>欢迎使用 AI 短剧工坊</h1>
    <p>从一句话灵感，到一部完整短剧。</p>
  </div>
  <div class="seg" role="tablist">
    <a class="on" href="/login.html" role="tab" aria-selected="true">登录</a>
    <a href="/register.html" role="tab" aria-selected="false">注册</a>
  </div>
  <form id="login-form" class="login-form" novalidate>
    <div class="field">
      <input type="email" name="email" autocomplete="email" placeholder="邮箱地址" required>
    </div>
    <div class="field">
      <input type="password" name="password" autocomplete="current-password" placeholder="密码" required>
      <button class="eye-btn" type="button" data-toggle-pw aria-label="显示密码"><span class="icon" data-lucide="eye"></span></button>
    </div>
    <div class="form-error" id="form-error" hidden></div>
    <button class="btn-primary" type="submit" id="submit-btn">登录</button>
  </form>
  <div class="forgot-row"><a href="#" id="forgot-btn">忘记密码？</a></div>
  <div class="divider">其他方式继续</div>
  <button class="btn-oauth" type="button" data-provider="google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.1h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.2-2 3.7-5 3.7-8.5z"></path><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-3.7 2.9C3.5 21.3 7.5 24 12 24z"></path><path fill="#FBBC05" d="M5.3 14.4c-.2-.7-.4-1.5-.4-2.4s.2-1.7.4-2.4L1.6 6.8C.6 8.5 0 10.2 0 12s.6 3.5 1.6 5.2l3.7-2.8z"></path><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.5 0 3.5 2.7 1.6 6.8l3.7 2.9c1-2.9 3.7-5 6.7-5z"></path></svg>使用 Google 继续</button>
  <button class="btn-oauth dark" type="button" data-provider="apple"><svg viewBox="0 0 24 24" fill="#fff"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8.98-.2 1.92-.87 3.03-.83 1.32.11 2.31.63 2.96 1.57-2.71 1.63-2.26 5.21.44 6.28-.6 1.57-1.38 3.12-2.51 4.15zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path></svg>使用 Apple 继续</button>
  <div class="agree">继续即代表同意<a href="#">《用户协议》</a>与<a href="#">《隐私政策》</a></div>
</main>

<div class="modal" id="notice-modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <h3 class="modal-title">忘记密码</h3>
    <p class="modal-text">暂不支持自助重置，请联系管理员。</p>
    <div class="modal-actions">
      <button class="btn btn-primary" type="button" data-close>知道了</button>
    </div>
  </div>
</div>

<script src="/vendor/lucide.min.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  Auth.guardGuest();

  var form = document.getElementById('login-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('submit-btn');

  function showErr(msg) {
    errBox.textContent = msg || '登录失败';
    errBox.hidden = false;
  }
  function clearErr() { errBox.hidden = true; errBox.textContent = ''; }

  function nextPath() {
    var q = new URLSearchParams(location.search);
    var n = q.get('next');
    if (n && n.charAt(0) === '/' && n.indexOf('//') !== 0) return n;
    return '/index.html';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearErr();
    var email = form.email.value.trim();
    var password = form.password.value;
    if (!email || !password) { showErr('请填写邮箱和密码'); return; }
    btn.disabled = true;
    Auth.login(email, password).then(function () {
      location.href = nextPath();
    }).catch(function (err) {
      showErr(err.message || '登录失败');
    }).then(function () {
      btn.disabled = false;
    });
  });

  document.querySelectorAll('.oauth-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var provider = b.getAttribute('data-provider');
      Auth.oauthUrl(provider).then(function (r) {
        if (r && r.url) location.href = r.url;
        else showErr('该渠道未配置');
      }).catch(function (err) {
        showErr(err.message || '该渠道未配置');
      });
    });
  });

  var modal = document.getElementById('notice-modal');
  document.getElementById('forgot-btn').addEventListener('click', function (e) {
    e.preventDefault();
    modal.hidden = false;
  });
  modal.querySelectorAll('[data-close]').forEach(function (el) {
    el.addEventListener('click', function () { modal.hidden = true; });
  });


  document.querySelectorAll('[data-toggle-pw]').forEach(function (b) {
    b.addEventListener('click', function () {
      var wrap = b.closest('.field');
      var input = wrap ? wrap.querySelector('input') : null;
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      b.innerHTML = '<span class="icon" data-lucide="' + (show ? 'eye-off' : 'eye') + '"></span>';
      if (window.lucide) window.lucide.createIcons();
    });
  });
  if (window.lucide) window.lucide.createIcons();
})();
</script>
</body>
</html>
