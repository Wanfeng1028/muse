<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Drama Factory</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">欢迎使用 AI 短剧工坊</h1>
    <p class="auth-sub">从一句话灵感，到一部完整短剧。</p>

    <div class="auth-seg" role="tablist">
      <a class="auth-seg-item is-active" href="/login.html" role="tab" aria-selected="true">登录</a>
      <a class="auth-seg-item" href="/register.html" role="tab" aria-selected="false">注册</a>
    </div>

    <form id="login-form" novalidate>
      <label class="field">
        <span class="field-label">邮箱</span>
        <input class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <div class="input-affix">
          <input class="input" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button class="input-affix-btn" type="button" data-toggle-pw aria-label="显示密码">
            <span class="icon" data-lucide="eye"></span>
          </button>
        </div>
      </label>

      <div class="form-error" id="form-error" hidden></div>

      <button class="btn btn-primary btn-block" type="submit" id="submit-btn">登录</button>
    </form>

    <div class="auth-forgot">
      <button class="btn btn-quiet btn-link" type="button" id="forgot-btn">忘记密码？</button>
    </div>

    <div class="auth-divider"><span>其他方式继续</span></div>

    <div class="oauth-col">
      <button class="btn oauth-btn" type="button" data-provider="google">
        <span class="icon" data-lucide="chrome"></span><span>Google</span>
      </button>
      <button class="btn oauth-btn" type="button" data-provider="apple">
        <span class="icon" data-lucide="apple"></span><span>Apple</span>
      </button>
      <button class="btn oauth-btn" type="button" data-provider="github">
        <span class="icon" data-lucide="github"></span><span>GitHub</span>
      </button>
    </div>

    <p class="auth-foot">还没有账号？<a href="/register.html">去注册</a></p>
    <p class="auth-terms">继续即代表同意《用户协议》与《隐私政策》</p>
  </div>
</main>

<div class="modal" id="notice-modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <h3 class="modal-title">忘记密码</h3>
    <p class="modal-text">暂不支持自助重置，请联系管理员。</p>
    <div class="modal-actions">
      <button class="btn btn-primary" type="button" data-close>知道了</button>
    </div>
  </div>
</div>

<script src="/vendor/lucide.min.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  Auth.guardGuest();

  var form = document.getElementById('login-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('submit-btn');

  function showErr(msg) {
    errBox.textContent = msg || '登录失败';
    errBox.hidden = false;
  }
  function clearErr() { errBox.hidden = true; errBox.textContent = ''; }

  function nextPath() {
    var q = new URLSearchParams(location.search);
    var n = q.get('next');
    if (n && n.charAt(0) === '/' && n.indexOf('//') !== 0) return n;
    return '/index.html';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearErr();
    var email = form.email.value.trim();
    var password = form.password.value;
    if (!email || !password) { showErr('请填写邮箱和密码'); return; }
    btn.disabled = true;
    Auth.login(email, password).then(function () {
      location.href = nextPath();
    }).catch(function (err) {
      showErr(err.message || '登录失败');
    }).then(function () {
      btn.disabled = false;
    });
  });

  document.querySelectorAll('.oauth-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var provider = b.getAttribute('data-provider');
      Auth.oauthUrl(provider).then(function (r) {
        if (r && r.url) location.href = r.url;
        else showErr('该渠道未配置');
      }).catch(function (err) {
        showErr(err.message || '该渠道未配置');
      });
    });
  });

  var modal = document.getElementById('notice-modal');
  document.getElementById('forgot-btn').addEventListener('click', function () {
    modal.hidden = false;
  });
  modal.querySelectorAll('[data-close]').forEach(function (el) {
    el.addEventListener('click', function () { modal.hidden = true; });
  });


  document.querySelectorAll('[data-toggle-pw]').forEach(function (b) {
    b.addEventListener('click', function () {
      var wrap = b.closest('.input-affix');
      var input = wrap ? wrap.querySelector('input') : null;
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      b.innerHTML = '<span class="icon" data-lucide="' + (show ? 'eye-off' : 'eye') + '"></span>';
      if (window.lucide) window.lucide.createIcons();
    });
  });
  if (window.lucide) window.lucide.createIcons();
})();
</script>
</body>
</html>
