<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI MV · drama-factory</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/harness.css">
<style>
.mv-steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 20px}
.mv-step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--surface-2);color:var(--text-3);font-size:13px}
.mv-step .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--border);align-items:center;justify-content:center;font-size:12px}
.mv-step.is-current{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.mv-step.is-done{color:var(--text-2)}
.mv-step.is-done .n{background:#2f9e44;color:#fff}
.mv-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.mv-panel h2{font-size:16px;margin:0 0 4px}
.mv-hint{color:var(--text-2);font-size:13px;margin:0 0 16px}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mv-field{display:flex;flex-direction:column;gap:8px}
.mv-field.wide{grid-column:1/-1}
.mv-field label{font-size:13px;color:var(--text-2)}
.mv-field textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip.is-on{background:var(--text);color:var(--bg);border-color:var(--text)}
.mv-foot{display:flex;align-items:center;gap:12px;margin-top:16px}
.mv-note{font-size:13px;color:var(--text-3)}
.lyric-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.lyric-card .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lyric-card .sec-name{font-weight:600;font-size:13px}
.lyric-card .mood-tag{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:4px;padding:2px 8px}
.lyric-card .dur{font-size:12px;color:var(--text-3);margin-left:auto}
.lyric-card textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px;resize:vertical}
.sb-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.sb-card .sec-name{font-weight:600;font-size:13px;margin-bottom:8px}
.sb-card textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:13px;resize:vertical;margin-bottom:8px}
.sb-card .cam{font-size:12px;color:var(--text-2)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:#2f9e44;width:0%;transition:width .3s}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2)}
.agent-list{list-style:none;padding:0;margin:12px 0 0}
.agent-list li{display:flex;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border-soft);color:var(--text-2)}
.agent-list .st{margin-left:auto}
.video-wrap video{width:100%;border-radius:8px;background:#000}
.is-hidden{display:none!important}
@media(max-width:768px){.mv-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="ws-center" style="max-width:860px;margin:0 auto;padding:24px">
  <h1 style="font-size:20px;margin:0 0 4px">AI MV</h1>
  <p class="mv-hint">一句话主题，生成完整音乐短片。</p>

  <ol class="mv-steps" id="steps">
    <li class="mv-step is-current" data-step="1"><span class="n">1</span>写词</li>
    <li class="mv-step" data-step="2"><span class="n">2</span>作曲</li>
    <li class="mv-step" data-step="3"><span class="n">3</span>分镜</li>
    <li class="mv-step" data-step="4"><span class="n">4</span>渲染</li>
    <li class="mv-step" data-step="5"><span class="n">5</span>成片</li>
  </ol>

  <section class="mv-panel" data-panel="1">
    <h2>写词</h2>
    <p class="mv-hint">给出主题、情绪和曲风，生成分段歌词。生成后可以逐段修改。</p>
    <div class="mv-grid">
      <div class="mv-field wide">
        <label for="themeInput">主题</label>
        <textarea id="themeInput" rows="3" placeholder="例如：末班地铁上的重逢"></textarea>
      </div>
      <div class="mv-field">
        <label>情绪</label>
        <div class="chips" id="moodGroup">
          <button type="button" class="chip is-on" data-value="欢快">欢快</button>
          <button type="button" class="chip" data-value="抒情">抒情</button>
          <button type="button" class="chip" data-value="激昂">激昂</button>
          <button type="button" class="chip" data-value="舒缓">舒缓</button>
          <button type="button" class="chip" data-value="热血">热血</button>
        </div>
      </div>
      <div class="mv-field">
        <label>曲风</label>
        <div class="chips" id="styleGroup">
          <button type="button" class="chip is-on" data-value="流行">流行</button>
          <button type="button" class="chip" data-value="民谣">民谣</button>
          <button type="button" class="chip" data-value="摇滚">摇滚</button>
          <button type="button" class="chip" data-value="电子">电子</button>
          <button type="button" class="chip" data-value="古风">古风</button>
        </div>
      </div>
    </div>
    <div class="mv-foot">
      <button class="btn btn-primary" id="btnLyrics" type="button">生成歌词</button>
      <span class="mv-note" id="lyricsNote"></span>
    </div>
  </section>

  <section class="mv-panel is-hidden" data-panel="2">
    <h2>作曲</h2>
    <p class="mv-hint">歌词确认后开始作曲。试听满意再进入分镜。</p>
    <h3 id="lyricsTitle" style="font-size:15px;margin:0 0 12px">未命名</h3>
    <div id="lyricsSections"></div>
    <div class="mv-foot">
      <button class="btn btn-primary" id="btnCompose" type="button">开始作曲</button>
      <span class="mv-note" id="composeNote"></span>
    </div>
    <div class="is-hidden" id="audioBar" style="margin-top:12px">
      <audio id="audioEl" controls preload="metadata" style="width:100%"></audio>
      <div class="mv-foot">
        <span class="mv-note" id="audioMeta"></span>
        <button class="btn" id="btnToStoryboard" type="button">进入分镜</button>
      </div>
    </div>
  </section>

  <section class="mv-panel is-hidden" data-panel="3">
    <h2>分镜</h2>
    <p class="mv-hint">每段歌词对应一个镜头，可编辑画面描述。</p>
    <div id="storyboardList"></div>
    <div class="mv-foot">
      <button class="btn btn-primary" id="btnStoryboard" type="button">生成分镜</button>
      <button class="btn is-hidden" id="btnToRender" type="button">进入渲染</button>
    </div>
  </section>

  <section class="mv-panel is-hidden" data-panel="4">
    <h2>渲染</h2>
    <p class="mv-hint">按分镜逐段合成视频。测试时可打开短片段模式。</p>
    <div class="mv-foot">
      <button class="btn btn-primary" id="btnRender" type="button">开始渲染</button>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)">
        <input type="checkbox" id="dryRunToggle"> 短片段模式
      </label>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta"><span id="progressText">未开始</span><span id="progressPct">0%</span></div>
    <ul class="agent-list" id="agentList"></ul>
  </section>

  <section class="mv-panel is-hidden" data-panel="5">
    <h2>成片</h2>
    <p class="mv-hint">渲染完成后可直接播放或下载。</p>
    <div class="video-wrap"><video id="videoEl" controls preload="metadata"></video></div>
    <div class="mv-foot">
      <a class="btn btn-primary" id="btnDownload" href="#" download>下载视频</a>
      <button class="btn" id="btnAgain" type="button">再做一支</button>
    </div>
  </section>
</main>

<script src="/shell.js"></script>
<script src="/mv.js"></script>
</body>
</html>
