<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产看板 · AI 短剧工坊</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/css/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="page">
  <div class="page-wrapper">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu" aria-controls="navbar-menu" aria-expanded="false" aria-label="切换导航">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href="/index.html" class="text-decoration-none">AI 短剧工坊</a>
        </h1>
        <div class="navbar-nav flex-row order-md-last">
          <div class="nav-item">
            <a href="/pipeline.html" class="btn btn-outline-secondary btn-sm">生产看板</a>
          </div>
        </div>
        <div class="collapse navbar-collapse" id="navbar-menu">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/index.html">控制台首页</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/storyboard.html">分镜板</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/tasks.html">任务队列</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/finals.html">成片库</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link active" href="/pipeline.html">生产看板</a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <div class="page-pretitle">生产线 · PRODUCTION LINE</div>
            <h2 class="page-title" id="projectTitle">生产看板</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="container-xl">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-md-4">
                <label class="form-label" for="projectSelect">选择项目</label>
                <select id="projectSelect" class="form-select"></select>
              </div>
              <div class="col-md-auto">
                <button id="refreshBtn" type="button" class="btn btn-primary">刷新</button>
              </div>
              <div class="col-md">
                <p id="projectMeta" class="text-secondary mb-0"></p>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title">剧集管线</h3>
          </div>
          <div id="board" class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-vcenter card-table" id="pipelineTable">
                <thead>
                  <tr>
                    <th>集号</th>
                    <th>标题</th>
                    <th>状态</th>
                    <th class="text-end">分镜数</th>
                    <th>视频任务</th>
                    <th>成片</th>
                    <th class="text-end">操作</th>
                  </tr>
                </thead>
                <tbody id="pipelineBody"></tbody>
              </table>
            </div>
            <div id="boardEmpty" class="text-secondary p-3 d-none">还没有剧集数据。</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.6.1/dist/js/tabler.min.js"></script>
<script src="/pipeline.js"></script>
</body>
</html>
