<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<!-- 设计注记：字体搭配：标题/正文用 Tabler 系统字体栈（非 Inter 独占），等宽栈用于 kicker 小字、标签、来源路径、全文代码；配色体系：沿用 theme.css 主题变量，亮色纯白底+墨色强调、深色灰黑底+白色强调，实色无渐变，发丝级边框；间距节奏：8px 基准；页头 kicker/标题/副标/工具栏纵向 8/8/16；卡片内边距 16px、信息行间距 4px；全部左对齐，拒绝居中式落地页排版。 -->
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="prm.pageTitle">提示词库 · AI 短剧工坊</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<style>
.prm-kicker {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--tblr-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.prm-card {
  transition: border-color .15s ease;
}
.prm-card:hover {
  border-color: rgba(0,0,0,.2);
}
[data-bs-theme="dark"] .prm-card:hover {
  border-color: rgba(255,255,255,.2);
}
.prm-meta {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--tblr-muted);
}
.prm-empty {
  text-align: left;
}
.prm-chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  font-size: 12px;
  border: 1px solid var(--tblr-border-color);
  border-radius: 999px;
  color: var(--tblr-muted);
  background: transparent;
  cursor: pointer;
  user-select: none;
}
.prm-chip:hover {
  border-color: var(--tblr-primary);
  color: var(--tblr-body-color);
}
.prm-chip.is-active {
  border-color: var(--tblr-primary);
  color: var(--tblr-body-color);
  font-weight: 600;
}
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <div class="prm-kicker" data-i18n="prm.kicker">PROMPT LIBRARY · 实测收录</div>
    <h1 data-i18n="prm.heading">提示词库</h1>
    <p class="text-secondary" data-i18n="prm.subtitle">收集的实测提示词与教程拆解：浏览、搜索、查看全文。</p>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label" for="promptSearch" data-i18n="prm.search">搜索</label>
          <input type="text" class="form-control" id="promptSearch" data-i18n-ph="prm.searchPh" placeholder="按标题、摘要搜索">
        </div>
        <div class="col-md-6 d-flex align-items-end justify-content-md-end">
          <label class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="favOnlySwitch"><span class="form-check-label" data-i18n="prm.favOnly">只看收藏</span></label>
        </div>
      </div>
      <div class="mt-2" id="tagChips"></div>
      <div class="row g-3 mt-1" id="promptGrid"></div>
      <div class="d-flex align-items-center gap-2 mt-3" id="pager" hidden>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="pagePrev" data-i18n="prm.prevPage">上一页</button>
        <span class="text-secondary small" id="pageInfo"></span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="pageNext" data-i18n="prm.nextPage">下一页</button>
      </div>
      <div class="text-secondary prm-empty py-4" id="promptEmpty" data-i18n="prm.empty" hidden>没有找到匹配的提示词</div>
      <div class="alert alert-danger mt-3" id="promptError" hidden></div>
    </div>
  </div>

  <div class="card mt-3" id="promptDetailCard" hidden>
    <div class="card-header d-flex align-items-center justify-content-between">
      <h3 class="card-title mb-0" id="promptDetailTitle"></h3>
      <div class="d-flex">
        <button type="button" class="btn btn-sm btn-outline-warning me-2" id="promptDetailFavBtn" data-i18n="prm.favDetailAdd">收藏</button>
        <button type="button" class="btn btn-sm btn-outline-secondary me-2" id="copyPromptBtn" data-i18n="prm.copyBtn">一键复制全文</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="promptBackBtn" data-i18n="prm.back">返回列表</button>
      </div>
    </div>
    <div class="card-body">
      <div class="text-secondary small mb-2" id="promptDetailMeta"></div>
      <pre id="promptDetailContent" style="white-space: pre-wrap;"></pre>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
  <div id="toast" class="alert alert-info" role="alert" hidden></div>
</div>

<script src="/i18n.js"></script>
<script src="/tabler.min.js"></script>
<script src="/vendor/lucide.min.js"></script>
<script src="/shell.js"></script>
<script src="/prompts.js"></script>
</body>
</html>
