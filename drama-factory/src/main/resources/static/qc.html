
<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成片质检 · AI 短剧工坊</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tabler.min.css">
<link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/harness.css">
</head>
<body>
<div class="page">
<div class="page-head">
  <h1>成片质检</h1>
</div>

<div class="state-empty is-hidden" id="qcEmpty"><i data-lucide="inbox"></i><span>未指定成片，请从成片库进入。</span></div>

        <div class="card" id="qcCard">
          <div class="card-header">
            <h3 class="card-title" id="qcTitle">加载中…</h3>
            <div class="card-actions">
              <span class="badge bg-secondary-lt" id="qcStatusBadge">加载中</span>
            </div>
          </div>
          <div class="card-body">
            <video id="qcVideo" controls style="width:100%;max-height:480px;background:#000"></video>

            <dl class="row mt-3">
              <dt class="col-3 col-md-2">时长</dt>
              <dd class="col-9 col-md-10" id="qcDuration">-</dd>
              <dt class="col-3 col-md-2">创建时间</dt>
              <dd class="col-9 col-md-10" id="qcCreated">-</dd>
              <dt class="col-3 col-md-2">所属剧集</dt>
              <dd class="col-9 col-md-10" id="qcEpisode">-</dd>
            </dl>

            <div id="qcNoteView" class="mt-3" style="display:none">
              <h4>质检备注</h4>
              <div class="text-secondary" id="qcNoteText">-</div>
            </div>

            <div id="qcForm" class="mt-3" style="display:none">
              <div class="mb-3">
                <label class="form-label" for="qcNote">质检备注</label>
                <textarea id="qcNote" class="form-control" rows="3" placeholder="质检备注 / 打回原因"></textarea>
              </div>
              <div class="btn-list">
                <button type="button" class="btn btn-secondary" id="approveBtn">通过</button>
                <button type="button" class="btn btn-secondary" id="rejectBtn">打回</button>
              </div>
            </div>
          </div>
        </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="/tabler.min.js"></script>
<script src="/shell.js"></script>
  <script src="/qc.js"></script>
</body>
</html>
