<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · Drama Factory</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="login-hero">
    <h1>欢迎使用 AI 短剧工坊</h1>
    <p>从一句话灵感，到一部完整短剧。</p>
  </div>
  <div class="seg" role="tablist">
    <a href="/login.html" role="tab" aria-selected="false">登录</a>
    <a class="on" href="/register.html" role="tab" aria-selected="true">注册</a>
  </div>
  <form id="register-form" class="login-form" novalidate>
    <div class="field">
      <input type="email" name="email" autocomplete="email" placeholder="邮箱地址" required>
    </div>
    <div class="field">
      <input type="password" name="password" autocomplete="new-password" placeholder="设置密码（至少 8 位）" required>
      <button class="eye-btn" type="button" data-toggle-pw aria-label="显示密码"><span class="icon" data-lucide="eye"></span></button>
    </div>
    <p class="pw-hint" id="pw-hint">至少 8 位，且包含字母和数字</p>
    <div class="field">
      <input type="password" name="confirm" autocomplete="new-password" placeholder="确认密码" required>
      <button class="eye-btn" type="button" data-toggle-pw aria-label="显示密码"><span class="icon" data-lucide="eye"></span></button>
    </div>
    <div class="form-error" id="form-error" hidden></div>
    <button class="btn-primary" type="submit" id="submit-btn" disabled>注册</button>
  </form>
  <div class="agree">继续即代表同意<a href="#">《用户协议》</a>与<a href="#">《隐私政策》</a></div>
</main>

<script src="/vendor/lucide.min.js"></script>
<script src="/auth.js"></script>
<script>
(function () {
  Auth.guardGuest();
  document.querySelectorAll('[data-toggle-pw]').forEach(function (b) {
    b.addEventListener('click', function () {
      var wrap = b.closest('.field');
      var input = wrap ? wrap.querySelector('input') : null;
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      b.innerHTML = '<span class="icon" data-lucide="' + (show ? 'eye-off' : 'eye') + '"></span>';
      if (window.lucide) window.lucide.createIcons();
    });
  });

  var form = document.getElementById('register-form');
  var btn = document.getElementById('submit-btn');
  var errBox = document.getElementById('form-error');
  var pwHint = document.getElementById('pw-hint');

  function validPassword(pw) {
    return typeof pw === 'string' && pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
  }

  function sync() {
    var pw = form.password.value;
    var cf = form.confirm.value;
    var email = form.email.value.trim();

    var pwOk = validPassword(pw);
    pwHint.classList.toggle('is-ok', pwOk && pw.length > 0);
    pwHint.textContent = pwOk && pw.length > 0
      ? '密码符合要求'
      : '至少 8 位，且包含字母和数字';

    var ok = email && pwOk && cf && cf === pw;
    btn.disabled = !ok;
  }

  ['input', 'change'].forEach(function (ev) {
    form.addEventListener(ev, sync);
  });
  sync();

  function showErr(msg) {
    errBox.textContent = msg || '注册失败';
    errBox.hidden = false;
  }
  function clearErr() { errBox.hidden = true; errBox.textContent = ''; }

  function nextPath() {
    var q = new URLSearchParams(location.search);
    var n = q.get('next');
    if (n && n.charAt(0) === '/' && n.indexOf('//') !== 0) return n;
    return '/index.html';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearErr();

    var email = form.email.value.trim();
    var nickname = email.split('@')[0] || email;
    var password = form.password.value;

    if (!validPassword(password)) { showErr('密码至少 8 位，且包含字母和数字'); return; }
    if (password !== form.confirm.value) { showErr('两次输入的密码不一致'); return; }

    btn.disabled = true;
    Auth.register(email, password, nickname).then(function () {
      return Auth.login(email, password);
    }).then(function () {
      location.href = nextPath();
    }).catch(function (err) {
      if (err && err.code === 'EMAIL_EXISTS') {
        showErr('这个邮箱已经注册过了');
      } else if (err && err.code === 'WEAK_PASSWORD') {
        showErr(err.message || '密码至少 8 位，且包含字母和数字');
      } else {
        showErr(err && err.message ? err.message : '注册失败');
      }
      sync();
    });
  });
})();
</script>
</body>
</html>
