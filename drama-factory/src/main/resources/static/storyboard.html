<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分镜板 · AI 短剧工坊</title>
<link rel="stylesheet" href="/v2.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <nav class="topnav">
    <a href="/index.html">控制台首页</a>
    <a href="/storyboard.html" class="active">分镜板</a>
    <a href="/tasks.html">任务队列</a>
    <a href="/finals.html">成片库</a>
    <a href="/pipeline.html">生产看板</a>
  </nav>
</header>

<main class="container">
  <p class="kicker">场记板 · CLAPPERBOARD</p>

  <div class="selectors">
    <select id="projectSelect"></select>
    <select id="episodeSelect"></select>
    <span id="episodeMeta" class="episode-meta"></span>
  </div>

  <div class="toolbar">
    <button id="addBtn" class="btn btn-primary">添加分镜</button>
    <button id="submitAllBtn" class="btn">全部提交</button>
    <button id="refreshBtn" class="btn">刷新</button>
  </div>

  <section id="formPanel" class="form-panel" hidden>
    <h2 id="formTitle">添加分镜</h2>
    <form id="shotForm">
      <input type="hidden" id="shotId">
      <div class="form-row">
        <label for="shotNo">镜号</label>
        <input type="number" id="shotNo" min="1">
      </div>
      <div class="form-row">
        <label for="shotSize">景别</label>
        <select id="shotSize"></select>
      </div>
      <div class="form-row">
        <label for="cameraMove">运镜</label>
        <select id="cameraMove"></select>
      </div>
      <div class="form-row">
        <label for="durationSeconds">时长（秒）</label>
        <input type="number" id="durationSeconds" min="0" step="0.1">
      </div>
      <div class="form-row">
        <label for="description">画面描述</label>
        <textarea id="description" rows="3"></textarea>
      </div>
      <div class="form-row">
        <label for="dialogue">对白</label>
        <textarea id="dialogue" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label for="videoPrompt">视频提示词</label>
        <textarea id="videoPrompt" rows="3"></textarea>
      </div>
      <p id="formError" class="form-error"></p>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <button type="button" id="cancelBtn" class="btn">取消</button>
      </div>
    </form>
  </section>

  <div id="slateGrid" class="slate-grid"></div>
</main>

<div id="toast" class="toast"></div>

<script src="/storyboard.js"></script>
</body>
</html>
