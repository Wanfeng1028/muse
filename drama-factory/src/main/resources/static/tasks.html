<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务队列 · AI 短剧工坊</title>
  <link rel="stylesheet" href="/v2.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
  <nav class="topnav">
    <a href="/index.html">控制台首页</a>
    <a href="/storyboard.html">分镜板</a>
    <a href="/tasks.html" class="active">任务队列</a>
    <a href="/finals.html">成片库</a>
    <a href="/pipeline.html">生产看板</a>
  </nav>
  <div class="topbar-right">
    <span class="provider-note">当前提供方：mock（离线演示）</span>
  </div>
</header>

  <main class="page">
    <div class="page-head">
      <h1 class="page-title">任务队列</h1>
      <div class="kicker">渲染队列 · RENDER QUEUE</div>
    </div>

    <section class="filters">
      <label>项目
        <select id="projectSelect"></select>
      </label>
      <label>剧集
        <select id="episodeSelect"></select>
      </label>
      <label>分镜
        <select id="shotSelect"></select>
      </label>
      <button id="refreshBtn" class="btn btn-sm">刷新</button>
    </section>

    <p id="hint" class="hint"></p>

    <div class="task-summary"><span id="taskCount" class="panel-sub"></span></div>
    <div id="taskGrid" class="task-grid"></div>
  </main>

  <script src="/tasks.js"></script>
</body>
</html>
