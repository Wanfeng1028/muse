<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务队列 · AI 短剧工坊</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tabler.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/harness.css">
<link rel="stylesheet" href="/tasks-design-v1.css">
</head>
<body>
  <div class="page">
    <div class="page-head">
      <h1 data-i18n="task.pageTitle">任务队列</h1>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex gap-2 align-items-end flex-wrap">
          <div class="flex-fill" style="min-width:160px;">
            <label class="form-label mb-1" for="projectSelect" data-i18n="task.project">项目</label>
            <select id="projectSelect" class="form-select form-select-sm"></select>
          </div>
          <div class="flex-fill" style="min-width:160px;">
            <label class="form-label mb-1" for="episodeSelect" data-i18n="task.episode">剧集</label>
            <select id="episodeSelect" class="form-select form-select-sm"></select>
          </div>
          <div class="flex-fill" style="min-width:160px;">
            <label class="form-label mb-1" for="shotSelect" data-i18n="task.shot">分镜</label>
            <select id="shotSelect" class="form-select form-select-sm"></select>
          </div>
          <div>
            <button id="refreshBtn" class="btn btn-secondary btn-sm" data-i18n="c.refresh">刷新</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hint" class="alert alert-info mb-3" style="display:none;" role="alert"></div>

    <div class="d-flex align-items-center mb-2">
      <span id="taskCount" class="text-secondary"></span>
    </div>

    <div id="taskGrid"></div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/tabler.min.js"></script>
  <script src="/shell.js"></script>
  <script src="/tasks.js"></script>
</body>
</html>
