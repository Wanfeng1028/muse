<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="light">
<head>
<script>try{var t=localStorage.getItem('df-theme');document.documentElement.setAttribute('data-bs-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-bs-theme','light');}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务队列 · AI 短剧工坊</title>
  <link rel="stylesheet" href="/tabler.min.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page">
    <div class="page-head">
      <h1>任务队列</h1>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <label class="form-label mb-1" for="projectSelect">项目</label>
            <select id="projectSelect" class="form-select form-select-sm"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label mb-1" for="episodeSelect">剧集</label>
            <select id="episodeSelect" class="form-select form-select-sm"></select>
          </div>
          <div class="col-md-3">
            <label class="form-label mb-1" for="shotSelect">分镜</label>
            <select id="shotSelect" class="form-select form-select-sm"></select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button id="refreshBtn" class="btn btn-secondary btn-sm w-100">刷新</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hint" class="alert alert-info mb-3" style="display:none;" role="alert"></div>

    <div class="d-flex align-items-center mb-2">
      <span id="taskCount" class="text-secondary"></span>
    </div>

    <div id="taskGrid"></div>
  </div>
  <script src="/tabler.min.js"></script>
  <script src="/shell.js"></script>
  <script src="/tasks.js"></script>
</body>
</html>
