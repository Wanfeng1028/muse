{% extends "base.html" %}
{% block title %}侦探队列{% endblock %}
{% block content %}
<div class="chart-toolbar">
  <h1>侦探队列 <span class="badge" id="pendingBadge">0</span></h1>
  <div>
    <label class="muted">批次</label>
    <select id="batchSelect"></select>
  </div>
</div>

<p class="muted">系统没把握的账单都在这里，你点一下就行。</p>

<div id="queueError" class="error-list" style="display:none;"></div>
<div class="batch-toolbar" id="batchToolbar" style="display:none;">
  <label class="batch-select-all">
    <input type="checkbox" id="selectAll">
    <span>全选</span>
  </label>
  <span class="muted" id="selectedCount">已选 0 条</span>
  <select id="batchCatSelect" aria-label="批量认领分类"></select>
  <button class="btn btn-primary" id="batchClaimBtn">批量认领</button>
  <button class="btn" id="batchSkipBtn">批量忽略</button>
  <span class="batch-hint" id="batchDirHint" style="display:none;"></span>
</div>
<div id="batchResult" class="batch-result" style="display:none;"></div>
<div id="cardList"></div>

<div id="emptyState" class="card" style="display:none;">
  <p>都认领完了，账本干净了。</p>
  <a class="btn" href="/transactions">查看交易</a>
</div>

<div class="card" id="rulesCard">
  <h2>自动匹配规则</h2>
  <table>
    <thead>
      <tr><th>关键词</th><th>分类</th><th>方向</th><th>优先级</th><th></th></tr>
    </thead>
    <tbody id="rulesBody"></tbody>
  </table>
  <h3>添加规则</h3>
  <div class="form-row">
    <label>关键词</label>
    <input type="text" id="ruleKeyword" placeholder="如：瑞幸">
  </div>
  <div class="form-row">
    <label>分类</label>
    <select id="ruleCategory"></select>
  </div>
  <div class="form-row">
    <label>方向</label>
    <select id="ruleDirection">
      <option value="any">不限方向</option>
      <option value="out">支出</option>
      <option value="in">收入</option>
    </select>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" id="ruleAddBtn">添加规则</button>
  </div>
  <div id="ruleError" class="error-list" style="display:none;"></div>
</div>

<div class="card" id="aliasCard">
  <h2>记住的商户别名</h2>
  <p class="muted">你手工纠正一次，系统就记住这个商户下次自动归类。记错了可以在这里改分类、改名字或删掉。</p>
  <table><thead><tr><th>别名</th><th>分类</th><th>方向</th><th></th></tr></thead><tbody id="aliasesBody"></tbody></table>
  <div id="aliasError" class="error-list" style="display:none;"></div>
</div>

<script id="accountsData" type="application/json">{{ accounts|tojson }}</script>
<script id="catsData" type="application/json">{{ categories_grouped|tojson }}</script>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var accounts = JSON.parse(document.getElementById('accountsData').textContent);
  var cats = JSON.parse(document.getElementById('catsData').textContent);
  var allCats = (cats.expense || []).concat(cats.income || []);
  var catById = {};
  for (var i = 0; i < allCats.length; i++) { catById[allCats[i].id] = allCats[i]; }

  var currentBatch = null;
  var currentBatchAccountId = null;

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function showError(msg) {
    var el = document.getElementById('queueError');
    el.style.display = 'block';
    el.textContent = msg;
  }
  function hideError() {
    document.getElementById('queueError').style.display = 'none';
  }
  function dirText(d) {
    return d === 'in' ? '收入' : (d === 'out' ? '支出' : (d === 'any' ? '不限' : (d || '')));
  }
  function sourceText(src) {
    if (src === 'rule') return '规则自动匹配';
    if (src === 'history') return '按你的习惯匹配';
    if (src === 'alias') return '按你的纠正记住的';
    if (src === 'transfer-pair') return '转账配对成功';
    if (src === 'transfer-pair-xbatch') return '跨批次转账配对';

    if (src === 'suggestion') return '侦探推测';
    return '暂无头绪';
  }

  function loadBatches() {
    api('/api/statements/batches').then(function (list) {
      var sel = document.getElementById('batchSelect');
      sel.innerHTML = '';
      var preselect = getParam('batch');
      var batchById = {};
      for (var i = 0; i < list.length; i++) {
        var b = list[i];
        batchById[b.id] = b;
        var opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = (b.filename || ('批次 ' + b.id)) + '（待认领 ' + (b.pending_count || 0) + '）';
        if (preselect && String(b.id) === String(preselect)) { opt.selected = true; }
        sel.appendChild(opt);
      }
      function pick() {
        currentBatch = sel.value || null;
        currentBatchAccountId = (currentBatch && batchById[currentBatch])
          ? batchById[currentBatch].account_id : null;
        loadItems();
      }
      sel.addEventListener('change', pick);
      if (sel.value) { pick(); }
      else { renderEmpty(); }
    }).catch(function (e) {
      showError('加载批次失败：' + e.message);
    });
  }

  function updateBadge(count) {
    document.getElementById('pendingBadge').textContent = count;
  }

  function renderEmpty() {
    document.getElementById('cardList').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('batchToolbar').style.display = 'none';
    document.getElementById('batchResult').style.display = 'none';
    updateBadge(0);
  }

  function makeDirTag(dir) {
    var t = document.createElement('span');
    t.className = 'tag';
    t.textContent = dirText(dir);
    return t;
  }

  function makeCandidateButton(item, cand) {
    var btn = document.createElement('button');
    btn.className = 'candidate-btn';
    btn.textContent = cand.category_name + ' ' + Math.round(cand.confidence || 0) + '%';
    btn.addEventListener('click', function () {
      claimItem(item.id, cand.category_id, false);
    });
    return btn;
  }

  function categoryOptionsFor(dir) {
    if (dir === 'in') return cats.income || [];
    if (dir === 'out') return cats.expense || [];
    return allCats;
  }

  function renderCard(item) {
    var card = document.createElement('div');
    card.className = 'detective-card';
    card.id = 'item-' + item.id;
    var selectRow = document.createElement('div');
    selectRow.className = 'dc-select-row';
    var chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.className = 'dc-select';
    chk.setAttribute('data-id', item.id);
    chk.setAttribute('data-direction', item.direction || '');
    chk.setAttribute('aria-label', '选中这条账单');
    chk.addEventListener('change', updateBatchToolbar);
    var chkLabel = document.createElement('span');
    chkLabel.className = 'muted';
    chkLabel.textContent = '选中这条';
    selectRow.appendChild(chk);
    selectRow.appendChild(chkLabel);
    card.appendChild(selectRow);

    var line1 = document.createElement('div');
    line1.className = 'dc-line1';
    var amtColor = item.direction === 'in' ? 'var(--green)' : 'var(--red)';
    var parts = [
      ['dc-date', item.occurred_on || ''],
      ['dc-cp', item.counterparty || ''],
      ['dc-sum', item.summary || '']
    ];
    for (var p = 0; p < parts.length; p++) {
      var sp = document.createElement('span');
      sp.className = parts[p][0];
      sp.textContent = parts[p][1];
      line1.appendChild(sp);
    }
    var amt = document.createElement('span');
    amt.className = 'dc-amt';
    amt.style.color = amtColor;
    amt.textContent = fmtMoney(item.amount_cents);
    line1.appendChild(amt);
    line1.appendChild(makeDirTag(item.direction));
    card.appendChild(line1);

    var line2 = document.createElement('div');
    line2.className = 'dc-line2';
    var label = document.createElement('span');
    label.className = 'dc-label';
    label.textContent = '侦探的判断：';
    line2.appendChild(label);
    var cands = item.candidates || [];
    if (cands.length === 0) {
      var none = document.createElement('span');
      none.className = 'muted';
      none.textContent = '暂无候选';
      line2.appendChild(none);
    } else {
      for (var i = 0; i < cands.length; i++) {
        line2.appendChild(makeCandidateButton(item, cands[i]));
      }
    }
    card.appendChild(line2);

    var src = document.createElement('div');
    src.className = 'dc-source muted';
    src.textContent = sourceText(item.match_source);
    card.appendChild(src);

    if (item.suggested_action === 'transfer') {
      var hint = document.createElement('div');
      hint.className = 'transfer-hint';
      var toName = '未知账户';
      for (var k = 0; k < accounts.length; k++) {
        if (accounts[k].id === item.suggested_to_account_id) { toName = accounts[k].name; }
      }
      hint.textContent = '对方像是你自己的账户「' + toName + '」，可能是转账';
      card.appendChild(hint);

      var trow = document.createElement('div');
      trow.className = 'dc-line3';
      var tsel = document.createElement('select');
      tsel.className = 'dc-account-select';
      for (var j = 0; j < accounts.length; j++) {
        var a = accounts[j];
        if (currentBatchAccountId && a.id === currentBatchAccountId) continue;
        var o = document.createElement('option');
        o.value = a.id;
        o.textContent = a.name;
        if (a.id === item.suggested_to_account_id) { o.selected = true; }
        tsel.appendChild(o);
      }
      var tbtn = document.createElement('button');
      tbtn.className = 'btn btn-primary';
      tbtn.textContent = '确认为转账';
      tbtn.addEventListener('click', function () {
        confirmTransfer(item.id, tsel.value);
      });
      trow.appendChild(tsel);
      trow.appendChild(tbtn);
      card.appendChild(trow);
    }

    var line3 = document.createElement('div');
    line3.className = 'dc-line3';
    var sel = document.createElement('select');
    sel.className = 'dc-cat-select';
    var opts = categoryOptionsFor(item.direction);
    for (var q = 0; q < opts.length; q++) {
      var oo = document.createElement('option');
      oo.value = opts[q].id;
      oo.textContent = opts[q].name;
      if (opts[q].id === item.suggested_category_id) { oo.selected = true; }
      sel.appendChild(oo);
    }
    var claimBtn = document.createElement('button');
    claimBtn.className = 'btn btn-primary';
    claimBtn.textContent = '认领';
    var ruleWrap = document.createElement('label');
    ruleWrap.className = 'dc-rule';
    var ruleChk = document.createElement('input');
    ruleChk.type = 'checkbox';
    ruleWrap.appendChild(ruleChk);
    ruleWrap.appendChild(document.createTextNode('记住为规则'));

    claimBtn.addEventListener('click', function () {
      claimItem(item.id, sel.value, ruleChk.checked);
    });

    var skipBtn = document.createElement('button');
    skipBtn.className = 'btn';
    skipBtn.textContent = '跳过';
    skipBtn.addEventListener('click', function () {
      skipItem(item.id);
    });

    line3.appendChild(sel);
    line3.appendChild(claimBtn);
    line3.appendChild(ruleWrap);
    line3.appendChild(skipBtn);
    card.appendChild(line3);

    return card;
  }

  function removeCard(id) {
    var el = document.getElementById('item-' + id);
    if (el && el.parentNode) { el.parentNode.removeChild(el); }
    var left = document.querySelectorAll('.detective-card').length;
    updateBadge(left);
    if (left === 0) { renderEmpty(); }
  }

  function claimItem(id, categoryId, saveRule) {
    api('/api/statements/items/' + id + '/claim', {
      method: 'POST',
      body: JSON.stringify({ category_id: Number(categoryId), save_rule: !!saveRule })
    }).then(function () {
      removeCard(id);
    }).catch(function (e) {
      showError('认领失败：' + e.message);
    });
  }

  function confirmTransfer(id, toAccountId) {
    api('/api/statements/items/' + id + '/claim-transfer', {
      method: 'POST',
      body: JSON.stringify({ to_account_id: Number(toAccountId) })
    }).then(function () {
      removeCard(id);
    }).catch(function (e) {
      showError('转账确认失败：' + e.message);
    });
  }

  function skipItem(id) {
    api('/api/statements/items/' + id + '/skip', { method: 'POST' }).then(function () {
      removeCard(id);
    }).catch(function (e) {
      showError('跳过失败：' + e.message);
    });
  }

  function selectedItems() {
    var boxes = document.querySelectorAll('.dc-select:checked');
    var out = [];
    for (var i = 0; i < boxes.length; i++) {
      out.push({ id: boxes[i].getAttribute('data-id'), direction: boxes[i].getAttribute('data-direction') });
    }
    return out;
  }

  function updateBatchToolbar() {
    var sel = selectedItems();
    document.getElementById('selectedCount').textContent = '已选 ' + sel.length + ' 条';
    var dirs = {};
    for (var i = 0; i < sel.length; i++) { dirs[sel[i].direction] = true; }
    var dirKeys = Object.keys(dirs);
    var claimBtn = document.getElementById('batchClaimBtn');
    var catSel = document.getElementById('batchCatSelect');
    var hint = document.getElementById('batchDirHint');
    if (dirKeys.length > 1) {
      claimBtn.disabled = true;
      hint.style.display = 'inline';
      hint.textContent = '勾选了不同方向的账单，批量认领只支持同方向；可分两次处理，或用批量忽略。';
    } else {
      claimBtn.disabled = sel.length === 0;
      hint.style.display = 'none';
      fillBatchCatOptions(dirKeys[0] || 'out');
    }
    document.getElementById('batchSkipBtn').disabled = sel.length === 0;
  }

  function fillBatchCatOptions(dir) {
    var sel = document.getElementById('batchCatSelect');
    var cur = sel.value;
    sel.innerHTML = '';
    var opts = categoryOptionsFor(dir);
    for (var i = 0; i < opts.length; i++) {
      var o = document.createElement('option');
      o.value = opts[i].id;
      o.textContent = opts[i].name;
      sel.appendChild(o);
    }
    if (cur) { sel.value = cur; }
  }

  function removeCards(ids) {
    for (var i = 0; i < ids.length; i++) { removeCard(ids[i]); }
    updateBatchToolbar();
  }

  function showBatchResult(processed, failed, verb) {
    var el = document.getElementById('batchResult');
    el.style.display = 'block';
    el.innerHTML = '';
    var ok = document.createElement('span');
    ok.className = 'batch-ok';
    ok.textContent = '已' + verb + ' ' + processed + ' 条';
    el.appendChild(ok);
    if (failed && failed.length) {
      var bad = document.createElement('span');
      bad.className = 'batch-fail';
      bad.textContent = '，失败 ' + failed.length + ' 条：';
      el.appendChild(bad);
      var ul = document.createElement('ul');
      for (var i = 0; i < failed.length; i++) {
        var li = document.createElement('li');
        li.textContent = '账单 #' + failed[i].item_id + '：' + failed[i].error;
        ul.appendChild(li);
      }
      el.appendChild(ul);
    }
  }

  function batchClaim() {
    var sel = selectedItems();
    if (!sel.length) { showError('先勾选要处理的账单。'); return; }
    var ids = [];
    for (var i = 0; i < sel.length; i++) { ids.push(Number(sel[i].id)); }
    api('/api/statements/items/batch-claim', {
      method: 'POST',
      body: JSON.stringify({
        item_ids: ids,
        category_id: Number(document.getElementById('batchCatSelect').value),
        save_rule: false
      })
    }).then(function (data) {
      var okIds = [];
      var failedIds = {};
      var failed = data.failed || [];
      for (var i = 0; i < failed.length; i++) { failedIds[failed[i].item_id] = true; }
      for (var j = 0; j < ids.length; j++) {
        if (!failedIds[ids[j]]) { okIds.push(ids[j]); }
      }
      removeCards(okIds);
      showBatchResult(data.processed || 0, failed, '认领');
    }).catch(function (e) {
      showError('批量认领失败：' + e.message);
    });
  }

  function batchSkip() {
    var sel = selectedItems();
    if (!sel.length) { showError('先勾选要处理的账单。'); return; }
    var ids = [];
    for (var i = 0; i < sel.length; i++) { ids.push(Number(sel[i].id)); }
    api('/api/statements/items/batch-skip', {
      method: 'POST',
      body: JSON.stringify({ item_ids: ids })
    }).then(function (data) {
      var failedIds = {};
      var failed = data.failed || [];
      for (var i = 0; i < failed.length; i++) { failedIds[failed[i].item_id] = true; }
      var okIds = [];
      for (var j = 0; j < ids.length; j++) {
        if (!failedIds[ids[j]]) { okIds.push(ids[j]); }
      }
      removeCards(okIds);
      showBatchResult(data.processed || 0, failed, '忽略');
    }).catch(function (e) {
      showError('批量忽略失败：' + e.message);
    });
  }

  function initBatchToolbar() {
    document.getElementById('selectAll').addEventListener('change', function (e) {
      var boxes = document.querySelectorAll('.dc-select');
      for (var i = 0; i < boxes.length; i++) { boxes[i].checked = e.target.checked; }
      updateBatchToolbar();
    });
    document.getElementById('batchClaimBtn').addEventListener('click', batchClaim);
    document.getElementById('batchSkipBtn').addEventListener('click', batchSkip);
  }

  function loadItems() {
    hideError();
    if (!currentBatch) { renderEmpty(); return; }
    api('/api/statements/' + currentBatch + '/items?status=pending&limit=50&offset=0').then(function (data) {
      var list = document.getElementById('cardList');
      list.innerHTML = '';
      var items = data.items || [];
      updateBadge(data.total || 0);
      if (items.length === 0) { renderEmpty(); return; }
      document.getElementById('emptyState').style.display = 'none';
      for (var i = 0; i < items.length; i++) {
        list.appendChild(renderCard(items[i]));
      }
      document.getElementById('batchToolbar').style.display = 'flex';
      document.getElementById('batchResult').style.display = 'none';
      document.getElementById('batchResult').innerHTML = '';
      updateBatchToolbar();
    }).catch(function (e) {
      showError('加载失败：' + e.message);
    });
  }

  function loadRules() {
    api('/api/match-rules').then(function (rules) {
      var body = document.getElementById('rulesBody');
      body.innerHTML = '';
      for (var i = 0; i < rules.length; i++) {
        var r = rules[i];
      var tr = document.createElement('tr');
        var labels = ['关键词', '分类', '方向', '优先级'];
        var cells = [r.keyword, r.category_name || '', dirText(r.direction), String(r.priority || 0)];
        for (var c = 0; c < cells.length; c++) {
          var td = document.createElement('td');
          td.textContent = cells[c];
          td.setAttribute('data-label', labels[c]);
          tr.appendChild(td);
        }
        var act = document.createElement('td');
        act.setAttribute('data-label', '操作');
        var del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.textContent = '删除';
        del.addEventListener('click', (function (rid) {
          return function () {
            api('/api/match-rules/' + rid, { method: 'DELETE' }).then(function () {
              loadRules();
            }).catch(function (e) {
              showError('删除规则失败：' + e.message);
            });
          };
        })(r.id));
        act.appendChild(del);
        tr.appendChild(act);
        body.appendChild(tr);
      }
    }).catch(function (e) {
      showError('加载规则失败：' + e.message);
    });
  }

  function initRuleForm() {
    var sel = document.getElementById('ruleCategory');
    for (var i = 0; i < allCats.length; i++) {
      var opt = document.createElement('option');
      opt.value = allCats[i].id;
      opt.textContent = allCats[i].name;
      sel.appendChild(opt);
    }
    document.getElementById('ruleAddBtn').addEventListener('click', function () {
      var errEl = document.getElementById('ruleError');
      errEl.style.display = 'none';
      var keyword = document.getElementById('ruleKeyword').value.trim();
      if (!keyword) {
        errEl.style.display = 'block';
        errEl.textContent = '请填写关键词。';
        return;
      }
      api('/api/match-rules', {
        method: 'POST',
        body: JSON.stringify({
          keyword: keyword,
          category_id: Number(sel.value),
          direction: document.getElementById('ruleDirection').value,
          priority: 0
        })
      }).then(function () {
        document.getElementById('ruleKeyword').value = '';
        loadRules();
      }).catch(function (e) {
        errEl.style.display = 'block';
        errEl.textContent = '添加失败：' + e.message;
      });
    });
  }

  function loadAliases() {
    api('/api/merchant-aliases').then(function (aliases) {
      var body = document.getElementById('aliasesBody');
      var errEl = document.getElementById('aliasError');
      errEl.style.display = 'none';
      body.innerHTML = '';
      if (!aliases.length) {
        var tr = document.createElement('tr');
        var td = document.createElement('td');
        td.colSpan = 4;
        td.textContent = '还没有记住的别名，去认领几条账单就会有了。';
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      for (var i = 0; i < aliases.length; i++) {
        var a = aliases[i];
        var tr = document.createElement('tr');

        var tdAlias = document.createElement('td');
        tdAlias.setAttribute('data-label', '别名');
        var aliasInput = document.createElement('input');
        aliasInput.type = 'text';
        aliasInput.value = a.alias;
        tdAlias.appendChild(aliasInput);
        tr.appendChild(tdAlias);

        var tdCat = document.createElement('td');
        tdCat.setAttribute('data-label', '分类');
        var catSel = document.createElement('select');
        for (var c = 0; c < allCats.length; c++) {
          var opt = document.createElement('option');
          opt.value = allCats[c].id;
          opt.textContent = allCats[c].name;
          if (Number(allCats[c].id) === Number(a.category_id)) {
            opt.selected = true;
          }
          catSel.appendChild(opt);
        }
        tdCat.appendChild(catSel);
        tr.appendChild(tdCat);

        var tdDir = document.createElement('td');
        tdDir.setAttribute('data-label', '方向');
        tdDir.textContent = dirText(a.direction);
        tr.appendChild(tdDir);

        var tdAct = document.createElement('td');
        tdAct.setAttribute('data-label', '操作');
        var saveBtn = document.createElement('button');
        saveBtn.className = 'btn btn-primary';
        saveBtn.textContent = '保存';
        saveBtn.addEventListener('click', (function (item, inputEl, selEl) {
          return function () {
            var newAlias = inputEl.value.trim();
            var newCat = Number(selEl.value);
            if (newAlias === item.alias && newCat === Number(item.category_id)) {
              return;
            }
            errEl.style.display = 'none';
            api('/api/merchant-aliases/' + item.id, {
              method: 'PATCH',
              body: JSON.stringify({ alias: newAlias, category_id: newCat })
            }).then(function () {
              loadAliases();
            }).catch(function (e) {
              errEl.style.display = 'block';
              errEl.textContent = '保存失败：' + e.message;
            });
          };
        })(a, aliasInput, catSel));
        tdAct.appendChild(saveBtn);

        var delBtn = document.createElement('button');
        delBtn.className = 'btn btn-danger';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', (function (item) {
          return function () {
            if (!confirm('确定要删掉别名“' + item.alias + '”吗？')) {
              return;
            }
            api('/api/merchant-aliases/' + item.id, { method: 'DELETE' }).then(function () {
              loadAliases();
            }).catch(function (e) {
              alert('删除别名失败：' + e.message);
            });
          };
        })(a));
        tdAct.appendChild(delBtn);
        tr.appendChild(tdAct);

        body.appendChild(tr);
      }
    }).catch(function (e) {
      showError('加载别名失败：' + e.message);
    });
  }

  function initAliasSection() {
    loadAliases();
  }

  loadBatches();
  loadRules();
  initRuleForm();
  loadAliases();
  initAliasSection();
  initBatchToolbar();
})();
</script>
{% endblock %}
