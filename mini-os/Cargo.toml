[package]
name = "mini-os"
version = "1.19.8"

edition = "2021"

[[bin]]
name = "mini-os"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
mime_guess = "2.0"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
portable-pty = "0.8"
aes-gcm = "0.10.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha1 = "0.10.6"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# 本地 vendor 的密码学/qrcode 依赖（cargo 离线可构建，见 vendor/ 目录）。
# rand 0.9 自带的 rand_core 0.9 与下面 patch 的 rand_core 0.6.x 可共存，不冲突。
[patch.crates-io]
aes-gcm = { path = "vendor/aes-gcm-0.10.3" }
aes = { path = "vendor/aes-0.8.4" }
cipher = { path = "vendor/cipher-0.4.4" }
ctr = { path = "vendor/ctr-0.9.2" }
ghash = { path = "vendor/ghash-0.5.1" }
aead = { path = "vendor/aead-0.5.2" }
universal-hash = { path = "vendor/universal-hash-0.5.1" }
inout = { path = "vendor/inout-0.1.4" }
crypto-common = { path = "vendor/crypto-common-0.1.6" }
generic-array = { path = "vendor/generic-array-0.14.7" }
typenum = { path = "vendor/typenum-1.18.0" }
rand_core = { path = "vendor/rand_core-0.6.4" }
getrandom = { path = "vendor/getrandom-0.2.15" }
cfg-if = { path = "vendor/cfg-if-1.0.3" }
libc = { path = "vendor/libc-0.2.175" }
cpufeatures = { path = "vendor/cpufeatures-0.2.17" }
subtle = { path = "vendor/subtle-2.6.1" }
version_check = { path = "vendor/version_check-0.9.5" }
zeroize = { path = "vendor/zeroize-1.8.1" }
polyval = { path = "vendor/polyval-0.6.2" }
opaque-debug = { path = "vendor/opaque-debug-0.3.1" }
sha1 = { path = "vendor/sha1-0.10.6" }
digest = { path = "vendor/digest-0.10.7" }
block-buffer = { path = "vendor/block-buffer-0.10.4" }
qrcode = { path = "vendor/qrcode-0.14.1" }
