<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用商店</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .store-page {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .store-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .store-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary, #1a1a1a);
      margin: 0;
      text-align: left;
    }
    .store-search {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
      padding: 8px 12px;
      border: 1px solid var(--border-color, #d0d0d0);
      border-radius: 6px;
      background: var(--bg-secondary, #ffffff);
      color: var(--text-primary, #1a1a1a);
      font-size: 14px;
      outline: none;
    }
    .store-search:focus {
      border-color: var(--accent-color, #3b82f6);
    }
    .store-upload {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--border-color, #d0d0d0);
      border-radius: 8px;
      background: var(--bg-secondary, #ffffff);
      flex-wrap: wrap;
    }
    .store-upload-label {
      font-size: 13px;
      color: var(--text-secondary, #666666);
    }
    .store-upload input[type="file"] {
      font-size: 13px;
      color: var(--text-primary, #1a1a1a);
    }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border: 1px solid var(--border-color, #d0d0d0);
      border-radius: 6px;
      background: var(--bg-secondary, #ffffff);
      color: var(--text-primary, #1a1a1a);
      font-size: 13px;
      cursor: pointer;
    }
    .store-btn:hover {
      background: var(--bg-hover, #f0f0f0);
    }
    .store-btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .store-btn.primary {
      background: var(--accent-color, #3b82f6);
      color: #ffffff;
      border-color: var(--accent-color, #3b82f6);
    }
    .store-btn.primary:hover {
      background: var(--accent-color-hover, #2563eb);
    }
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border-color, #d0d0d0);
      border-radius: 8px;
      background: var(--bg-secondary, #ffffff);
    }
    .store-card-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--bg-hover, #f0f0f0);
      color: var(--text-primary, #1a1a1a);
      flex-shrink: 0;
    }
    .store-card-body {
      flex: 1;
      min-width: 0;
    }
    .store-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .store-card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary, #1a1a1a);
    }
    .store-card-version {
      font-size: 12px;
      color: var(--text-secondary, #666666);
    }
    .store-card-desc {
      font-size: 13px;
      color: var(--text-secondary, #666666);
      margin: 0 0 8px 0;
      line-height: 1.5;
    }
    .store-card-perms {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .store-perm-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--bg-hover, #f0f0f0);
      color: var(--text-secondary, #666666);
      border: 1px solid var(--border-color, #d0d0d0);
    }
    .store-card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .store-error {
      font-size: 13px;
      color: #dc2626;
      margin-top: 6px;
      display: none;
    }
    .store-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-secondary, #666666);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="store-page">
    <div class="store-header">
      <h1 class="store-title">应用商店</h1>
      <input type="text" class="store-search" id="store-search" placeholder="搜索插件">
    </div>

    <div class="store-upload">
      <span class="store-upload-label">安装本地插件：</span>
      <input type="file" id="store-file" accept=".zip">
      <button class="store-btn primary" id="store-install-btn" type="button">
        <i data-lucide="upload"></i>
        <span>安装</span>
      </button>
    </div>

    <div class="store-list" id="store-list"></div>
    <div class="store-empty" id="store-empty" style="display:none;">还没有安装任何插件</div>
  </div>

  <script src="store.js"></script>
</body>
</html>
