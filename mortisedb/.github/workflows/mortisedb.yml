name: "mortisedb CI"

on:
  push:
    paths:
      - "mortisedb/**"
      - ".github/workflows/mortisedb.yml"
  pull_request:
    paths:
      - "mortisedb/**"
      - ".github/workflows/mortisedb.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mortisedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o /tmp/mortisedb-ci ./cmd/mortisedb
