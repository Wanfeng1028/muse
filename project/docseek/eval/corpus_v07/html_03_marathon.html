<!DOCTYPE html>

<title>马拉松备赛 16 周训练计划</title>
<meta name="description" content="面向首马跑者的 16 周训练计划，含周跑量、长距离与配速建议。">
</head>
<body>
<h1>马拉松备赛 16 周</h1>
<p>目标全马 4 小时完赛，对应平均配速每公里 5 分 41 秒。周跑量从第 1 周的 35 公里逐步升到第 12 周的 65 公里，之后进入减量期。</p>
<h2>每周结构</h2>
<p>周二间歇：800 米 × 8 组，组间慢跑 400 米恢复。周四节奏跑：10 公里，配速比目标配速快 10 秒。周日长距离：从 18 公里加到 32 公里，配速比目标慢 30 到 45 秒。</p>
<h2>关键提示</h2>
<p>长距离跑每 45 分钟补能量胶一支，每 20 分钟补水 150 毫升。赛前三周开始减量，最后一周跑量降到 30 公里以内。比赛日提前 3 小时起床，早餐吃 200 克白粥加一根香蕉。</p>
