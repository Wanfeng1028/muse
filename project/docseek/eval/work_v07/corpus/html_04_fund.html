<title>指数基金定投的费率与止盈</title>
<meta name="description" content="指数基金定投的申购费率、管理费、托管费与止盈策略说明。">
</head>
<body>
<h1>指数基金定投</h1>
<p>以沪深 300 指数基金为例，管理费每年 0.15%，托管费每年 0.05%，申购费在第三方平台常打一折，约 0.12%。持有满 7 天赎回费 0.5%，满 2 年免赎回费。</p>
<h2>定投设置</h2>
<p>每月 10 日扣款 1000 元，选择红利再投资。低估区间加倍扣款，PE 百分位低于 30% 时扣 2000 元；高于 70% 时暂停扣款。</p>
<h2>止盈</h2>
<p>目标收益率 30% 时赎回一半，收益率 50% 时再赎回三成，剩余仓位长期持有。若从高点回撤 15% 且 PE 百分位仍高于 60%，一次性清仓。</p>
<p>注意：基金有风险，历史业绩不代表未来收益，请根据自身风险承受能力决策。</p>
</body>
