<title>租房签约避坑指南</title>
<meta name="description" content="租房看房、签约、押金与退租的注意事项清单。">
</head>
<body>
<h1>租房签约避坑</h1>
<p>看房时检查水压、热水器、空调制冷、下水速度与插座数量。用手机拍下水表电表读数，记录在合同附件里。</p>
<h2>合同要点</h2>
<p>明确租金、押金（通常押一付三）、物业费与取暖费由谁承担。写清维修责任：家电自然损坏由房东负责，人为损坏由租客负责。约定提前退租违约金，一般为一个月的租金。</p>
<h2>退租</h2>
<p>退租前 30 天书面通知，交接时双方在场抄表。押金应在 7 个工作日内退还，若房东拖延可向当地住建部门投诉。保留转账记录与聊天截图作为凭证。</p>
</body>
</html>
