# 本文件用于配置 Dependabot，自动检查并更新仓库依赖。
# 检查节奏：每周一（Asia/Shanghai）执行一次依赖更新检查。
# commit 前缀规范：所有 Dependabot 提交的 commit message 均以 chore(deps) 开头。
# springdoc 钉死 2.6.x 原因：springdoc 2.7+ 要求 Spring Framework 6.2，而 Spring Boot 3.3.5 对应 Spring 6.1.x，升上去服务起不来。
# npm 未启用的原因：仓库没有根 package.json；src/main/resources/skills-bundled/ 下约 90 个 package.json 均为 vendored 第三方 skill 模板，不适合 dependabot 跟踪。
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "Wanfeng1028"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
        apply-to: "version-updates"
    ignore:
      - dependency-name: "org.springdoc:*"
        versions:
          - ">=3"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"