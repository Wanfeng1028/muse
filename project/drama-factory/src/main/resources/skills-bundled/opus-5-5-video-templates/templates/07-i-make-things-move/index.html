<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"headline1","type":"string","label":"Headline line 1","default":"I MAKE IDEAS"},
  {"id":"headline2","type":"string","label":"Headline big word","default":"REAL"},
  {"id":"bounceWord","type":"string","label":"Bounce word","default":"BOUNCE"},
  {"id":"stretchWord","type":"string","label":"Stretch word","default":"STRETCH"},
  {"id":"spinWord","type":"string","label":"Spin word","default":"SPIN"},
  {"id":"snapWord","type":"string","label":"Snap word","default":"SNAP"},
  {"id":"role","type":"string","label":"Final small line","default":"CLAUDE"},
  {"id":"name","type":"string","label":"Final big word","default":"IMAGINE"},
  {"id":"note","type":"string","label":"Final handwritten note","default":"claudeimagine.com"},
  {"id":"accent","type":"color","label":"Accent","default":"#6762f3"},
  {"id":"alert","type":"color","label":"Red notes","default":"#e5484d"},
  {"id":"ink","type":"color","label":"Ink","default":"#1c1e22"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="preload" href="assets/fonts/Anton-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/Caveat-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/IBMPlexMono-500.woff2" as="font" type="font/woff2" crossorigin />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      :root { --accent: #6762f3; --alert: #e5484d; --ink: #1c1e22; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #efefed; }
      #root, .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
      #paper { background: radial-gradient(ellipse 72% 70% at 50% 42%, #f6f6f4 0%, #ececea 55%, #d9d9d6 100%); }
      #dark { background: radial-gradient(ellipse 70% 70% at 50% 45%, #2a2d33 0%, #212328 60%, #16171a 100%); }
      #dots { background: radial-gradient(rgba(118, 146, 230, 0.62) 3.4px, transparent 4.2px) 32px 32px / 64px 64px; }
      .hand { font-family: Caveat, cursive; font-weight: 700; }
      .mono { font-family: "IBM Plex Mono", monospace; }
      #tc { position: absolute; right: 150px; top: 44px; font: 500 22px/1 "IBM Plex Mono", monospace; letter-spacing: 0.02em; }
      .tline { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; font-family: Anton, sans-serif; color: var(--ink); }
      .ch { display: inline-block; position: relative; transform-origin: 50% 80%; }
      #l1 { top: 150px; font-size: 212px; line-height: 1; letter-spacing: -0.005em; }
      #l2 { top: 330px; font-size: 540px; line-height: 1; letter-spacing: -0.01em; }
      .word { position: absolute; left: 0; top: 262px; width: 1920px; text-align: center; font: 400 500px/1 Anton, sans-serif; white-space: nowrap; perspective: 1600px; color: #f2f2f0; }
      .word .ch { transform-origin: 50% 50%; }
      #wStretch { color: var(--accent); font-size: 590px; top: 220px; }
      #snapFlash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #ff3a50 0%, #e32a41 70%, #c71f35 100%); }
      #snapFlash div { position: absolute; left: 0; top: 150px; width: 1920px; text-align: center; font: 400 560px/1 Anton, sans-serif; color: #1c1e22; transform: rotate(-8deg); }
      #wSnap { color: var(--alert); }
      #f1 { top: 210px; font-size: 212px; line-height: 1; }
      #f2 { top: 400px; font-size: 440px; line-height: 1; letter-spacing: -0.01em; }
      #ball { position: absolute; left: 0; top: 0; width: 90px; height: 90px; border-radius: 50%; background: var(--accent); transform-origin: 50% 50%; }
      #pct { position: absolute; left: 0; top: 860px; width: 1920px; text-align: center; font: 700 34px/1 Anton, sans-serif; color: #e9ebef; letter-spacing: 0.04em; }
      .box { position: absolute; top: 765px; width: 105px; height: 105px; border-radius: 16px; border: 3px solid; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

            <path id="aStag" d="M1540 402 C 1480 412, 1400 404, 1335 390 M1335 390 l 12 -8 M1335 390 l 10 10" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" />
            <g clip-path="url(#cOver)"><text x="1506" y="926" class="hand" font-size="56" fill="var(--accent)">overlap</text></g>
            <path id="aOver" d="M1530 885 C 1528 866, 1520 850, 1500 834 M1500 834 l 3 13 M1500 834 l 13 1" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" />

          <div class="word" id="wStretch"></div>

          <div class="word" id="wSnap" data-var="snapWord"></div>
          <svg id="guides" class="layer" viewBox="0 0 1920 1080" stroke="#ff4057" stroke-width="2" fill="none">
            <line x1="0" y1="312" x2="1920" y2="312" /><line x1="0" y1="720" x2="1920" y2="720" />
            <line x1="500" y1="0" x2="500" y2="1080" /><line x1="1420" y1="0" x2="1420" y2="1080" />
            <g fill="#1c1e22" stroke-width="2"><rect x="494" y="306" width="12" height="12" /><rect x="954" y="306" width="12" height="12" /><rect x="1414" y="306" width="12" height="12" /><rect x="494" y="510" width="12" height="12" /><rect x="1414" y="510" width="12" height="12" /><rect x="494" y="714" width="12" height="12" /><rect x="954" y="714" width="12" height="12" /><rect x="1414" y="714" width="12" height="12" /></g>
          </svg>
          <svg class="layer" viewBox="0 0 1920 1080">
            <defs><clipPath id="cC1"><rect id="rC1" x="1400" y="760" width="0" height="70" /></clipPath><clipPath id="cC2"><rect id="rC2" x="1530" y="760" width="0" height="70" /></clipPath>
              <clipPath id="cC3"><rect id="rC3" x="1100" y="840" width="0" height="70" /></clipPath><clipPath id="cC4"><rect id="rC4" x="1030" y="760" width="0" height="70" /></clipPath></defs>
            <g id="nC1" clip-path="url(#cC1)"><text x="1410" y="806" class="hand" font-size="46" fill="var(--accent)">gravity-ish</text></g>
            <g id="nC2" clip-path="url(#cC2)"><text x="1540" y="806" class="hand" font-size="46" fill="var(--accent)">elastic</text></g>
            <g id="nC3" clip-path="url(#cC3)"><text x="1110" y="886" class="hand" font-size="46" fill="var(--accent)">rotateY 450°</text></g>
            <g id="nC4" clip-path="url(#cC4)"><text x="1040" y="806" class="hand" font-size="46" fill="var(--accent)">no ease. on purpose</text></g>
          </svg>
        </div>

        <!-- D: easing graph + spacing -->
        <svg id="sD" class="layer" viewBox="0 0 1920 1080">
          <defs>
            <clipPath id="cLin"><rect id="rLin" x="930" y="270" width="0" height="70" /></clipPath>
            <clipPath id="cEase"><rect id="rEase" x="935" y="420" width="0" height="70" /></clipPath>
            <clipPath id="cSpace"><rect id="rSpace" x="1500" y="620" width="0" height="70" /></clipPath>
          </defs>
          <g id="axes" stroke="var(--ink)" stroke-width="3" fill="none"><path id="axY" d="M180 180 L180 630" pathLength="1" /><path id="axX" d="M180 630 L870 630" pathLength="1" /></g>
          <text x="196" y="210" class="hand" font-size="32" fill="#5b5e66">position</text>
          <text x="800" y="672" class="hand" font-size="32" fill="#5b5e66">time</text>
          <g id="grid" stroke="#cfd0d4" stroke-width="1.5"><line x1="216" y1="228" x2="825" y2="228" /><line x1="216" y1="591" x2="651" y2="591" /></g>
          <line id="cursor" x1="651" y1="190" x2="651" y2="630" stroke="var(--accent)" stroke-opacity="0.25" stroke-width="10" />
          <path id="linline" d="M216 591 L825 228" stroke="var(--accent)" stroke-width="5" fill="none" pathLength="1" />
          <path id="ease" d="M216 591 C 651 591, 384 228, 825 228" stroke="var(--accent)" stroke-width="5" fill="none" pathLength="1" />
          <circle id="h1" cx="651" cy="591" r="9" fill="var(--alert)" /><circle id="h2" cx="384" cy="228" r="9" fill="var(--alert)" />
          <rect x="206" y="581" width="20" height="20" transform="rotate(45 216 591)" fill="var(--ink)" />
          <rect x="815" y="218" width="20" height="20" transform="rotate(45 825 228)" fill="var(--ink)" />
          <g clip-path="url(#cLin)"><text x="945" y="318" class="hand" font-size="56" fill="var(--alert)">linear = robotic</text></g>
          <path id="linStrike" d="M940 304 L1320 298" stroke="var(--alert)" stroke-width="4" fill="none" pathLength="1" />
          <path id="aLin" d="M935 300 C 850 300, 760 310, 612 324 M612 324 l 12 -9 M612 324 l 11 9" stroke="var(--alert)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" />
          <g clip-path="url(#cEase)"><text x="948" y="468" class="hand" font-size="56" fill="var(--accent)">ease in-out</text></g>
          <path id="chk" d="M1238 452 L1252 468 L1276 432" stroke="var(--accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" />
          <g clip-path="url(#cSpace)"><text x="1510" y="668" class="hand" font-size="56" fill="var(--accent)">spacing!</text></g>
          <line x1="210" y1="870" x2="1700" y2="870" stroke="var(--ink)" stroke-width="3" />
        </svg>
        <div id="boxes" class="layer"></div>

        <!-- E: follow-through -->
        <svg id="sE" class="layer" viewBox="0 0 1920 1080">
          <defs><clipPath id="cFollow"><rect id="rFollow" x="1180" y="740" width="0" height="70" /></clipPath></defs>
          <g id="sparks" fill="var(--alert)"></g>
          <g id="chain" fill="var(--accent)"></g>
          <g clip-path="url(#cFollow)"><text x="1188" y="786" class="hand" font-size="56" fill="var(--accent)">follow-through</text></g>
          <path id="aFollow" d="M1196 742 C 1180 722, 1166 706, 1146 692 M1146 692 l 13 1 M1146 692 l 3 13" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" />
        </svg>

        <!-- F: anticipation loader -->
        <svg id="sF" class="layer" viewBox="0 0 1920 1080">
          <defs><clipPath id="cAnt"><rect id="rAnt" x="1080" y="360" width="0" height="70" /></clipPath></defs>
          <circle id="ring" cx="960" cy="516" r="270" fill="none" stroke="#e9ebef" stroke-width="4" pathLength="1" transform="rotate(-90 960 516)" />
          <circle cx="960" cy="516" r="270" fill="none" stroke="#e9ebef" stroke-opacity="0.12" stroke-width="4" />
          <g id="ticks" stroke="#8d93a0" stroke-width="2"></g>
          <g id="ringDots" fill="#e9ebef"></g>
          <g clip-path="url(#cAnt)"><text x="1090" y="406" class="hand" font-size="56" fill="var(--accent)">anticipation</text></g>
          <path id="aAnt" d="M1086 420 C 1060 440, 1030 470, 1004 492 M1004 492 l 5 -13 M1004 492 l 13 -3" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" />
        </svg>
        <div id="pct"></div>

        <!-- G: final lockup -->
        <div id="sG" class="layer">
          <div class="tline" id="f1"></div>
          <div class="tline" id="f2"></div>
          <svg class="layer" viewBox="0 0 1920 1080"><defs><clipPath id="cNote"><rect id="rNote" x="1000" y="840" width="0" height="80" /></clipPath></defs>
            <g clip-path="url(#cNote)"><text id="noteT" x="1520" y="890" text-anchor="end" class="hand" font-size="60" fill="var(--accent)"></text></g>
            <path id="aNote" d="M1536 862 C 1546 846, 1548 826, 1540 806 M1540 806 l -6 13 M1540 806 l 13 7" stroke="var(--accent)" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" /></svg>
        </div>

        <div id="ball"></div>

        <!-- HUD -->
        <div id="tc"></div>
        <svg id="hud" class="layer" viewBox="0 0 1920 1080">
          <line id="rule" x1="75" y1="1029" x2="1785" y2="1029" stroke-width="2" />
          <g id="dia"></g>
          <path id="head" d="M0 -16 L0 0 M-8 -16 L8 -16" stroke-width="3" fill="none" />
          <text id="lbl" x="90" y="1004" class="hand" font-size="30"></text>
        </svg>
      </div>
    </div>

    <script>
      (function () {
        const { $, clamp, prog, lerp, E, rnd, show, draw, reveal } = K;
        const v = K.vars(); K.bind(v);
        const NS = "http://www.w3.org/2000/svg", DUR = 15;
        const LINE = 813, R = 45;

        // ---- scene A ball path: fall, two bounces, small hops to rest ----
        const segs = [
          { t0: 0, t1: 0.62, x0: 150, x1: 360, fall: true, y0: -80 },
          { t0: 0.62, t1: 1.14, x0: 360, x1: 735, h: 420 },
          { t0: 1.14, t1: 1.56, x0: 735, x1: 1060, h: 250 },
          { t0: 1.56, t1: 1.8, x0: 1060, x1: 1230, h: 80 },
        ];
        const REST = LINE - R;
        function ballA(t) {
          for (const s of segs) if (t <= s.t1) {
            const u = prog(t, s.t0, s.t1), T = s.t1 - s.t0, x = lerp(s.x0, s.x1, u);
            if (s.fall) return { x, y: s.y0 + (REST - s.y0) * u * u, vy: (2 * (REST - s.y0) * u) / T };
            return { x, y: REST - 4 * s.h * u * (1 - u), vy: (-4 * s.h * (1 - 2 * u)) / T };
          }
          return { x: 1230 + (t - 1.8) * 300, y: REST, vy: 0 };
        }
        const impacts = [0.62, 1.14, 1.56, 1.8];
        function sq(t, vy) {
          let sy = 1 + Math.min(0.5, Math.abs(vy) / 3600), sx = 1 / Math.sqrt(sy);
          impacts.forEach((ti) => { const d = t - ti; if (d > -0.02 && d < 0.08) { const k = clamp(d < 0 ? 1 + d / 0.02 : 1 - d / 0.08); sy = lerp(sy, 0.68, k); sx = lerp(sx, 1.32, k); } });
          return { sx, sy };
        }
        const gT = []; for (let t = 0.05; t < 1.9; t += 0.07) gT.push(t);
        const gEl = gT.map((t) => { const p = ballA(t), s = sq(t, p.vy); const e = document.createElementNS(NS, "ellipse"); e.setAttribute("cx", p.x); e.setAttribute("cy", p.y >= REST - 1 ? LINE - R * s.sy : p.y); e.setAttribute("rx", R * s.sx); e.setAttribute("ry", R * s.sy); $("ghosts").appendChild(e); return e; });
        function trailD(t1) { let d = ""; for (let t = 0; t <= t1; t += 0.012) { const p = ballA(t); d += (d ? " L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); } return d; }

        // ---- type ----
        const l1 = K.chars($("l1"), v.headline1), l2 = K.chars($("l2"), v.headline2);
        const wB = K.chars($("wBounce"), v.bounceWord), wS = K.chars($("wStretch"), v.stretchWord), wP = K.chars($("wSpin"), v.spinWord);
        for (let i = 0; i < 72; i++) { const a = (i / 72) * Math.PI * 2; const l = document.createElementNS(NS, "line"); l.setAttribute("x1", 960 + Math.cos(a) * 138); l.setAttribute("y1", 516 + Math.sin(a) * 138); l.setAttribute("x2", 960 + Math.cos(a) * (i % 6 ? 150 : 158)); l.setAttribute("y2", 516 + Math.sin(a) * (i % 6 ? 150 : 158)); $("ticks").appendChild(l); }
        const f1 = K.chars($("f1"), v.role), f2 = K.chars($("f2"), v.name);
        $("noteT").textContent = v.note;
        function dropIn(spans, t0, stagger, fall, drop, t) {
          spans.forEach((s, i) => {
            const tau = t - (t0 + i * stagger);
            let dy = -drop, blur = 0, sy = 1;
            if (tau >= 0 && tau < fall) { const u = tau / fall; dy = -drop * (1 - u * u); blur = 6 * u; sy = 1 + 0.25 * u; }
            else if (tau >= fall) { const b = tau - fall; dy = b < 0.14 ? -26 * Math.sin((b / 0.14) * Math.PI) : 0; sy = b < 0.07 ? 1 - 0.14 * Math.sin((b / 0.07) * Math.PI) : 1; }
            s.style.visibility = tau >= 0 ? "visible" : "hidden";
            s.style.transform = `translateY(${dy}px) scale(${1 / Math.sqrt(sy)}, ${sy})`;
            s.style.filter = blur > 0.5 ? `blur(${blur}px)` : "none";
          });
        }

        // ---- spacing boxes ----
        const nB = 7, boxEls = [];
        for (let i = 0; i < nB; i++) { const b = document.createElement("div"); b.className = "box"; $("boxes").appendChild(b); boxEls.push(b); }
        const mover = document.createElement("div"); mover.className = "box"; Object.assign(mover.style, { background: "var(--ink)", borderColor: "var(--ink)" }); $("boxes").appendChild(mover);
        const easeIO = E.inOutCubic;

        // ---- follow-through chain ----
        const chainEls = [], sparkEls = [];
        for (let i = 0; i < 16; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 20 - i * 0.8); $("chain").appendChild(c); chainEls.push(c); }
        for (let i = 0; i < 22; i++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 6 + rnd(i) * 4); $("sparks").appendChild(c); sparkEls.push(c); }
        const headAt = (t) => { const k = t - 8.4; return { x: 960 + 560 * Math.sin(k * 2.4 + 2.2), y: 560 + 230 * Math.sin(k * 4.8 + 0.6) }; };

        // ---- loader dots ----
        const ringDots = [];
        for (let i = 0; i < 18; i++) { const a = (i / 18) * Math.PI * 2 - Math.PI / 2; const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 960 + Math.cos(a) * 190); c.setAttribute("cy", 516 + Math.sin(a) * 190); c.setAttribute("r", 7); $("ringDots").appendChild(c); ringDots.push(c); }

        // ---- HUD ----
        [75, 300, 735, 1065, 1395, 1620, 1785].forEach((x) => { const r = document.createElementNS(NS, "rect"); r.setAttribute("x", x - 7); r.setAttribute("y", 1022); r.setAttribute("width", 14); r.setAttribute("height", 14); r.setAttribute("transform", `rotate(45 ${x} 1029)`); r.setAttribute("fill", "none"); r.setAttribute("stroke-width", "2"); $("dia").appendChild(r); });
        const labels = [[0, "spacing"], [1.95, "type"], [5.45, "easing"], [8.4, "follow-through"], [10.9, "anticipation"], [12.95, "hello"]];

        const ball = $("ball");
        function setBall(x, y, r, sx, sy, on) { ball.style.transform = `translate(${x - 45}px, ${y - 45}px) scale(${(r / 45) * sx}, ${(r / 45) * sy})`; ball.style.visibility = on ? "visible" : "hidden"; }

        function render(t) {
          const dark = (t >= 3.95 && t < 5.45) || (t >= 8.4 && t < 12.95);
          $("paper").style.opacity = dark ? 0 : 1; $("dark").style.opacity = dark ? 1 : 0;

            wP.forEach((s, i) => { const u = prog(t, 4.65 + i * 0.06, 4.93 + i * 0.06); const a = 450 * (1 - E.outCubic(u)); s.style.transform = `rotateY(${a}deg)`; s.style.color = u > 0 && u < 0.9 ? "var(--accent)" : ""; s.style.filter = u < 0.9 ? `blur(${4 * (1 - u)}px)` : "none"; s.style.opacity = u > 0 ? 1 : 0; });
            reveal($("rC1"), prog(t, 4.05, 4.25), 260); reveal($("rC2"), prog(t, 4.42, 4.6), 180); reveal($("rC3"), prog(t, 4.78, 4.98), 280); reveal($("rC4"), prog(t, 5.24, 5.42), 460);

          if (dOn) {

            const lin = t < 6.9; show($("linline"), lin); show($("ease"), !lin); show($("h1"), !lin); show($("h2"), !lin);
            draw($("linline"), E.outCubic(prog(t, 5.75, 6.1))); draw($("ease"), E.inOutCubic(prog(t, 6.9, 7.3)));
            reveal($("rLin"), prog(t, 6.05, 6.35), 330); draw($("aLin"), prog(t, 6.3, 6.45)); draw($("linStrike"), prog(t, 6.55, 6.72));
            reveal($("rEase"), prog(t, 7.25, 7.5), 240); draw($("chk"), prog(t, 7.5, 7.62));

            else sparkEls.forEach((c) => { c.style.opacity = 0; });

            const p = Math.round(100 * E.inOutCubic(prog(t, 11.4, 12.75))); $("pct").textContent = p + "%";
            ringDots.forEach((c, i) => { c.style.opacity = r0 * (i / 18 < p / 100 ? 1 : 0.25); });
            reveal($("rAnt"), prog(t, 12.2, 12.5), 280); draw($("aAnt"), prog(t, 12.45, 12.6));

        }
