  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

    <script>
      (function () {
        const v = K.vars();
        K.bind(v);
        const $ = K.$, E = K.E, P = K.prog, C = K.clamp, L = K.lerp, R = K.rnd;
        const DUR = 15;
        const ACC = v.accent;
        const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };

        const IC = {
          redo: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
          down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
          copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
          tabs: '<rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/>',
          img: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
          spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
          ratio: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M17 10v4"/>',
        };
        const ic = (n) => '<svg class="i" viewBox="0 0 24 24">' + IC[n] + "</svg>";
        document.querySelectorAll("[data-ic]").forEach((el) => el.insertAdjacentHTML("afterbegin", ic(el.dataset.ic)));

        // ---------- motion blur ----------
        const MBF = {};
        const mblur = (el, key, sx, sy) => {
          if (sx < 0.3 && sy < 0.3) { el.style.filter = "none"; return; }
          let g = MBF[key];
          if (!g) {
            const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter");
            f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-40%"); f.setAttribute("y", "-40%"); f.setAttribute("width", "180%"); f.setAttribute("height", "180%");
            g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g); $("defs").appendChild(f); MBF[key] = g;
          }
          g.setAttribute("stdDeviation", sx.toFixed(1) + " " + sy.toFixed(1));
          el.style.filter = "url(#mb_" + key + ")";
        };
        const blur = (el, b) => { el.style.filter = b > 0.2 ? "blur(" + b.toFixed(1) + "px)" : "none"; };

        // ---------- headlines: words blur in ----------
        const headline = (el, a, hi) => {
          el.textContent = "";
          const out = [];
          String(a).split(" ").forEach((w) => { const s = document.createElement("span"); s.className = "w"; s.textContent = w + " "; el.appendChild(s); out.push(s); });
          String(hi).split(" ").forEach((w, i, arr) => { const s = document.createElement("span"); s.className = "w it"; s.textContent = w + (i < arr.length - 1 ? " " : ""); el.appendChild(s); out.push(s); });
          return out;
        };
        const headIn = (ws, t, t0, st, t1, dur) => {
          ws.forEach((w, i) => {

            });
            $("dH").style.transform = "rotate(" + (200 + t * 60).toFixed(1) + "deg)";
            $("dM").style.transform = "rotate(" + (80 + t * 300).toFixed(1) + "deg)";
            $("dial").style.opacity = 1 - P(t, 9.3, 9.5);
            bars.forEach((o, c) => {
              const a = 9.62 + c * 0.07, u = E.outBack(P(t, a, a + 0.3), 1.3);
              setBar(o, Math.max(0, o.hmax * u));
            });
          }
          headIn(H3, t, 7.98, 0.08, 9.36);
          K.show($("h3"), t >= 7.9 && t < 9.6);
          headIn(H4, t, 9.95, 0.08, 11.0, 0.12);
          K.show($("h4"), t >= 9.9 && t < 11.2);
          if (t >= 10.12 && t < 11.32) {
            const zoom = E.inQuad(P(t, 11.0, 11.3));
            badgeEls.forEach((o, i) => {
              const u = E.outBack(P(t, 10.15 + i * 0.05, 10.37 + i * 0.05), 2.4);
              const bx = o.x + Math.sin(t * 1.3 + i) * 10, by = o.y + Math.cos(t * 1.1 + i) * 8;
              const zx = 1540 + (bx - 1540) * (1 + zoom * 3.2), zy = 190 + (by - 190) * (1 + zoom * 3.2);
              o.d.style.transform = "translate(" + (zx - 48).toFixed(1) + "px," + (zy - 48).toFixed(1) + "px) scale(" + (u * (1 + zoom * 3.2)).toFixed(3) + ")";
              o.d.style.opacity = C(u * 2);
            });
            $("badges").style.filter = zoom > 0.02 ? "blur(" + (zoom * 12).toFixed(1) + "px)" : "none";
            // glow trail over the bar tops
            const pts = bars.map((o) => { const r = o.top.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height * 0.3]; });
            const lu = E.inOutCubic(P(t, 10.25, 10.6));
            if (lu > 0 && zoom < 0.3) {
              fx.save(); fx.strokeStyle = "#ffd79a"; fx.lineWidth = 4; fx.shadowColor = "#ffb347"; fx.shadowBlur = 18; fx.globalAlpha = 0.9 * (1 - zoom * 3);
              fx.beginPath(); const n = pts.length - 1, m = lu * n;
              pts.forEach(([x, y], i) => { if (i <= m) (i ? fx.lineTo(x, y) : fx.moveTo(x, y)); });
              const i0 = Math.floor(m);
              if (i0 < n) { const f = m - i0; fx.lineTo(L(pts[i0][0], pts[i0 + 1][0], f), L(pts[i0][1], pts[i0 + 1][1], f)); }
              fx.stroke();
              const hx = i0 < n ? L(pts[i0][0], pts[i0 + 1][0], m - i0) : pts[n][0], hy = i0 < n ? L(pts[i0][1], pts[i0 + 1][1], m - i0) : pts[n][1];
              const g = fx.createRadialGradient(hx, hy, 0, hx, hy, 70); g.addColorStop(0, "rgba(255,240,210,0.9)"); g.addColorStop(1, "rgba(255,140,60,0)");
              fx.fillStyle = g; fx.fillRect(hx - 70, hy - 70, 140, 140); fx.restore();
            }
          }

          // ===== flash =====
          const fl = t >= 11.1 && t < 11.6 ? 0.82 * P(t, 11.1, 11.24) * (1 - E.outCubic(P(t, 11.26, 11.56))) : 0;
          K.show($("flash"), fl > 0);
          $("flash").style.opacity = fl.toFixed(3);

          // ===== 6 · stats (11.28 – 13.2) =====
          const sOn = t >= 11.18 && t < 13.2;
          K.show($("stats"), sOn);
          if (sOn) {
            STATS.forEach(([n], i) => {
              const a = [11.2, 11.65, 12.0][i], u = P(t, a, a + 0.45);
              const row = $("sr" + i);
              row.style.opacity = C(P(t, a, a + 0.08) * 2);
              $("sn" + i).innerHTML = statHTML(n, u, i);
              blur($("sn" + i), (1 - E.outCubic(u)) * 10);
              row.style.transform = "translateY(" + ((1 - E.outCubic(P(t, a, a + 0.25))) * 30).toFixed(1) + "px)";
            });
            const vx = E.inCubic(P(t, 12.92, 13.18));
            $("stats").style.transform = "rotate(" + (-220 * vx).toFixed(1) + "deg) scale(" + L(1, 0.08, vx).toFixed(3) + ")";
            $("stats").style.opacity = 1 - P(t, 13.08, 13.18);
            blur($("stats"), vx * 18);
            if (vx > 0) { const g = fx.createRadialGradient(960, 540, 0, 960, 540, 420); g.addColorStop(0, "rgba(255,170,90," + 0.7 * vx + ")"); g.addColorStop(1, "rgba(255,90,40,0)"); fx.fillStyle = g; fx.fillRect(0, 0, 1920, 1080); }
          }
          if (t >= 12.4 && t < 13.2) ring(960, 540, L(1500, 520, E.inOutCubic(P(t, 12.4, 13.0))), 3, ACC, 0.5 * (1 - P(t, 12.95, 13.15)), 12);

          // ===== 7 · final (13.1 – 15) =====
          const fOn = t >= 13.12;
          K.show($("fin"), fOn);
          if (lB) {
            const u = E.outCubic(P(t, 13.14, 13.42));
            const wmW = $("wm").offsetWidth;
            const ms = L(0.95, 0.72, u), ws = 1, tot = 300 * 0.72 + 44 + wmW * ws;
            const cx = 960 - tot / 2 + 150 * 0.72;
            logoAt(cx, L(420, 330, u), ms, ws, E.outCubic(P(t, 13.2, 13.45)), P(t, 13.9, 14.4));
            $("wmClip").style.opacity = 1;
            mblur($("wmClip"), "wmc", 0, 0);
            mblur($("mark"), "mk", 0, 0);
            embers(t, 13.2, 15, cx, 260, 120, 18, 70, 1);
            sparks(t, 13.18, cx, 330, 36, 150, 300, 800, 0.6);
            ring(960, 520, L(200, 1400, E.outCubic(P(t, 13.12, 13.6))), 10, "#f1d7b0", 0.6 * (1 - P(t, 13.12, 13.6)), 20);
          }
          if (fOn) {
            headIn(T, t, 13.3, 0.06, 0);
            const ct = E.outBack(P(t, 14.05, 14.3), 1.8);
            $("cta").style.opacity = C(ct * 2);
            $("cta").style.transform = "scale(" + L(0.7, 1, C(ct)).toFixed(3) + ")";
            $("dom").style.opacity = P(t, 14.25, 14.5);
          }
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(lastT));
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
