              fx.fillStyle = k % 7 === 0 ? "#f4f0e6" : k % 9 === 0 ? RED : k % 2 ? "#f1c75b" : "#d9a23a"; fx.fillRect(-w / 2, -h / 2, w, h); fx.restore();
            }
            // a glint at the card corner
            const gl = bump(t, 13.62, 14.0);
            if (gl > 0) { fx.save(); fx.globalAlpha = gl * fo; const gx = 186, gy = 250; const g2 = fx.createRadialGradient(gx, gy, 0, gx, gy, 90); g2.addColorStop(0, "rgba(255,255,255,0.95)"); g2.addColorStop(1, "rgba(255,255,255,0)"); fx.fillStyle = g2; fx.fillRect(gx - 90, gy - 90, 180, 180); fx.fillStyle = "rgba(255,255,255,0.8)"; fx.fillRect(gx - 220, gy - 1.5, 440, 3); fx.restore(); }
          }
          // warm flare between the stack panels and the end card
          const fl = Math.min(E.outCubic(P(t, 16.94, 17.04)), 1 - E.inQuad(P(t, 17.08, 17.36)));
          if (fl > 0) {
            fx.fillStyle = "rgba(150,134,120," + (0.96 * fl).toFixed(3) + ")"; fx.fillRect(0, 0, 1920, 1080);
            const g3 = fx.createRadialGradient(990, 560, 0, 990, 560, 700);
            g3.addColorStop(0, "rgba(255,246,232," + fl.toFixed(3) + ")"); g3.addColorStop(0.08, "rgba(255,190,140," + (0.9 * fl).toFixed(3) + ")"); g3.addColorStop(0.35, "rgba(214,120,90," + (0.35 * fl).toFixed(3) + ")"); g3.addColorStop(1, "rgba(150,134,120,0)");
            fx.fillStyle = g3; fx.fillRect(0, 0, 1920, 1080);
            fx.save(); fx.globalAlpha = fl; fx.translate(990, 560);
            [[-0.42, 380, 5], [0.62, 260, 3]].forEach(([a, len, w]) => { fx.save(); fx.rotate(a); const lg = fx.createLinearGradient(-len, 0, len, 0); lg.addColorStop(0, "rgba(255,230,210,0)"); lg.addColorStop(0.5, "rgba(255,236,220,0.9)"); lg.addColorStop(1, "rgba(255,230,210,0)"); fx.fillStyle = lg; fx.fillRect(-len, -w / 2, 2 * len, w); fx.restore(); });
            fx.restore();
          }
          // embers on the end card
          if (t >= 17.0) {
            const ea = P(t, 17.0, 17.4);
            for (let k = 0; k < 70; k++) {
              const s = k * 3.77, spd = L(30, 90, R(s)), x = R(s + 1) * 1920 + Math.sin(t * L(0.5, 1.5, R(s + 2)) + k) * 30;
              const y = 1100 - ((t - 17) * spd + R(s + 3) * 1200) % 1200;
              const a = ea * L(0.15, 0.7, R(s + 4)) * (0.6 + 0.4 * Math.sin(t * 3 + k));
              fx.fillStyle = hexA("#ff8a4a", a.toFixed(3)); fx.beginPath(); fx.arc(x, y, L(1, 2.6, R(s + 5)), 0, TAU); fx.fill();
            }
            // sparks around the mark as it lands
            const ms = P(t, 17.1, 17.5);
            if (ms > 0 && ms < 1) { if (!lockW) lockW = $("hLock").offsetWidth; const mx = 960 - lockW / 2 + 140, my = 150 + 150; fx.save(); fx.strokeStyle = hexA("#ffc070", (0.9 * (1 - ms)).toFixed(3)); fx.lineWidth = 2.5; for (let k = 0; k < 14; k++) { const a = R(k * 5.1) * TAU, r0 = 110 + 110 * E.outCubic(ms), r1 = r0 + 26 * (1 - ms); fx.beginPath(); fx.moveTo(mx + Math.cos(a) * r0, my + Math.sin(a) * r0); fx.lineTo(mx + Math.cos(a) * r1, my + Math.sin(a) * r1); fx.stroke(); } fx.restore(); }
          }
        }

        function render(t) {
          drawBg(t);
          sceneA(t);
          sceneB(t);
          sceneC(t);
          sceneE(t);
          sceneG(t);
          sceneH(t);
          drawFx(t);
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { pillW = 0; lockW = 0; delete $("stamp").dataset.w; delete $("bestBadge").dataset.w; render(lastT); });
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
