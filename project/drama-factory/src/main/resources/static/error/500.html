<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出了一点问题 · AI 短剧工坊</title>
  <script>try{var t=localStorage.getItem('df-theme');if(t)document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}</script>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e6e8ec;
      --muted: #9aa0aa;
      --border: #232733;
      --btn-bg: #1c2030;
      --btn-fg: #e6e8ec;
      --btn-hover: #262b3d;
    }
    [data-bs-theme="light"] {
      --bg: #ffffff;
      --fg: #1b1e26;
      --muted: #5b6270;
      --border: #e3e6ee;
      --btn-bg: #f2f4f8;
      --btn-fg: #1b1e26;
      --btn-hover: #e6e9f1;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .code {
      font-size: 56px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 0 0 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      margin: 0 0 24px;
      max-width: 420px;
      line-height: 1.6;
    }
    a.home {
      display: inline-block;
      padding: 10px 20px;
      font-size: 15px;
      color: var(--btn-fg);
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
    }
    a.home:hover {
      background: var(--btn-hover);
    }
  </style>
</head>
<body>
  <main>
    <div class="code">500</div>
    <h1>出了一点问题</h1>
    <p>服务器在处理这个请求时出错了。你可以稍后再试，或者回到首页重新开始。</p>
    <a class="home" href="/">返回首页</a>
  </main>
</body>
</html>
