<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链接详情 · 短链</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/design-v117.css">
</head>
<body>
<div id="key-banner" class="key-banner" hidden>
  还没有设置访问密钥。请到终端查看服务启动日志里的 Admin Key，然后点这里输入。
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path>
        <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path>
      </svg>
      <span>短链</span>
    </div>
    <nav>
      <a href="index.html" data-nav="dashboard">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        仪表盘
      </a>
      <a href="links.html" data-nav="links">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>
        链接管理
      </a>
      <a href="new.html" data-nav="new">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        新建短链
      </a>
      <a href="bulk.html" data-nav="bulk">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        批量建链
      </a>
      <a href="geo.html" data-nav="geo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9"></path><path d="M12 3c-2.5 2.5-3.5 6-3.5 9s1 6.5 3.5 9"></path></svg>
        地域分布
      </a>
    </nav>
    <div class="sidebar-foot">
      <button class="link-btn" id="change-key">更换密钥</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">链接详情</div>
      <div class="topbar-meta"><a href="links.html" class="link-btn">← 返回列表</a></div>
    </header>

    <section class="panel" id="info-panel">
      <div class="panel-head">
        <h2 id="link-title">加载中…</h2>
      </div>
      <div class="kv">
        <div class="kv-row">
          <div class="kv-key">长链接</div>
          <div class="kv-val"><a id="link-url" class="url" target="_blank" rel="noopener"></a></div>
        </div>
        <div class="kv-row">
          <div class="kv-key">短地址</div>
          <div class="kv-val">
            <span class="mono" id="link-short"></span>
            <button class="btn tiny" id="copy-short">复制</button>
          </div>
        </div>
        <div class="kv-row">
          <div class="kv-key">创建时间</div>
          <div class="kv-val mono" id="link-created"></div>
        </div>
        <div class="kv-row">
          <div class="kv-key">到期时间</div>
          <div class="kv-val mono" id="link-expires"></div>
        </div>
        <div class="kv-row">
          <div class="kv-key">启用</div>
          <div class="kv-val"><label class="switch"><input type="checkbox" id="link-enabled"><span></span></label></div>
        </div>
        <div class="kv-row">
          <div class="kv-key">访问限制</div>
          <div class="kv-val">
            <span id="link-limits-text" class="mono">—</span>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input class="input mono" type="number" id="edit-maxvisits" min="1" max="1000000" placeholder="限次（留空不限）" style="width:150px">
              <label style="font-size:13px"><input type="checkbox" id="edit-burn"> 阅后即焚</label>
              <label style="font-size:13px"><input type="checkbox" id="edit-purge"> 销毁后彻底删除</label>
              <button class="btn tiny" id="save-limits">保存限制</button>

              <button class="btn tiny ghost" id="clear-limits">清除限制</button>
            </div>
          </div>
        </div>
        <div class="kv-row">
          <div class="kv-key">密码保护</div>
          <div class="kv-val">
            <span id="link-password-text" class="mono">—</span>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input class="input" type="password" id="edit-password" placeholder="输入新密码" style="width:200px" autocomplete="new-password">
              <button class="btn tiny" id="save-password">设置密码</button>
              <button class="btn tiny ghost" id="clear-password">清除密码</button>
            </div>
            <div class="hint" style="margin-top:6px">密码只存哈希，不可找回；清除后链接变为公开访问</div>
          </div>
        </div>


      </div>
    </section>

    <div class="two-col">
      <section class="panel">
        <div class="panel-head"><h2>二维码</h2></div>
        <div class="qr-wrap">
          <img id="qr-img" alt="二维码" width="240" height="240">
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>本链最近 30 天点击</h2></div>
        <div class="chart" id="link-chart"></div>
      </section>
    </div>


    <section class="panel">
      <div class="panel-head"><h2>来源 Top</h2></div>
      <table class="table" id="referer-table">
        <thead>
          <tr><th>来源</th><th style="width:90px" class="right">点击</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel" id="profile-panel">
      <style>
        #profile-panel .sub-h {
          margin: 14px 0 8px;
          font-size: 13px;
          font-weight: 600;
          color: #444;
        }
        #profile-panel .two-col {
          display: flex;
          gap: 16px;
          flex-wrap: wrap;
        }
        #profile-panel .two-col > div {
          flex: 1 1 260px;
          min-width: 240px;
        }
        #profile-panel .profile-ua {
          display: flex;
          gap: 16px;
          flex-wrap: wrap;
          background: #fafafa;
          border: 1px solid #eaeaea;
          border-radius: 4px;
          padding: 10px 12px;
        }
        #profile-panel .ua-group {
          flex: 1 1 160px;
          min-width: 140px;
        }
        #profile-panel .ua-group h4 {
          margin: 0 0 6px;
          font-size: 12px;
          font-weight: 600;
          color: #666;
        }
        #profile-panel .ua-list {
          list-style: none;
          margin: 0;
          padding: 0;
          font-size: 12px;
          color: #333;
        }

        #profile-panel .ua-list li {
          display: flex;
          align-items: center;
          padding: 2px 0;
          border-bottom: 1px dashed #eee;
        }


        #profile-panel .ua-list li:last-child {
          border-bottom: none;
        }
        #profile-panel .ua-list .ua-name { flex: none; min-width: 52px; }
        #profile-panel .ua-list .ua-bar { flex: 1 1 auto; height: 8px; background: #f0ece4; border-radius: 4px; margin: 4px 8px 0; min-width: 40px; }
        #profile-panel .ua-list .ua-fill { display: block; height: 8px; background: #B3402A; border-radius: 4px; }
        #profile-panel .ua-list .ua-num { flex: none; min-width: 28px; text-align: right; }

        #profile-panel #profile-geo {
          background: #fafafa;
          border: 1px solid #eaeaea;
          border-radius: 4px;
          padding: 10px 12px;
          min-height: 40px;
          font-size: 12px;
          color: #333;
        }
      </style>
      <div class="panel-head"><h2>访问画像</h2><span class="hint">近 30 天</span></div>
      <div class="two-col">
        <div>
          <h3 class="sub-h">24 小时分布</h3>
          <div class="chart" id="profile-hourly"></div>
        </div>
        <div>
          <h3 class="sub-h">星期分布</h3>
          <div class="chart" id="profile-weekday"></div>
        </div>
      </div>
      <h3 class="sub-h">终端与 UA</h3>
      <div class="profile-ua">
        <div class="ua-group"><h4>设备</h4><ul id="ua-devices" class="ua-list"></ul></div>
        <div class="ua-group"><h4>浏览器</h4><ul id="ua-browsers" class="ua-list"></ul></div>
        <div class="ua-group"><h4>操作系统</h4><ul id="ua-os" class="ua-list"></ul></div>
      </div>
      <p class="hint" id="ua-bots-note" hidden></p>
      <h3 class="sub-h">地域</h3>
      <div id="profile-geo"><p class="hint">加载中…</p></div>
    </section>

  </main>
</div>

<script src="assets/js/common.js"></script>
<script src="assets/js/detail.js"></script>
</body>
</html>
