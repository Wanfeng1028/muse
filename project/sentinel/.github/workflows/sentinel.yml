name: sentinel CI

on:
  push:
    paths:
      - "sentinel/**"
      - ".github/workflows/sentinel.yml"
  pull_request:
    paths:
      - "sentinel/**"
      - ".github/workflows/sentinel.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod download
      - run: go vet ./...
      - run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - run: go test ./...
