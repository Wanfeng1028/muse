<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件 - 哨兵 Sentinel</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/design-v015.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="/"><span class="brand-mark"></span>哨兵 Sentinel</a>
  <nav class="nav">
    <a href="/">总览</a>
    <a href="/monitors">监控管理</a>
    <a href="/incidents" class="active">事件</a>
    <a href="/deliveries">投递队列</a>
    <a href="/sms-log">短信记录</a>
    <a href="/snapshots">快照归档</a>
    <a href="/sla-report">SLA总报</a>
    <a href="/sla-trend">SLA趋势</a>
      <a href="/maintenance">维护窗口</a>
      <a href="/groups">监控分组</a>
      <a href="/group-sla">分组SLA</a>
      <a href="/group-sla-trend">分组SLA趋势</a>
<a href="/monitor-sla-trend">单监控SLA趋势</a>
  <a href="/sla-year">年度SLA</a>
  <a href="/group-sla-year">分组年度SLA</a>
</nav>
</div>
<main class="container">
<div class="page-header">
  <h1>事件</h1>
  <p class="subtitle">这里能看到每次监控出问题到恢复的记录，可以按监控和状态筛选，每页 20 条。点击一行可展开详情。</p>
</div>
<div class="page-header">
  <label for="monitor-filter">监控</label>
  <select id="monitor-filter">
    <option value="">全部</option>
  </select>
  <label for="status-filter">状态</label>
  <select id="status-filter">
    <option value="">全部状态</option>
    <option value="open">进行中</option>
    <option value="closed">已恢复</option>
  </select>
</div>
<div id="error-box" class="error-text" style="display:none;"></div>
<table class="table">
  <thead>
    <tr>
      <th>监控</th>
      <th>开始时间</th>
      <th>恢复时间</th>
      <th>持续</th>
      <th>状态</th>
      <th>原因</th>
    </tr>
  </thead>
  <tbody id="incidents-body">
  </tbody>
</table>
<div class="page-header">
  <button id="prev-btn" class="btn" type="button">上一页</button>
  <span id="page-info">第 1 页 / 共 1 页</span>
  <button id="next-btn" class="btn" type="button">下一页</button>
  <span id="total-info">共 0 条</span>
</div>
</main>
<script>
(function () {
  var PAGE_SIZE = 20;
  var state = { page: 1, total: 0, monitorId: "", status: "" };
  var bodyEl = document.getElementById("incidents-body");
  var errEl = document.getElementById("error-box");
  var filterEl = document.getElementById("monitor-filter");
  var statusFilterEl = document.getElementById("status-filter");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");
  var pageInfo = document.getElementById("page-info");
  var totalInfo = document.getElementById("total-info");
  var expandedRow = null;
  var expandedDetail = null;
  function totalPages() {
    if (state.total <= 0) return 1;
    return Math.ceil(state.total / PAGE_SIZE);
  }
  function fmtDuration(sec, endedAt) {
    if (endedAt) {
      if (sec === null || sec === undefined || sec === "") return "-";
      var n = Number(sec);
      if (!isFinite(n) || n < 0) return "-";
      if (n < 60) return n + "秒";
      if (n < 3600) {
        var m = Math.floor(n / 60);
        var s = n % 60;
        return m + "分" + s + "秒";
      }
      var h = Math.floor(n / 3600);
      var mm = Math.floor((n % 3600) / 60);
      return h + "小时" + mm + "分";
    }
    if (sec === null || sec === undefined || sec === "") return "进行中";
    var n2 = Number(sec);
    if (!isFinite(n2) || n2 < 0) return "进行中";
    if (n2 < 60) return n2 + "秒";
    if (n2 < 3600) {
      var m2 = Math.floor(n2 / 60);
      var s2 = n2 % 60;
      return m2 + "分" + s2 + "秒";
    }
    var h2 = Math.floor(n2 / 3600);
    var mm2 = Math.floor((n2 % 3600) / 60);
    return h2 + "小时" + mm2 + "分";
  }
  function renderEmpty() {
    bodyEl.innerHTML = "";
    var tr = document.createElement("tr");
    var td = document.createElement("td");
    td.className = "empty";
    td.colSpan = 6;
    td.textContent = "暂无事件";
    tr.appendChild(td);
    bodyEl.appendChild(tr);
  }
  function renderRows(items) {
    bodyEl.innerHTML = "";
    expandedRow = null;
    expandedDetail = null;
    if (!items || items.length === 0) {
      renderEmpty();
      return;
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var tr = document.createElement("tr");
      tr.className = "incident-row";
      tr.setAttribute("tabindex", "0");
      tr.setAttribute("aria-expanded", "false");
      tr.style.cursor = "pointer";
      tr.title = "点击查看详情";
      var tdMon = document.createElement("td");
      tdMon.textContent = it.monitor_name || "";
      tr.appendChild(tdMon);
      var tdStart = document.createElement("td");
      tdStart.textContent = it.started_at || "";
      tr.appendChild(tdStart);
      var tdEnd = document.createElement("td");
      tdEnd.textContent = it.ended_at ? it.ended_at : "-";
      tr.appendChild(tdEnd);
      var tdDur = document.createElement("td");
      tdDur.textContent = fmtDuration(it.downtime_sec, it.ended_at);
      tr.appendChild(tdDur);
      var tdStatus = document.createElement("td");
      if (it.ended_at) {
        tdStatus.textContent = "已恢复";
        tdStatus.style.color = "#10b981";
      } else {
        tdStatus.textContent = "未恢复";
        tdStatus.style.color = "#f59e0b";
      }
      tr.appendChild(tdStatus);
      var tdErr = document.createElement("td");
      tdErr.textContent = it.start_error || "";
      tr.appendChild(tdErr);
      bodyEl.appendChild(tr);
      var detailTr = document.createElement("tr");
      detailTr.className = "incident-detail";
      detailTr.style.display = "none";
      var detailTd = document.createElement("td");
      detailTd.colSpan = 6;
      var fields = [
        { label: "事件 ID", value: String(it.id || "") },
        { label: "监控", value: it.monitor_name || "" },
        { label: "开始时间", value: it.started_at || "" },
        { label: "恢复时间", value: it.ended_at ? String(it.ended_at) : "未恢复" },
        { label: "持续", value: fmtDuration(it.downtime_sec, it.ended_at) },
        { label: "状态", value: it.ended_at ? "已恢复" : "未恢复" },
        { label: "触发原因", value: it.start_error ? String(it.start_error) : "无" }
      ];
      for (var j = 0; j < fields.length; j++) {
        var line = document.createElement("div");
        var labelSpan = document.createElement("strong");
        labelSpan.textContent = fields[j].label + "：";
        line.appendChild(labelSpan);
        var valueSpan = document.createElement("span");
        valueSpan.textContent = fields[j].value;
        line.appendChild(valueSpan);
        detailTd.appendChild(line);
      }
      detailTr.appendChild(detailTd);
      bodyEl.appendChild(detailTr);
      (function (rowTr, detailRowTr, detailCell) {
        function toggleDetail() {
          if (expandedRow && expandedRow !== rowTr) {
            expandedRow.setAttribute("aria-expanded", "false");
            expandedDetail.style.display = "none";
          }
          if (expandedRow === rowTr) {
            rowTr.setAttribute("aria-expanded", "false");
            detailRowTr.style.display = "none";
            expandedRow = null;
            expandedDetail = null;
          } else {
            rowTr.setAttribute("aria-expanded", "true");
            detailRowTr.style.display = "";
            expandedRow = rowTr;
            expandedDetail = detailRowTr;
            if (!detailRowTr.getAttribute("data-loaded")) {
              detailRowTr.setAttribute("data-loaded", "1");
              fetch("/api/incidents/" + it.id)
                .then(function (resp) { if (!resp.ok) { throw new Error("detail failed"); } return resp.json(); })
                .then(function (data) {
                  var rcLine = document.createElement("div");
                  var rcLabel = document.createElement("strong");
                  rcLabel.textContent = "恢复检查：";
                  rcLine.appendChild(rcLabel);
                  var rcValue = document.createElement("span");
                  if (data.recovery_check) {
                    rcValue.textContent = (data.recovery_check.checked_at || "") + "，延迟 " + data.recovery_check.latency_ms + " 毫秒，状态码 " + (data.recovery_check.status_code === null || data.recovery_check.status_code === undefined ? "-" : data.recovery_check.status_code);
                  } else {
                    rcValue.textContent = "未恢复，无恢复检查";
                  }
                  rcLine.appendChild(rcValue);
                  detailCell.appendChild(rcLine);
                  var dlLine = document.createElement("div");
                  var dlLabel = document.createElement("strong");
                  dlLabel.textContent = "通知记录：";
                  dlLine.appendChild(dlLabel);
                  var dlValue = document.createElement("span");
                  if (!data.deliveries || data.deliveries.length === 0) {
                    dlValue.textContent = "暂无通知记录";
                  } else {
                    dlValue.textContent = data.deliveries.map(function (d) { return d.event + " · " + d.status + " · " + d.created_at; }).join("；");
                  }
                  dlLine.appendChild(dlValue);
                  detailCell.appendChild(dlLine);
                })
                .catch(function () { /* 失败静默，保留原有 7 字段 */ });
            }
          }
        }
        rowTr.addEventListener("click", toggleDetail);
        rowTr.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            if (e.key === " ") e.preventDefault();
            toggleDetail();
          }
        });
      })(tr, detailTr, detailTd);
    }
  }
  function updatePager() {
    var tp = totalPages();
    pageInfo.textContent = "第 " + state.page + " 页 / 共 " + tp + " 页";
    totalInfo.textContent = "共 " + state.total + " 条";
    prevBtn.disabled = state.page <= 1;
    nextBtn.disabled = state.page >= tp;
  }
  function load() {
    errEl.style.display = "none";
    var url = "/api/incidents?page=" + state.page + "&page_size=" + PAGE_SIZE;
    if (state.monitorId) {
      url += "&monitor_id=" + encodeURIComponent(state.monitorId);
    }
    if (state.status) {
      url += "&status=" + encodeURIComponent(state.status);
    }
    fetch(url)
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        state.total = data.total || 0;
        renderRows(data.items);
        updatePager();
      })
      .catch(function (err) {
        console.error(err);
        errEl.textContent = "加载失败，请稍后重试";
        errEl.style.display = "";
      });
  }
  function loadMonitors() {
    fetch("/api/monitors")
      .then(function (resp) { return resp.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) return;
        for (var i = 0; i < rows.length; i++) {
          var m = rows[i];
          var opt = document.createElement("option");
          opt.value = String(m.id);
          opt.textContent = m.name || "";
          filterEl.appendChild(opt);
        }
      })
      .catch(function (err) {
        console.error(err);
      });
  }
  filterEl.addEventListener("change", function () {
    state.monitorId = filterEl.value;
    state.page = 1;
    load();
  });
  statusFilterEl.addEventListener("change", function () {
    state.status = statusFilterEl.value;
    state.page = 1;
    load();
  });
  prevBtn.addEventListener("click", function () {
    if (state.page <= 1) return;
    state.page = state.page - 1;
    load();
  });
  nextBtn.addEventListener("click", function () {
    if (state.page >= totalPages()) return;
    state.page = state.page + 1;
    load();
  });
  loadMonitors();
  load();
})();
</script>
</body>
</html>
