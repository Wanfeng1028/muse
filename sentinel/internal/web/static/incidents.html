<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件 - Muse</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <span class="brand">Muse</span>
  <nav>
    <a href="/">总览</a>
    <a href="/incidents" class="active">事件</a>
    <a href="/deliveries">投递队列</a>
    <a href="/sms-log">短信记录</a>
    <a href="/settings">设置</a>
  </nav>
</div>

<div class="page-header">
  <h1>事件</h1>
  <p>这里能看到所有事件，以及每一条的处理情况。</p>
</div>

<table class="data-table">
  <thead>
    <tr>
      <th>时间</th>
      <th>标题</th>
      <th>状态</th>
    </tr>
  </thead>
  <tbody id="incidents-body">
  </tbody>
</table>

<script>
(function () {
  fetch("/api/incidents")
    .then(function (resp) { return resp.json(); })
    .then(function (rows) {
      var body = document.getElementById("incidents-body");
      body.innerHTML = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var tr = document.createElement("tr");
        var tdTime = document.createElement("td");
        tdTime.textContent = r.created_at || "";
        tr.appendChild(tdTime);
        var tdTitle = document.createElement("td");
        tdTitle.textContent = r.title || "";
        tr.appendChild(tdTitle);
        var tdStatus = document.createElement("td");
        tdStatus.textContent = r.status || "";
        tr.appendChild(tdStatus);
        body.appendChild(tr);
      }
    });
})();
</script>
</body>
</html>
