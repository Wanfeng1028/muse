<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel · 监控管理</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f7fb;
      color: #1e293b;
      line-height: 1.5;
      padding: 0 24px 40px;
    }
    /* 顶栏 (与 index 一致) */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      margin: 0 -24px 28px;
      padding: 0 32px;
      height: 64px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      border-bottom: 1px solid #e9eef3;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      color: #0b2b4a;
    }
    .logo-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e5eff;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #4b5b6b;
      transition: color 0.15s;
    }
    .nav-links a:hover {
      color: #1e5eff;
    }
    .nav-links .active {
      color: #1e5eff;
      font-weight: 600;
      position: relative;
    }
    .nav-links .active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      right: 0;
      height: 2px;
      background: #1e5eff;
      border-radius: 2px;
    }
    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #2c3e50;
      font-size: 0.9rem;
    }
    .avatar {
      width: 34px;
      height: 34px;
      background: #d9e6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #1e5eff;
      font-size: 0.9rem;
    }

    /* 主布局 */
    .page-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 卡片通用 */
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 18px -8px rgba(0, 20, 45, 0.08), 0 0 0 1px #edf2f7;
      padding: 24px 28px;
      transition: box-shadow 0.2s;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #0b2b4a;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: #1e5eff;
      border-radius: 4px;
    }

    /* 表单 */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px 22px;
      align-items: end;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: #4e5f70;
      letter-spacing: 0.01em;
    }
    .form-field input,
    .form-field select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #dfe7ef;
      background: #ffffff;
      font-size: 0.9rem;
      transition: border 0.15s, box-shadow 0.15s;
      outline: none;
      font-family: inherit;
      color: #1e293b;
    }
    .form-field input:focus,
    .form-field select:focus {
      border-color: #1e5eff;
      box-shadow: 0 0 0 3px rgba(30, 94, 255, 0.15);
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
    }
    .checkbox-field input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1e5eff;
      margin: 0;
      cursor: pointer;
    }
    .checkbox-field label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
    }
    .form-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #d0dae6;
      font-family: inherit;
    }
    .btn-primary {
      background: #1e5eff;
      color: white;
      border: 1.5px solid #1e5eff;
      box-shadow: 0 6px 12px -4px rgba(30, 94, 255, 0.3);
    }
    .btn-primary:hover {
      background: #0a4ae0;
      border-color: #0a4ae0;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #cdd9e9;
      color: #2b3e50;
    }
    .btn-outline:hover {
      background: #f0f4fa;
      border-color: #a0b5cc;
    }
    .btn-sm {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 30px;
      font-weight: 500;
    }
    .btn-danger {
      color: #c2414a;
      border-color: #f3d1d4;
    }
    .btn-danger:hover {
      background: #fff5f6;
      border-color: #e6a6ae;
    }
    #btn-cancel-edit {
      display: none;
    }

    /* 表格 */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #eef3f9;
    }
    #monitor-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 1000px;
      background: white;
    }
    #monitor-table thead th {
      text-align: left;
      padding: 16px 16px;
      background: #f9fcff;
      font-weight: 600;
      color: #2d4055;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      border-bottom: 1.5px solid #e2ebf3;
      white-space: nowrap;
    }
    #monitor-table tbody td {
      padding: 16px 16px;
      border-bottom: 1px solid #eef3f9;
      vertical-align: middle;
      color: #1b2a3a;
    }
    #monitor-table tbody tr:last-child td {
      border-bottom: none;
    }
    #monitor-table tbody tr:hover {
      background: #fafdff;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #e6f7e6;
      color: #1e7b3c;
    }
    .status-badge.down {
      background: #fee9e9;
      color: #c2414a;
    }
    .status-badge.paused {
      background: #f0f2f5;
      color: #5e6e7e;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2e9e4a;
    }
    .status-badge.down .status-dot {
      background: #c2414a;
    }
    .status-badge.paused .status-dot {
      background: #8b9aab;
    }
    .uptime-cell {
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', monospace;
      color: #1e5eff;
    }
    .actions-cell {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 编辑状态高亮 */
    .editing-highlight {
      background-color: #f2f8ff;
      box-shadow: inset 0 0 0 2px #1e5eff1a;
    }

    .empty-row td {
      text-align: center;
      color: #7a8b9c;
      padding: 40px !important;
      font-style: italic;
    }

    .form-error {
      background: #fee9e9;
      color: #c2414a;
      border: 1.5px solid #f3d1d4;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 18px;
      word-break: break-all;
    }

    .loading-row td {
      text-align: center;
      color: #5e6e7e;
      padding: 40px !important;
    }

    /* 空状态 / 加载态 / 错误态 */
    .state-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 56px 24px;
      text-align: center;
    }
    .state-panel .state-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #2d4055;
    }
    .state-panel .state-desc {
      font-size: 0.9rem;
      color: #7a8b9c;
      max-width: 460px;
      line-height: 1.7;
    }
    .state-panel .state-actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .state-panel.is-error .state-title {
      color: #c2414a;
    }
    #monitor-error-state {
      display: none;
    }
    #monitor-error-state .state-actions {
      display: flex;
    }
    #monitor-list-body {
      display: none;
    }
    #monitor-list-loading {
      display: none;
    }

<div class="page-container">

  <!-- 新建 / 编辑监控表单 -->
  <section class="card" id="monitor-form-card">
    <div class="card-title" id="form-title">新建监控</div>
    <form id="m-form" onsubmit="event.preventDefault(); submitMonitorForm();">
      <div id="form-error" class="form-error" style="display:none;"></div>
      <div class="form-grid">
        <div class="form-field">
          <label for="m-name">名称</label>
          <input type="text" id="m-name" name="m-name" placeholder="例如：官网首页" autocomplete="off" required>
        </div>
        <div class="form-field">
          <label for="m-kind">类型</label>
          <select id="m-kind" name="m-kind">
            <option value="http">HTTP</option>
            <option value="tcp">TCP</option>
          </select>
        </div>
        <div class="form-field">
          <label for="m-target">目标</label>
          <input type="text" id="m-target" name="m-target" placeholder="https://example.com 或 host:port" required>
        </div>
        <div class="form-field">
          <label for="m-method">方法</label>
          <select id="m-method" name="m-method">
            <option value="GET">GET</option>
            <option value="HEAD">HEAD</option>
            <option value="POST">POST</option>
          </select>
        </div>
        <div class="form-field">
          <label for="m-expected">预期状态码 / 响应</label>
          <input type="text" id="m-expected" name="m-expected" placeholder="200 或 任意" value="200">
        </div>
        <div class="form-field">
          <label for="m-timeout">超时 (秒)</label>
          <input type="number" id="m-timeout" name="m-timeout" value="10" min="1" step="1">
        </div>
        <div class="form-field">
          <label for="m-interval">间隔 (秒)</label>
          <input type="number" id="m-interval" name="m-interval" value="60" min="5" step="1">
        </div>
        <div class="form-field">
          <label for="m-webhook">Webhook 地址 (可选)</label>
          <input type="url" id="m-webhook" name="m-webhook" placeholder="https://hooks.example.com/...">
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="m-enabled" name="m-enabled" checked>
          <label for="m-enabled">启用监控</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="m-public" name="m-public">
          <label for="m-public">公开（状态页可见）</label>
        </div>
        <div class="form-field">
          <label>短信告警</label>
          <div class="checkbox-field" style="gap:12px; flex-wrap:wrap;">
            <span style="display:inline-flex; align-items:center; gap:4px;"><input type="checkbox" class="m-channel" value="webhook" checked><label>Webhook</label></span>
            <span style="display:inline-flex; align-items:center; gap:4px;"><input type="checkbox" class="m-channel" value="smtp"><label>邮件</label></span>
            <span style="display:inline-flex; align-items:center; gap:4px;"><input type="checkbox" class="m-channel" value="wecom"><label>企业微信</label></span>
            <span style="display:inline-flex; align-items:center; gap:4px;"><input type="checkbox" class="m-channel" value="sms"><label>短信</label></span>
          </div>

  function getStatusText(status) {
    if (status === 'up') return '正常';

    if (status === 'up') return 'status-badge';

  // 格式化可用率
  function formatUptime(value) {
    if (value === null || value === undefined) return '—';
    var n = typeof value === 'number' ? value : parseFloat(value);
    if (!isFinite(n)) return '—';
    return n.toFixed(2) + '%';
  }

  // ---------- 渲染表格 ----------
  function setListPanels(visibleId) {
    var ids = ['monitor-list-loading', 'monitor-empty-state', 'monitor-list-body'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.style.display = (ids[i] === visibleId) ? 'block' : 'none';
    }
  }

  function renderMonitorTable() {
    const tbody = document.getElementById('monitor-tbody');
    if (!tbody) return;

    if (listState === 'loading') {
      setListPanels('monitor-list-loading');
      return;
    }

    if (listState === 'error') {
      var descEl = document.getElementById('monitor-error-desc');
      if (descEl) descEl.textContent = '错误：' + listError + '。点下面的按钮再试一次。';
      setListPanels('monitor-empty-state');
      return;
    }

    if (monitors.length === 0) {
      setListPanels('monitor-empty-state');
      return;
    }

    setListPanels('monitor-list-body');

    let html = '';
    monitors.forEach(mon => {
      const statusClass = getStatusClass(mon.status);
      const statusText = getStatusText(mon.status);
      const enabledLabel = mon.enabled ? '' : ' (已禁用)';
      const publicBadge = mon.is_public ? ' <span style="font-size:12px;color:#0f766e;background:#ccfbf1;border:1px solid #99f6e4;border-radius:4px;padding:1px 6px;margin-left:6px;">公开</span>' : '';
      const uptimeDisplay = uptimeDisplayFor(mon.id);

      html += `
        <tr data-id="${mon.id}">
          <td><strong>${escapeHtml(mon.name)}</strong>${enabledLabel}${publicBadge}</td>
          <td>${escapeHtml(String(mon.kind || '').toUpperCase())}</td>
          <td style="max-width:200px; word-break:break-all;">${escapeHtml(mon.target)}</td>
          <td>${mon.interval}s</td>
          <td><span class="${statusClass}"><span class="status-dot"></span>${statusText}</span></td>
          <td class="uptime-cell">${uptimeDisplay}</td>
          <td>
            <div class="actions-cell">
              <a class="btn btn-outline btn-sm" href="/profile?id=${mon.id}">健康档案</a>
              <button class="btn btn-outline btn-sm" onclick="checkNow('${mon.id}')">立即检查</button>
              <button class="btn btn-outline btn-sm" onclick="editMonitor('${mon.id}')">编辑</button>
              <button class="btn btn-outline btn-sm btn-danger" onclick="deleteMonitor('${mon.id}')">删除</button>
            </div>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  // ---------- 从后端加载监控列表 ----------
  async function loadMonitors() {
    listState = 'loading';
    listError = '';
    renderMonitorTable();
    try {
      const res = await fetch('/api/monitors', {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      if (!res.ok) {
        const data = await res.json().catch(function(){ return {}; });
        throw new Error((data && data.error) || ('HTTP ' + res.status));
      }
      const data = await res.json();
      const rows = Array.isArray(data) ? data : (data && Array.isArray(data.monitors) ? data.monitors : []);
      monitors = rows.map(function(item) {
        const uptimeRaw = (item.uptime24h !== undefined && item.uptime24h !== null)
          ? item.uptime24h
          : (item.uptime_24h !== undefined && item.uptime_24h !== null ? item.uptime_24h : null);
        let uptime = null;
        if (uptimeRaw !== null) {
          const num = Number(uptimeRaw);
          uptime = isNaN(num) ? null : num;
        }
        const enabledFlag = item.enabled === undefined ? true : (item.enabled === true || item.enabled === 1 || item.enabled === '1');
        let status = item.status;
        if (!status) {
          status = enabledFlag ? 'up' : 'paused';
        }
        return {
          id: item.id,
          name: item.name || '',
          kind: item.kind || '',
          target: item.target || '',
          interval: item.interval_sec !== undefined ? item.interval_sec : (item.interval !== undefined ? item.interval : 0),
          enabled: enabledFlag,
          is_public: item.is_public ? 1 : 0,
          status: status,
          uptime24h: uptime
        };
      });
      listState = 'ready';
      renderMonitorTable();
    } catch (err) {
      listState = 'error';
      listError = err && err.message ? err.message : '未知错误';
      renderMonitorTable();
    }
  }

  // 简单的转义
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ---------- 表单重置（新建模式）----------
  function resetFormToCreateMode() {
    document.getElementById('form-title').innerText = '新建监控';
    document.getElementById('m-form').reset();
    // 设置默认值
    document.getElementById('m-kind').value = 'http';
    document.getElementById('m-method').value = 'GET';
    document.getElementById('m-expected').value = '200';
    document.getElementById('m-timeout').value = '10';
    document.getElementById('m-interval').value = '60';
    document.getElementById('m-enabled').checked = true;
    document.getElementById('m-public').checked = false;
    document.getElementById('m-webhook').value = '';
    document.getElementById('btn-submit').innerText = '创建监控';
    document.querySelectorAll('.m-channel').forEach(function(el){ el.checked = el.value === 'webhook'; });
    document.getElementById('m-sms-phones').value = '';
    document.getElementById('btn-cancel-edit').style.display = 'none';
    editingId = null;

    // 移除表格高亮
    document.querySelectorAll('#monitor-table tbody tr').forEach(tr => tr.classList.remove('editing-highlight'));
  }

  // ---------- 表单提交（真实 API）----------
  function sentinelToken() {
    return sessionStorage.getItem('sentinel_token') || '';
  }
  async function sentinelFetch(url, options) {
    var opts = options || {};
    var headers = opts.headers ? Object.assign({}, opts.headers) : {};
    var token = sentinelToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    opts.headers = headers;
    var res = await fetch(url, opts);
    if (res.status === 401 && !opts._retried) {
      var t = prompt('需要 API Token 才能访问（SENTINEL_API_TOKEN），请输入：');
      if (t) {
        sessionStorage.setItem('sentinel_token', t.trim());
        opts._retried = true;
        return sentinelFetch(url, opts);
      }
    }
    return res;
  }
  async function submitMonitorForm() {
    var val = function(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var channels = Array.prototype.map.call(
      document.querySelectorAll('.m-channel:checked'), function(el){ return el.value; }).join(',');
    var payload = {
      name: val('m-name'),
      kind: val('m-kind'),
      target: val('m-target'),
      method: val('m-method'),
      expected_status: parseInt(val('m-expected'), 10) || 200,
      timeout_sec: parseInt(val('m-timeout'), 10) || 10,
      interval_sec: parseInt(val('m-interval'), 10) || 60,
      webhook_url: val('m-webhook'),
      notify_channels: channels,
      sms_phones: val('m-sms-phones'),
      enabled: document.getElementById('m-enabled').checked ? 1 : 0,
      is_public: document.getElementById('m-public').checked ? 1 : 0
    };
    var url = editingId ? '/api/monitors/' + encodeURIComponent(editingId) : '/api/monitors';
    var method = editingId ? 'PUT' : 'POST';
    try {
      var res = await doMonitorSubmit(url, method, payload, false);
      if (!res.ok) {
        var data = await res.json().catch(function(){ return {}; });
        throw new Error((data && data.error) || ('HTTP ' + res.status));
      }
      alert(editingId ? '保存成功' : '创建成功');
      resetFormToCreateMode();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();
      loadMonitors();

      loadMonitors();
      loadMonitors();
      loadMonitors();
    } catch (err) {
      alert('保存失败：' + err.message);
    }
  }
  async function doMonitorSubmit(url, method, payload, retried) {
    var headers = { 'Content-Type': 'application/json' };
    var token = sentinelToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch(url, { method: method, headers: headers, body: JSON.stringify(payload) });
    if (res.status === 401 && !retried) {
      var t = prompt('需要 API Token 才能访问（SENTINEL_API_TOKEN），请输入：');
      if (t) {
        sessionStorage.setItem('sentinel_token', t.trim());
        return doMonitorSubmit(url, method, payload, true);
      }
    }
    return res;
  }

  // ---------- 缺失函数补齐（v0.8.4） ----------
  function uptimeDisplayFor(id) {
  var targetId = String(id);
  for (var i = 0; i < monitors.length; i++) {
    if (String(monitors[i].id) === targetId) {
      var u = monitors[i].uptime24h;
      if (u === null || u === undefined) return '-';
      return Number(u).toFixed(1) + '%';
    }
  }
  return '-';
  }

  async function checkNow(id) {
    try {
      var res = await sentinelFetch('/api/monitors/' + encodeURIComponent(id) + '/check', { method: 'POST' });
      if (!res.ok) {
        var edata = await res.json().catch(function(){ return {}; });
        throw new Error((edata && edata.error) || ('HTTP ' + res.status));
      }
      alert('已触发检查');
    } catch (e) {
      alert(e && e.message ? e.message : '触发检查失败');
    } finally {
      loadMonitors();
    }
  }

  async function deleteMonitor(id) {
    if (!confirm('确定要删除该监控吗？')) return;
    var res = await sentinelFetch('/api/monitors/' + encodeURIComponent(id), { method: 'DELETE' });
    if (!res.ok) {
      var edata = await res.json().catch(function(){ return {}; });
      throw new Error((edata && edata.error) || ('HTTP ' + res.status));
    }
    alert('已删除');
    loadMonitors();
  }

  async function editMonitor(id) {
    try {
      var res = await sentinelFetch('/api/monitors/' + encodeURIComponent(id), { method: 'GET' });
      if (!res.ok) {
        var edata = await res.json().catch(function(){ return {}; });
        throw new Error((edata && edata.error) || ('HTTP ' + res.status));
      }
      var data = await res.json();

      document.getElementById('m-name').value = data.name || '';
      document.getElementById('m-kind').value = data.kind || '';
      document.getElementById('m-target').value = data.target || '';
      document.getElementById('m-method').value = data.method || '';
      document.getElementById('m-expected').value = (data.expected_status === null || data.expected_status === undefined) ? '' : String(data.expected_status);
      document.getElementById('m-timeout').value = (data.timeout_sec === null || data.timeout_sec === undefined) ? '' : String(data.timeout_sec);
      document.getElementById('m-interval').value = (data.interval_sec === null || data.interval_sec === undefined) ? '' : String(data.interval_sec);
      document.getElementById('m-webhook').value = data.webhook_url || '';
      document.getElementById('m-enabled').checked = !!data.enabled;
      document.getElementById('m-public').checked = !!data.is_public;
      document.getElementById('m-sms-phones').value = data.sms_phones || '';

      var channels = [];
      if (data.notify_channels) {
        channels = String(data.notify_channels).split(',');
        for (var c = 0; c < channels.length; c++) {
          channels[c] = channels[c].replace(/^\s+|\s+$/g, '');
        }
      }
      var boxes = document.querySelectorAll('.m-channel');
      for (var i = 0; i < boxes.length; i++) {
        boxes[i].checked = false;
      }
      for (var j = 0; j < boxes.length; j++) {
        if (channels.indexOf(boxes[j].value) !== -1) {
          boxes[j].checked = true;
        }
      }

      editingId = id;
      document.getElementById('form-title').textContent = '编辑监控';
      document.getElementById('btn-submit').textContent = '保存修改';
      var cancelBtn = document.getElementById('btn-cancel-edit');
      if (cancelBtn) cancelBtn.style.display = '';
      window.scrollTo(0, 0);
    } catch (err) {
      alert('加载监控失败：' + (err && err.message ? err.message : err));
    }
  }
