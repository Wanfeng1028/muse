<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短信记录 - 哨兵 Sentinel</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/design-v015.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="/"><span class="brand-mark"></span>哨兵 Sentinel</a>
  <nav class="nav">
    <a href="/">总览</a>
    <a href="/incidents">事件</a>
    <a href="/deliveries">投递队列</a>
    <a href="/sms-log" class="active">短信记录</a>
  </nav>
</div>

<main class="container">
<div class="page-header">
  <h1>短信记录</h1>
  <p>这里能看到所有发出去的短信，以及每一条的发送结果。</p>
</div>

<div class="filters">
  <label for="filter-phone">号码</label>
  <input type="text" id="filter-phone" placeholder="输入手机号">
  <label for="filter-status">状态</label>
  <select id="filter-status">
    <option value="">全部</option>
    <option value="sent">sent</option>
    <option value="failed">failed</option>
  </select>
  <label for="filter-monitor">监控</label>
  <input id="filter-monitor" placeholder="输入监控 ID">
  <button type="button" id="btn-query">查询</button>
</div>

<table class="data-table">
  <thead>
    <tr>
      <th>时间</th>
      <th>号码</th>
      <th>渠道</th>
      <th>状态</th>
      <th>监控</th>
      <th>短信内容</th>
      <th>错误</th>
    </tr>
  </thead>
  <tbody id="sms-log-body">
  </tbody>
</table>

<div id="empty-state" class="empty-state" style="display:none;">还没有短信记录</div>

<div class="pager">
  <button type="button" id="btn-prev">上一页</button>
  <span id="page-info"></span>
  <button type="button" id="btn-next">下一页</button>
</div>

</main>
<script>
(function () {
  var LIMIT = 50;
  var offset = 0;
  var total = 0;

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function truncate(s, n) {
    if (s === null || s === undefined) return "";
    s = String(s);
    if (s.length <= n) return s;
    return s.slice(0, n) + "…";
  }

  function renderRows(rows) {
    var body = document.getElementById("sms-log-body");
    var empty = document.getElementById("empty-state");
    body.innerHTML = "";
    if (!rows || rows.length === 0) {
      empty.style.display = "";
      return;
    }
    empty.style.display = "none";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var tr = document.createElement("tr");

      var tdTime = document.createElement("td");
      tdTime.textContent = r.created_at || "";
      tr.appendChild(tdTime);

      var tdPhone = document.createElement("td");
      tdPhone.textContent = r.phone || "";
      tr.appendChild(tdPhone);

      var tdProvider = document.createElement("td");
      tdProvider.textContent = r.provider || "";
      tr.appendChild(tdProvider);

      var tdStatus = document.createElement("td");
      tdStatus.textContent = r.status || "";
      tr.appendChild(tdStatus);

      var tdMonitor = document.createElement("td");
      tdMonitor.textContent = (r.monitor_id && r.monitor_id > 0) ? String(r.monitor_id) : "—";
      tr.appendChild(tdMonitor);

      var tdContent = document.createElement("td");


      tdContent.textContent = truncate(r.message, 60);
      tdContent.title = r.message || "";
      tr.appendChild(tdContent);

      var tdError = document.createElement("td");
      tdError.textContent = r.error || "";
      tr.appendChild(tdError);

      body.appendChild(tr);
    }
  }

  function updatePager() {
    var info = document.getElementById("page-info");
    var start = total === 0 ? 0 : offset + 1;
    var end = Math.min(offset + LIMIT, total);
    info.textContent = "第 " + start + "-" + end + " 条，共 " + total + " 条";
    document.getElementById("btn-prev").disabled = offset <= 0;
    document.getElementById("btn-next").disabled = offset + LIMIT >= total;
  }

  function load() {
    var phone = document.getElementById("filter-phone").value;
    var status = document.getElementById("filter-status").value;
    var monitor = document.getElementById("filter-monitor").value;
    var params = [];
    params.push("limit=" + LIMIT);
    params.push("offset=" + offset);
    if (phone) params.push("phone=" + encodeURIComponent(phone));
    if (status) params.push("status=" + encodeURIComponent(status));
    if (monitor) params.push("monitor_id=" + encodeURIComponent(monitor));
    var url = "/api/sms/log?" + params.join("&");

    var headers = {};
    try {
      var saved = sessionStorage.getItem("sentinel_token");
      if (saved) headers["Authorization"] = "Bearer " + saved;
    } catch (e) {}
    fetch(url, { headers: headers })
      .then(function (resp) {
        if (resp.status === 401) {
          var t = prompt("需要 API Token 才能访问（SENTINEL_API_TOKEN），请输入：");
          if (t) {
            try { sessionStorage.setItem("sentinel_token", t.trim()); } catch (e) {}
            load();
            return null;
          }
        }
        return resp.json();
      })
      .then(function (data) {
        if (!data) return;
        var rows = data.logs || [];
        if (typeof data.total === "number") {
          total = data.total;
        } else {
          total = rows.length;
        }
        renderRows(rows);
        updatePager();
      })
      .catch(function () {
        renderRows([]);
        total = 0;
        updatePager();
      });
  }

  document.getElementById("btn-query").addEventListener("click", function () {
    offset = 0;
    load();
  });

  document.getElementById("btn-prev").addEventListener("click", function () {
    if (offset <= 0) return;
    offset -= LIMIT;
    if (offset < 0) offset = 0;
    load();
  });

  document.getElementById("btn-next").addEventListener("click", function () {
    if (offset + LIMIT >= total) return;
    offset += LIMIT;
    load();
  });

  load();
})();
</script>
</body>
</html>
