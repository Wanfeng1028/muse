<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=830" />
    <title>letter-flythrough</title>
    <script>
      // letter-flythrough CONFIG: every piece of on-screen text and every
      // tunable. The block between the markers is strict JSON (no comments)
      // because the hf-motion scaffold parses and rewrites it. After a hand
      // edit, re-run `scaffold.mjs letter-flythrough <dir> --update` so the
      // static timing attributes and glyphs.js follow; the timeline refuses to
      // build if they disagree.
      const CONFIG = /* CONFIG:BEGIN */{
        "letters": "AI",
        "nextText": "프롬프트 한 줄",
        "diveAt": 2,
        "diveDur": 2,
        "targetGlyphIndex": 0,
        "paper": "#f2eee6",
        "charcoal": "#1e1e1e",
        "red": "#e5322d"
      }/* CONFIG:END */;
    </script>
    <!-- glyphs.js: the letters' outlines, the target hole and the landing rect,
         generated by the scaffold from the bundled font (canvas px). -->
    <script src="glyphs.js"></script>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "IntroSans";
        src: url("assets/fonts/NanumSquare_acEB.ttf") format("truetype");
        font-weight: 800;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 830px;
        overflow: hidden;
        background: var(--paper);
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 830px;
        overflow: hidden;
        background: var(--paper);
        font-family: "IntroSans", sans-serif;
        font-weight: 800;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 830px;
      }
      #letters { z-index: 1; }
      #next { z-index: 2; }
      /* The camera is the SVG viewBox, so the outlines stay vector-sharp at
         any zoom. */
      #world { display: block; width: 1080px; height: 830px; }
      #hole { fill: var(--red); }
      #ink { fill: var(--charcoal); }
      /* The next scene is authored at canvas size and placed on the landing
         rect inside the hole (scale 1/S); at the end of the dive its net
         transform is the identity, so the text is crisp. Its red background
         is the hole's until the landing (one fill, no double alpha). */
      #nextBox {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 830px;
        transform-origin: 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
        text-align: center;
        color: var(--paper);
      }
      .word { font-size: 150px; line-height: 1.1; white-space: nowrap; }
    </style>
  </head>
  <body>
    <!-- Timing attributes below are written by the scaffold from CONFIG
         (root data-duration is read statically by the engine, before any
         script runs). Do not hand-edit them. -->
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1080"
      data-height="830"
    >
      <!-- The camera zooms both layers far past the canvas on purpose; the
           allow-overflow attributes mark it for check. -->
      <!-- Letters (outlines + the red hole): leave when the dive lands, the hole then covers the frame -->
      <div id="letters" class="clip layer" data-start="0" data-duration="4" data-track-index="0" data-layout-allow-overflow="true">
        <svg id="world" viewBox="0 0 1080 830" xmlns="http://www.w3.org/2000/svg">
          <path id="hole" />
          <path id="ink" />
        </svg>
      </div>

      <!-- Next scene: inside the hole from the first frame to the last, so the dive is one continuous move -->
      <div id="next" class="clip layer" data-start="0" data-duration="6" data-track-index="1" data-layout-allow-overflow="true">
        <div id="nextBox"><div id="nextText" class="word"></div></div>
      </div>
    </div>

    <script>
      const C = CONFIG, G = window.GLYPHS;
      const $ = (id) => document.getElementById(id);
      const win = (id) => {
        const el = $(id);
        return { start: +el.dataset.start, end: +el.dataset.start + +el.dataset.duration, dur: +el.dataset.duration };
      };
      const W = 1080, H = 830;

      // ---- palette: exactly three colours
      const root = document.documentElement.style;
      root.setProperty("--paper", C.paper);
      root.setProperty("--charcoal", C.charcoal);
      root.setProperty("--red", C.red);

      // ---- guards: static timing attributes and glyphs.js must match CONFIG
      const near = (a, b) => Math.abs(a - b) <= 1e-3;
      if (!near(win("letters").end, C.diveAt + C.diveDur) || !near(win("next").end, win("stage").end)) {
        throw new Error("letter-flythrough: timing attributes disagree with CONFIG; re-run scaffold --update");
      }
      if (!G || G.letters !== C.letters || G.targetGlyphIndex !== C.targetGlyphIndex) {
        throw new Error("letter-flythrough: glyphs.js disagrees with CONFIG; re-run scaffold --update");
      }

      // ponytail: per-glyph width estimate instead of measuring the loaded font
      // (same rule as intro-kinetic). Shrinks only, never grows.
      const fit = (text, px, maxW = W - 160) => {
        let em = 0;
        for (const ch of text) {
          if (/[ㄱ-힣一-鿿]/.test(ch)) em += 0.95;
          else if (/[\s,.]/.test(ch)) em += 0.3;
          else if (/[A-Z]/.test(ch)) em += 0.7;
          else em += 0.6;
        }
        return Math.min(px, Math.floor(maxW / Math.max(em, 0.01)));
      };
      $("nextText").textContent = C.nextText;
      $("nextText").style.fontSize = fit(C.nextText, 150) + "px";
      $("ink").setAttribute("d", G.ink);
      $("hole").setAttribute("d", G.hole);

      // ---- camera. The landing rect [x, y, w, h] (canvas ratio, inside the
      // hole) ends exactly on the frame: scale S = W / w. Zoom is exponential
      // in progress (constant perceived speed), and the rect centre slides to
      // the frame centre on the same ease, so p = 1 is the rect = the frame.
      const [rx, ry, rw] = G.rect;
      const S = W / rw, cx = rx + rw / 2, cy = ry + (rw * H) / W / 2;
      const ease = gsap.parseEase("power2.inOut");
      const draw = (p) => {
        const e = ease(Math.min(1, Math.max(0, p)));
        const s = Math.pow(S, e);
        const sx = cx + (W / 2 - cx) * e, sy = cy + (H / 2 - cy) * e; // rect centre on screen
        const vx = cx - sx / s, vy = cy - sy / s;                     // viewBox origin
        $("world").setAttribute("viewBox", `${vx} ${vy} ${W / s} ${H / s}`);
        const k = s / S;
        $("nextBox").style.transform = e >= 1 ? "none" : `translate(${(rx - vx) * s}px, ${(ry - vy) * s}px) scale(${k})`;
        $("nextBox").style.background = e >= 1 ? "var(--red)" : "transparent";
      };

      // ---- timeline: positions = CONFIG + scene windows (from the DOM)
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#letters", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "power3.out" }, 0);
      // the dive: one camera, both layers, so it is a move, never a cut
      const prog = { p: 0 };
      tl.fromTo(prog, { p: 0 }, { p: 1, duration: C.diveDur, ease: "none", onUpdate: () => draw(prog.p), immediateRender: false }, C.diveAt);
      // the next text surfaces while the hole grows (it is still tiny at T)
      tl.fromTo("#nextText", { opacity: 0 }, { opacity: 1, duration: 0.5 * C.diveDur, ease: "power1.in" }, C.diveAt);
      // full-screen hold: a slow push from where the dive left the text (no jump)
      const land = win("letters").end;
      tl.fromTo("#nextText", { scale: 1 }, { scale: 1.04, duration: win("stage").end - land, ease: "none", immediateRender: false }, land);
      tl.set({}, {}, win("stage").end);

      draw(0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
