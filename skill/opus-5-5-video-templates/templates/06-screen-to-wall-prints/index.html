    <script>
      (function () {
        const v = K.vars();
        K.bind(v);
        const $ = K.$, E = K.E, P = K.prog, C = K.clamp, L = K.lerp, R = K.rnd;
        const DUR = 29, TAU = Math.PI * 2;
        const INK = v.ink;
        const ioq = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        const ios = (u) => -(Math.cos(Math.PI * u) - 1) / 2;
        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const px = (n) => n.toFixed(1) + "px";
        const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        const blurS = (b) => (b > 0.25 ? "blur(" + b.toFixed(1) + "px)" : "none");
        const fade = (el, a) => { K.show(el, a > 0.002); el.style.opacity = C(a).toFixed(3); };
        const box = (el, x, y, w, h, r) => { el.style.left = px(x); el.style.top = px(y); el.style.width = px(w); el.style.height = px(h); if (r != null) el.style.borderRadius = px(r); };
        const list = (s) => String(s).split(";").map((x) => x.trim());
        const MBF = {};
        const mblur = (el, key, sx, sy) => {
          if (sx < 0.3 && sy < 0.3) { el.style.filter = "none"; return; }
          let g = MBF[key];
          if (!g) { const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter"); f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-50%"); f.setAttribute("y", "-50%"); f.setAttribute("width", "200%"); f.setAttribute("height", "200%"); g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g); let defs = document.getElementById("mbDefs"); if (!defs) { const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute"; defs = document.createElementNS(ns, "defs"); defs.id = "mbDefs"; svg.appendChild(defs); document.body.appendChild(svg); } defs.appendChild(f); MBF[key] = g; }
          g.setAttribute("stdDeviation", sx.toFixed(1) + " " + sy.toFixed(1));
          el.style.filter = "url(#mb_" + key + ")";
        };
        // piecewise keys: [[t, a, b, ...], ...] -> eased values
        const keyed = (keys, t, ez) => {
          if (t <= keys[0][0]) return keys[0].slice(1);
          for (let k = 0; k < keys.length - 1; k++) if (t < keys[k + 1][0]) { const u = (ez || ios)((t - keys[k][0]) / (keys[k + 1][0] - keys[k][0])); return keys[k].slice(1).map((x, i) => L(x, keys[k + 1][i + 1], u)); }
          return keys[keys.length - 1].slice(1);
        };
        const fx = $("fx").getContext("2d");

        // ---------- shutter: a disc or rect of blades with an n-gon aperture ----------
        function shutter(g, shape, cx, cy, Rr, open, rot, alpha) {
          g.save();
          g.beginPath(); shape(g); g.clip();
          const gr = g.createRadialGradient(cx, cy, 0, cx, cy, Rr * 1.2);
          gr.addColorStop(0, "rgba(52,53,58," + alpha + ")"); gr.addColorStop(1, "rgba(28,29,32," + alpha + ")");
          g.fillStyle = gr; g.fillRect(cx - Rr * 2, cy - Rr * 2, Rr * 4, Rr * 4);
          const a = Rr * open, n = 6, V = [];
          for (let k = 0; k < n; k++) { const ang = rot + (k * TAU) / n; V.push([cx + Math.cos(ang) * a, cy + Math.sin(ang) * a]); }

          g.beginPath(); V.forEach((p, k) => (k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill();

          g.strokeStyle = "rgba(255,255,255," + (0.3 * alpha).toFixed(3) + ")"; g.lineWidth = 3;
          V.forEach((p, k) => { const q = V[(k + 1) % n], dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy) || 1; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + (dx / d) * Rr * 3, p[1] + (dy / d) * Rr * 3); g.stroke(); });
          g.restore();
        }
        const rrect = (g, x, y, w, h, r) => { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

        // ================= S1 / S9: wordmark, dot, pill =================
        const wm = $("wm"), pill = $("pill"), pillT = $("pillT");
        const word = String(v.brand), hasDot = word.endsWith(".");
        const letters = [...(hasDot ? word.slice(0, -1) : word)].map((c) => { const s = document.createElement("span"); s.textContent = c === " " ? "\u00a0" : c; wm.appendChild(s); return s; });
        const per = document.createElement("span"); per.textContent = "."; per.style.color = "transparent"; wm.appendChild(per);
        $("tag").textContent = v.tagline;
        pillT.textContent = v.pill;
        let WG = null;
        function measureWord() {
          const s1 = $("s1"), pv = s1.style.display; s1.style.display = "";
          const w = wm.offsetWidth; wm.style.left = px(540 - w / 2); wm.style.top = "0px";
          const bl = document.createElement("span"); bl.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline"; wm.appendChild(bl);
          const base0 = bl.getBoundingClientRect().top - wm.getBoundingClientRect().top; wm.removeChild(bl);
          wm.style.top = px(560 - base0);
          const r0 = wm.getBoundingClientRect();
          const L0 = letters.map((s) => { const b = s.getBoundingClientRect(); return { x: b.left - r0.left, w: b.width }; });
          const pb = per.getBoundingClientRect();
          const dotD = 0.2 * 172;
          WG = { x0: 540 - w / 2, L0, dotX: pb.left + dotD * 0.62, dotY: 560 - dotD / 2, dotD };
          s1.style.display = pv;
        }
        // the black shape: dot -> pill -> circle (start), full screen -> pill -> dot (end)
        const PILL = { w: 450, h: 143 };
        function s1(t) {
          const on = t < 1.25 || t >= 27.2;
          K.show($("s1"), on);
          if (!WG) measureWord();
          if (!on) return;
          const end = t >= 27.2;
          letters.forEach((s, i) => {
            const n = letters.length;
            if (!end) {
