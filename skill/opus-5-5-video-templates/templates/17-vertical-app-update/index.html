    <script>
      (function () {
        const v = K.vars();

        const ACC = v.accent;
        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const ioq = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        const hexRGB = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
        const mix = (a, b, u) => { const A = hexRGB(a), B = hexRGB(b); return "rgb(" + A.map((x, i) => Math.round(L(x, B[i], u))).join(",") + ")"; };
        const blur = (el, b) => { el.style.filter = b > 0.2 ? "blur(" + b.toFixed(1) + "px)" : "none"; };
        const MBF = {};
        const mblur = (el, key, sx, sy) => {
          if (sx < 0.3 && sy < 0.3) { el.style.filter = "none"; return; }
          let g = MBF[key];
          if (!g) { const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter"); f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-20%"); f.setAttribute("y", "-20%"); f.setAttribute("width", "140%"); f.setAttribute("height", "140%"); g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g); document.getElementById("defs").appendChild(f); MBF[key] = g; }
          g.setAttribute("stdDeviation", sx.toFixed(1) + " " + sy.toFixed(1));

        };
        const fade = (el, a) => { el.style.opacity = C(a).toFixed(3); K.show(el, a > 0.001); };

        const IC = {
          x: '<path d="M6 6l12 12M18 6L6 18"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
          filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
          list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', down: '<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>', eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 4M6.1 6.1C3.6 7.9 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 4.9-1.3"/>',
          check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', back: '<path d="M15 6l-6 6 6 6"/>', chev: '<path d="M9 6l6 6-6 6"/>', cloud: '<path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/>',
          refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', restore: '<path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/><path d="M12 8v4l3 2"/>', share: '<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>', file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
          book: '<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 8h6M9 12h6"/>', dumb: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>', heart: '<path d="M12 20s-7-4.4-9.3-8.8A5 5 0 0 1 12 6.1a5 5 0 0 1 9.3 5.1C19 15.6 12 20 12 20z"/>',
          run: '<circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 3 4 3 1"/>', laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>', nosmoke: '<path d="M3 3l18 18M2 15h9M15 15h2v3h-5M18 15h4v3h-1"/>', bowl: '<path d="M3 12h18a9 9 0 0 1-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/>',
          drop: '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>', lotus: '<path d="M12 20c-5 0-8-3-8-6 3 0 6 1 8 4 2-3 5-4 8-4 0 3-3 6-8 6zM12 18c-2-3-2-7 0-10 2 3 2 7 0 10z"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
        };
        const ic = (n, st) => '<svg class="i" viewBox="0 0 24 24"' + (st ? ' style="' + st + '"' : "") + ">" + IC[n] + "</svg>";

        // ================= background =================
        const bg = $("bg").getContext("2d");
        const DOTS = (() => { const c = document.createElement("canvas"); c.width = 1080; c.height = 1920; const g = c.getContext("2d"); g.fillStyle = "rgba(255,255,255,0.035)"; for (let y = 20; y < 1920; y += 40) for (let x = 20; x < 1080; x += 40) g.fillRect(x - 3, y - 3, 6, 6); return c; })();
        const glow = (x, y, r, col, a) => { const g = bg.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace("A", a)); g.addColorStop(1, col.replace("A", 0)); bg.fillStyle = g; bg.fillRect(0, 0, 1080, 1920); };
        function drawBg(t) {
          bg.fillStyle = "#09090c"; bg.fillRect(0, 0, 1080, 1920);
          const s1 = t < 1.8 || t > 13.3 ? 1 : 0;
          glow(260, 260, 900, "rgba(70,110,30,A)", 0.34 * (t < 1.8 ? 1 : t > 13.3 ? P(t, 13.3, 13.8) : 0.25));
          glow(540, 1350, 800, "rgba(110,70,150,A)", 0.3);
          glow(900, 1900, 700, "rgba(130,40,50,A)", 0.3);
          if (t > 4.2 && t < 5.5) glow(540, 330, 520, "rgba(34,211,238,A)", 0.18);
          if (t > 5.8 && t < 9.4) { glow(120, 1850, 700, "rgba(150,90,40,A)", 0.3); glow(1000, 1700, 700, "rgba(40,120,90,A)", 0.24); }
          if (t > 9.4 && t < 13.3) glow(540, 700, 900, "rgba(40,70,140,A)", 0.3);
          bg.drawImage(DOTS, 0, 0);
          const vg = bg.createRadialGradient(540, 960, 500, 540, 960, 1250); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");
          bg.fillStyle = vg; bg.fillRect(0, 0, 1080, 1920);

        const DIMC = ["#45612f", "#45612f", "#31506e", "#31506e", "#2c604c", "#2c604c", "#613e48", "#613e48"];
        const DIM = ["01000100", "00010000", "01101000", "00000011", "00111000", "01000100", "01001100", "00100011"];
        const GL = 196, GT = 410, PITCH = 87;
        const tiles = [];
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const d = document.createElement("div");
          d.className = "tile";
          $("tilesL").appendChild(d);
          tiles.push({ el: d, r, c, x: GL + c * PITCH, y: GT + r * 88, dim: DIM[r][c] === "1", lit: 14.25 + R(r * 8 + c + 0.5) * 0.6, sx: L(250, 830, R(r * 11.3 + c * 2.1)), sy: L(300 + r * 150, 700 + r * 150, R(r * 3.7 + c * 5.9)), sr: (R(r * 2.9 + c) - 0.5) * 200 });
        }
        const tileAt = (tl, x, y, s, rot, col, a) => { tl.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg) scale(" + s.toFixed(3) + ")"; tl.el.style.background = col; tl.el.style.opacity = C(a).toFixed(3); };
        function drawTiles(t) {
          const on = t < 1.95 || t >= 13.28;
          K.show($("tilesL"), on);

              const drift = 1 - E.outCubic(u);
              let x = tl.x + drift * (22 + tl.c * 6), y = tl.y - drift * 30, s = C(e, 0, 1.2), rot = drift * 40;
              // shuffle, then scatter away from the centre

              if (sc > 0) { const ang = Math.atan2(tl.y + 39 - 760, tl.x + 39 - 540); x += Math.cos(ang) * sc * 520; y += Math.sin(ang) * sc * 520; rot += sc * tl.sr; s *= 1 - sc * 0.3; }
              tileAt(tl, x, y, s, rot, col, C(u * 3) * (1 - P(t, 1.8, 1.92)));
            } else {
              const a = 13.36 + tl.r * 0.035 + R(tl.c * 3.1 + tl.r) * 0.05, u = P(t, a, a + 0.34), e = E.outCubic(u);
              const x = L(tl.sx, tl.x, e), y = L(tl.sy, tl.y, e), rot = (1 - e) * tl.sr, s = L(0.8, 1, e);

              tl.el.style.boxShadow = t > 14.3 && !tl.dim ? "0 0 22px " + ROWC[tl.r] + "33" : "none";

        }

        // ================= wordmark =================
        const wmChars = [];
        [[v.brandA, ""], [v.brandB, "b"]].forEach(([txt, cls]) => [...txt].forEach((c) => { const s = document.createElement("span"); s.className = "ch " + cls; s.textContent = c === " " ? "\u00a0" : c; $("wm").appendChild(s); wmChars.push(s); }));
        $("kicker").textContent = v.kicker;
