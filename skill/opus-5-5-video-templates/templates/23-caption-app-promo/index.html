  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="scene" class="clip layer" data-start="0" data-duration="15" data-track-index="0">
        <div id="bg" class="layer"><i class="g0"></i><i class="g1"></i><i class="g2"></i></div>
        <svg width="0" height="0" style="position: absolute">
          <filter id="fB" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="gB" stdDeviation="0 0" /></filter>
          <filter id="fA" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="gA" stdDeviation="0 0" /></filter>
          <filter id="fE0" x="-30%" y="-5%" width="160%" height="110%"><feGaussianBlur id="gE0" stdDeviation="0 0" /></filter>

        <!-- 1 · before / after -->

          <div id="cB" class="card">

    <script>
      (function () {

            cur.style.transform = "translate(" + px(cx) + "," + px(cy) + ") scale(" + cp.toFixed(3) + ")";
            // big wordmark over the cards
            const mk = P(t, T.mk0, T.mk1), mke = oc(mk);
            K.show(big, mk > 0);
            big.style.clipPath = "inset(0 " + ((1 - mke) * 100).toFixed(2) + "% 0 0)";
            big.style.opacity = (0.94 * C(mk * 2.2)).toFixed(3);
            big.style.transform = "scale(" + (1.05 - 0.05 * mke).toFixed(4) + ")";
            // whole scene blurs out into the next shot
            const out = P(t, T.toB - 0.16, T.toB);
            sA.style.filter = blurS(34 * out * out);
          }

          // ---------- 2 · style picker ----------
          if (inB) {
            const [cx, cy, s, r] = keyed([[T.toB, 838, 478, 1.92, 2.6], [5.1, 834, 466, 2.0, 0.6], [T.toC, 830, 458, 2.07, -1.0]], t);
            cam(camB, 1672, 941, cx, cy, s, r, 4 * Math.sin(t * 2.1), 3 * Math.sin(t * 1.7 + 1));
            const sc = oc(P(t, T.sc0, T.sc1)), settle = 6 * Math.sin(P(t, T.sc1 - 0.1, T.sc1 + 0.35) * Math.PI);
            gwrap.style.transform = "translateY(" + px(14 - 90 * sc + settle) + ")";
            const pk = P(t, T.pick, T.pick + 0.32), bump = Math.sin(Math.PI * P(t, T.pick, T.pick + 0.26));
            pring.style.opacity = C(pk * 3).toFixed(3);
            ptile.style.transform = "scale(" + (1 + 0.05 * bump + 0.02 * C(pk * 2)).toFixed(4) + ")";
            sB.style.filter = blurS(34 * Math.pow(1 - P(t, T.toB, T.toB + 0.22), 2) + 26 * Math.pow(P(t, T.toC - 0.12, T.toC), 2));
          }

          // ---------- 3 · the edit runs ----------
          if (inC) {
            const [cx, cy, s, r] = keyed([[T.toC, 1068, 452, 1.6, 1.6], [T.toD, 1084, 440, 1.7, -0.6]], t, (u) => u);
            const kick = 1 - oc(P(t, T.toC, T.toC + 0.25));
            cam(camC, 1672, 941, cx, cy, s * (1 + 0.04 * kick), r, 5 * Math.sin(t * 1.9), 4 * Math.sin(t * 1.4 + 2));
            sC.style.filter = blurS(26 * kick * kick);
            // phone: tracking scan, then captions, then b-roll, then music
            const scan = t < T.d[0];
            ed.trk.style.left = px(70 + 22 * Math.sin(t * 3.1) * (scan ? 1 : 0.15)); ed.trk.style.top = px(52 + 14 * Math.sin(t * 2.3 + 1) * (scan ? 1 : 0.15));
            ed.trk.style.width = "212px"; ed.trk.style.height = "300px";
            ed.trk.style.opacity = (scan ? 1 : 0.85).toFixed(2);
            const brollOn = t >= T.d[1] + 0.02;
            K.show(ed.main, !brollOn); K.show(ed.broll, brollOn); K.show(ed.trk, !brollOn);
            const bt = brollOn ? t - T.d[1] : t - T.toC;
            (brollOn ? ed.broll : ed.main).style.transform = "scale(" + (1.04 + 0.03 * C(bt / 2)).toFixed(4) + ")";
            // captions on the phone in the picked style
            const capLines = [capSets[0][0], capSets[0][1], capSets[1][0], capSets[1][1]], capT = [T.d[0], 7.42, T.d[1] + 0.05, 8.5];
            let li = -1; capT.forEach((ct, i) => { if (t >= ct) li = i; });
            K.show(ed.cap, li >= 0);
            if (li >= 0) { if (ed.cap.dataset.k !== String(li)) { ed.cap.dataset.k = String(li); ed.cap._w = words(ed.cap, capLines[li]); } pop(ed.cap._w, capT[li], 0.08, t); }
            const hi = Math.floor(C(P(t, T.toC, T.toD)) * (tsSpans.length - 1));
            tsSpans.forEach((s, i) => (s.style.color = i === hi ? "#fff" : ""));
            ed.ths.forEach((th, i) => { const on = brollOn && (i === 3 || i === 4), im = th.querySelector("img"), src = on ? IMG.grill : IMG.bbq; if (im.dataset.s !== src) { im.dataset.s = src; im.src = src; } th.querySelector(".hl").style.opacity = on ? "1" : "0"; });
            ed.ctrack.style.opacity = (0.85 * C(P(t, T.d[0] - 0.1, T.d[0] + 0.2))).toFixed(3);
            ed.ctrack.style.transform = "scaleX(" + oc(P(t, T.d[0] - 0.1, T.d[0] + 0.4)).toFixed(3) + ")"; ed.ctrack.style.transformOrigin = "0 50%";
            ed.wave.forEach((w, i) => { w.style.transform = "scaleY(" + E.outBack(P(t, T.d[2] - 0.2 + i * 0.008, T.d[2] + 0.1 + i * 0.008)).toFixed(3) + ")"; });
            // chips on the left
            const yOf = (k) => { let y = 870; if (t >= T.d[k]) y -= 160 * oc(P(t, T.d[k], T.d[k] + 0.26)); for (let j = k + 1; j < 3; j++) if (t >= T.d[j]) y -= 124 * oc(P(t, T.d[j], T.d[j] + 0.26)); if (t >= T.fin) y -= 40 * oc(P(t, T.fin, T.fin + 0.38)); return y; };
            chips.forEach((c, k) => {
              const ap = P(t, T.a[k], T.a[k] + 0.2), off = P(t, T.d[k], T.d[k] + 0.06), on = P(t, T.d[k] + 0.06, T.d[k] + 0.13);
              const y = yOf(k) + 40 * (1 - oc(ap));
              const sc = (0.9 + 0.1 * E.outBack(ap, 2)) * (1 + 0.06 * Math.sin(Math.PI * P(t, T.d[k], T.d[k] + 0.24)));
              [c.on, c.ok].forEach((el) => { K.show(el, ap > 0); el.style.transform = "translate(0," + px(y - 56) + ") scale(" + sc.toFixed(4) + ")"; el.style.transformOrigin = "0 50%"; });
              // swap the working chip for the finished one, no crossfade of the two labels
              c.on.style.opacity = (C(ap * 2) * (1 - off)).toFixed(3);
              c.ok.style.opacity = on.toFixed(3);
            });
            const fp = P(t, T.fin, T.fin + 0.3);
            K.show(doneChip, fp > 0);
            const okW = Math.max(...chips.map((c) => c.ok.offsetWidth)), dW = doneChip.offsetWidth;
            doneChip.style.left = px(196 + okW / 2 - dW / 2);
            doneChip.style.transform = "translate(0," + px(904 - 56 + 26 * (1 - oc(fp))) + ") scale(" + (0.85 + 0.15 * E.outBack(fp, 2.4)).toFixed(4) + ")";
            doneChip.style.opacity = C(fp * 2).toFixed(3);
            sC.style.filter = blurS(26 * kick * kick);
          }

          // ---------- 4 · finished edits on tables ----------
          if (inD) {
            let k = 0; for (let i = 0; i < 4; i++) if (t >= T.D[i]) k = i;
            camD.forEach((c, i) => K.show(c, i === k));
            const t0 = T.D[k], t1 = k < 3 ? T.D[k + 1] : T.toE, u = P(t, t0, t1), e = 0.4 * u + 0.6 * ioc(u);
            const a = DK[k][0], b = DK[k][1], kick = 1 - oc(P(t, t0, t0 + 0.16));
            cam(camD[k], 1280, 720, L(a[0], b[0], e), L(a[1], b[1], e), L(a[2], b[2], e) * (1 + 0.05 * kick), L(a[3], b[3], e), 3 * Math.sin(t * 2.3), 3 * Math.sin(t * 1.8));
            tbl[k].main.style.transform = "scale(" + (1.03 + 0.03 * u).toFixed(4) + ")";
            const out = k === 3 ? P(t, T.toE - 0.12, T.toE) : 0;
            sD.style.filter = blurS(10 * kick * kick + 30 * out * out);
          }

          // ---------- 5 · creator wall ----------
          if (inE && t < 13.0) {
            sE.style.filter = blurS(30 * Math.pow(1 - P(t, T.toE, T.toE + 0.3), 2));
            vcs.forEach((c, k) => {
              const s0 = T.toE + 0.02 + [0, 0.06, 0.2, 0.4][k], u = P(t, s0, s0 + 0.42), e = E.outExpo(u);
              const x = 20 + k * 480 + (1 - e) * (760 + k * 90);
              c.d.style.transform = "translateX(" + px(x - (20 + k * 480)) + ")";
              const vel = u > 0 && u < 1 ? (760 + k * 90) * 6.93 * Math.pow(2, -10 * u) / 0.42 : 0;
              mb(c.d, "fE" + k, "gE" + k, Math.min(40, vel * 0.0045));
              c.img.style.transform = "scale(" + (1.04 + 0.04 * P(t, T.toE, 12.9)).toFixed(4) + ") translateY(" + px(2 * Math.sin(t * 3 + k)) + ")";
              c.bar.style.width = (100 * C(0.18 + 0.35 * k / 3 + (t - T.toE) * 0.32)).toFixed(1) + "%";
              let cur = null; c.lines.forEach((ln) => { if (t >= ln.t0) cur = ln; });
              K.show(c.cap, !!cur);
              if (cur) {
                if (c.cap.dataset.k !== String(cur.ln)) { c.cap.dataset.k = String(cur.ln); c.cap.innerHTML = cur.html; c._w = [...c.cap.querySelectorAll(".ln, .sm, .bg, .hot")]; if (!c._w.length) c._w = [c.cap]; }
                const pu = P(t, cur.t0, cur.t0 + 0.2);
                c.cap.style.opacity = C(pu * 2).toFixed(3);
                c.cap.style.transform = "translateY(" + px(10 * (1 - oc(pu))) + ") scale(" + (0.92 + 0.08 * E.outBack(pu, 2)).toFixed(4) + ")";
              }
            });
            sE.style.opacity = (1 - P(t, 12.6, 13.0)).toFixed(3);
          }

          // ---------- 6 · lockup ----------
          const ia = P(t, T.ic0, T.ic0 + 0.4);
          K.show(endEl, ia > 0);
          if (ia > 0) {
            const mv = oc(P(t, 12.98, 13.36));
            const appear = E.outBack(ia, 1.9), wob = Math.exp(-3.2 * Math.max(0, t - T.ic0)) * (1 - mv);
            const scl = L(2.15, 1, mv) * appear;
            const x = L(960, lay.icx, mv), y = L(520, lay.icy, mv);
            endLg.style.transform = "translate(" + px(x - 66) + "," + px(y - 55) + ") scale(" + (scl * (1 + 0.08 * wob * Math.sin((t - T.ic0) * 17))).toFixed(4) + "," + (scl * (1 - 0.1 * wob * Math.sin((t - T.ic0) * 17 + 0.6))).toFixed(4) + ")";
            bars.forEach((b, i) => {
              const w = barW[i] * (1 + 0.28 * wob * Math.sin((t - T.ic0) * 14 + i * 1.9));
              b.setAttribute("width", w.toFixed(2)); b.setAttribute("x", (60 - w / 2).toFixed(2));
            });
            const wr = oc(P(t, 13.12, 13.6));
            endWm.style.filter = blurS(18 * (1 - wr));
            endWm.style.transform = "translateX(" + px(-36 * (1 - wr)) + ")";
            endWm.style.opacity = (0.12 * C(P(t, 13.0, 13.1)) + 0.88 * wr).toFixed(3);
            const rw = oc(P(t, 13.42, 13.8));
            endRow.style.opacity = rw.toFixed(3);
            endRow.style.transform = "translateY(" + px(18 * (1 - rw)) + ")";
          }
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lay = null; render(lastT); });
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
</html>
