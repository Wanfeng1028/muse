  <body>

        <div id="hud" class="layer">

          <div class="brk" style="left: 1880px; top: 22px; border-right-width: 1.5px; border-top-width: 1.5px"></div>

    <script>
      (function () {
        const v = K.vars();
        K.bind(v);
        const $ = K.$, E = K.E, P = K.prog, C = K.clamp, L = K.lerp, R = K.rnd;
        const DUR = 40, TAU = Math.PI * 2;
        const GREEN = v.green, BLUE = v.blue, PINK = v.pink, NAVY = v.navy;
        const HCOL = { g: GREEN, b: "#a9c6f6", p: "#f5b0dc" };
        const ioq = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const px = (n) => n.toFixed(1) + "px";
        const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        const blurS = (b) => (b > 0.25 ? "blur(" + b.toFixed(1) + "px)" : "none");
        const fade = (el, a) => { K.show(el, a > 0.002); el.style.opacity = C(a).toFixed(3); };
        const hexA = (h, a) => { const n = parseInt(String(h).replace("#", ""), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };
        const list = (s) => String(s).split(";").map((x) => x.trim()).filter(Boolean);
        const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
        const cv = document.createElement("canvas").getContext("2d");
        const textW = (s, font, ls) => { cv.font = font; return cv.measureText(s).width + (ls || 0) * [...s].length; };
        const blurIn = (w, t, a, d, dy, s0) => { const u = E.outCubic(P(t, a, a + (d || 0.3))); w.style.opacity = C(u * 1.4).toFixed(3); w.style.filter = blurS(14 * (1 - u)); w.style.transform = "translateY(" + px((dy || 0) * (1 - u)) + ") scale(" + L(s0 || 1.04, 1, u).toFixed(3) + ")"; return u; };
        // "{b:word}" -> blue span (for handwriting labels, as SVG tspans)
        const tspans = (s) => esc(s).replace(/\{b:(.*?)\}/g, '<tspan class="hb">$1</tspan>');
        // "[g:word]" -> highlight spans
        const PARA = [];
        String(v.para).replace(/\[(g|b|p):([^\]]+)\]|([^\[]+)/g, (m, c, hw, plain) => { if (c) PARA.push({ t: hw, c }); else plain.split(/(\s+)/).forEach((x) => { if (x) PARA.push({ t: x, c: null }); }); return m; });

        // ---------- mark ----------
        const MARK = (s) => '<svg viewBox="0 0 200 200" style="width:' + s + "px;height:" + s + 'px;display:block;overflow:visible"><path class="mk" d="M34 56 C 70 40, 110 64, 166 48" fill="none" stroke="' + GREEN + '" stroke-width="30" stroke-linecap="round" pathLength="1"/><path class="mk" d="M34 104 C 76 88, 118 116, 150 100" fill="none" stroke="' + BLUE + '" stroke-width="30" stroke-linecap="round" pathLength="1"/><path class="mk" d="M34 152 C 64 140, 92 160, 120 148" fill="none" stroke="' + PINK + '" stroke-width="30" stroke-linecap="round" pathLength="1"/></svg>';

        // ---------- illustration library (1600x900 artboards) ----------
        const S = 'stroke="#2b2d33" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"';
        const HAND = (x, y, s, txt, anchor, col) => '<text x="' + x + '" y="' + y + '" font-family="Patrick Hand" font-weight="400" font-size="' + s + '" fill="' + (col || "#2b2d33") + '" text-anchor="' + (anchor || "middle") + '">' + esc(txt) + "</text>";
        const SUN = (x, y, r) => { let s = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#ffd23f" ' + S + "/>"; for (let k = 0; k < 8; k++) { const a = (k / 8) * TAU; s += '<path d="M' + (x + Math.cos(a) * (r + 22)) + " " + (y + Math.sin(a) * (r + 22)) + "L" + (x + Math.cos(a) * (r + 50)) + " " + (y + Math.sin(a) * (r + 50)) + '" ' + S + "/>"; } return s; };
        const ILL = {
          photo: (title) => '<rect width="1600" height="900" fill="#fffdf4"/>' + HAND(800, 110, 84, title || "Photosynthesis") + SUN(250, 250, 90) +
            '<path d="M800 760 C 560 700, 520 420, 820 300 C 1060 420, 1060 700, 800 760z" fill="#8fd67a" ' + S + '/><path d="M800 760 C 790 600, 800 470, 820 320M800 640 L 720 560M805 540 L 900 470M803 460 L 740 410" fill="none" ' + S + "/>" +
            '<path d="M380 330 C 470 360, 520 400, 560 450" fill="none" stroke="#e8a33d" stroke-width="10" stroke-dasharray="4 22" stroke-linecap="round"/>' +
            '<circle cx="330" cy="620" r="78" fill="#e9ecf2" ' + S + '/><text x="330" y="642" font-family="Inter" font-weight="800" font-size="52" text-anchor="middle" fill="#2b2d33">CO₂</text><path d="M420 620 L 560 600" fill="none" ' + S + '/><path d="M540 580 L 566 600 540 622" fill="none" ' + S + "/>" +
            '<circle cx="1280" cy="420" r="78" fill="#dff2ff" ' + S + '/><text x="1280" y="442" font-family="Inter" font-weight="800" font-size="52" text-anchor="middle" fill="#2b2d33">O₂</text><path d="M1060 470 L 1190 440" fill="none" ' + S + '/><path d="M1170 420 L 1196 440 1170 462" fill="none" ' + S + "/>" +
            '<path d="M1180 700 c 0 -40, 40 -80, 40 -110 c 0 30, 40 70, 40 110 a 40 40 0 0 1 -80 0z" fill="#7fb6f2" ' + S + '/><rect x="1330" y="640" width="110" height="110" rx="16" fill="#fff" ' + S + "/>" +

          $("langCnt").innerHTML = "<b>" + String(ci + 1).padStart(2, "0") + "</b>/ " + LANGS.length + " " + esc(v.langWord);
          $("langCnt").style.opacity = cu.toFixed(3); $("langCnt").style.transform = "translateY(" + px(14 * (1 - cu)) + ")";
          hl.style.opacity = (1 - P(t, 26.55, 26.72)).toFixed(3);
        }

        // ================= I: the orb, then a carousel of styles =================
        const STY = list(v.styles);
        const CAR = [];
        for (let k = 0; k < 13; k++) { const el = mk("div", "thumb", $("carousel"), art(ILLK[(k * 5) % ILLK.length])); el.style.width = "760px"; el.style.height = "428px"; CAR.push(el); }
        const MBF = {};
        const mblur = (el, key, sx, sy) => {
          if (sx < 0.3 && sy < 0.3) { el.style.filter = "none"; return; }
          let g = MBF[key];
          if (!g) { const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter"); f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-30%"); f.setAttribute("y", "-30%"); f.setAttribute("width", "160%"); f.setAttribute("height", "160%"); g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g); let defs = document.getElementById("mbDefs"); if (!defs) { const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute"; defs = document.createElementNS(ns, "defs"); defs.id = "mbDefs"; svg.appendChild(defs); document.body.appendChild(svg); } defs.appendChild(f); MBF[key] = g; }
          g.setAttribute("stdDeviation", sx.toFixed(1) + " " + sy.toFixed(1));
          el.style.filter = "url(#mb_" + key + ")";
        };
        function sceneI(t) {
          const on = t >= 26.5 && t < 28.4;
          K.show($("iL"), on);
          if (!on) return;
          $("iL").style.opacity = P(t, 26.5, 26.62).toFixed(3);
          // orb and ring are drawn on the fx canvas
          const cu = E.outCubic(P(t, 26.9, 27.3));
          // a ring of cards seen from inside: the edges are closer than the middle
          const spin = (t - 27.0) * 1.15 - 1.6 * E.outCubic(P(t, 26.9, 27.6)), vel = 1.15 + 1.6 * 2.6 * (1 - P(t, 26.9, 27.6));
          CAR.forEach((el, k) => {
            let a = (k - 6) * 0.56 - spin;
            a = ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
            const R0 = 1500, D = 1000;
            const x = Math.sin(a) * R0, z = -Math.cos(a) * R0 + D;
            el.style.transform = "translate3d(" + px(960 - 380 + x) + "," + px(540 - 214 + 30) + "," + px(z - 400 * (1 - cu)) + ") rotateY(" + ((-a * 180) / Math.PI).toFixed(2) + "deg)";
            el.style.opacity = (cu * C(2.2 - Math.abs(a) * 1.6)).toFixed(3);
            mblur(el, "c" + k, 2 + 5 * vel, 1);
          });
          const si = t >= 27.9 ? 2 : t >= 27.5 ? 1 : 0;
          $("styleTag").querySelector("span").textContent = STY[si] || "";
          $("styleTag").style.opacity = P(t, 27.1, 27.3).toFixed(3);
          $("iL").style.filter = blurS(12 * P(t, 28.25, 28.4));
        }

        // ================= J: examples and the vertical crop =================
        $("exA").innerHTML = '<div class="thumb" style="left:0;top:0;width:1920px;height:1080px;border-radius:0;box-shadow:none">' + art("photo", v.ex1) + "</div>";
        $("exB").innerHTML = '<div class="thumb" style="left:0;top:0;width:1920px;height:1080px;border-radius:0;box-shadow:none">' + art("sky", v.ex2) + "</div>";
        $("vcard").innerHTML = '<div id="vIn" style="position:absolute;left:0;top:0;width:1920px;height:1080px">' + art("sky", v.ex2) + "</div>";
        $("ratio").textContent = v.ratio;
        function sceneJ(t) {
          const on = t >= 28.3 && t < 31.75;
          K.show($("jL"), on);
          if (!on) return;
          const ain = E.outCubic(P(t, 28.3, 28.55));
          const jt = $("jTag"); jt.querySelector("span").textContent = STY[t < 28.95 ? 2 : 1] || ""; jt.style.opacity = (P(t, 28.4, 28.55) * (1 - P(t, 30.1, 30.25))).toFixed(3);
          $("exA").style.opacity = ain.toFixed(3); $("exA").style.transform = "scale(" + L(1.08, 1, ain).toFixed(3) + ")";
          // page flip to the second example
          const fl = ioq(P(t, 28.95, 29.45));
          $("exA").style.transform += " perspective(2000px) rotateY(" + (-95 * fl).toFixed(1) + "deg)"; $("exA").style.transformOrigin = "0 50%";
          K.show($("exA"), fl < 0.99);
          const bin = P(t, 28.95, 29.3);
          $("exB").style.opacity = bin.toFixed(3);
          // vertical crop
          const vc = ioq(P(t, 30.15, 30.45));
          $("exDim").style.opacity = (0.9 * vc).toFixed(3);
          const card = $("vcard");
          fade(card, vc > 0 ? 1 : 0);
          const pan = t < 30.8 ? 0 : t < 31.2 ? ioq(P(t, 30.8, 31.05)) : 1 - ioq(P(t, 31.2, 31.45)) * 2;
          const cw = L(1920, 608, vc), ch = L(1080, 1040, vc);
          const cx = 960 - cw / 2 + pan * 520 * vc, cy = 540 - ch / 2;
          card.style.left = px(cx); card.style.top = px(cy); card.style.width = px(cw); card.style.height = px(ch);
          card.style.borderRadius = px(22 * vc);
          // the card is a window onto the picture behind it
          $("vIn").style.transform = "translate(" + px(-cx) + "," + px(-cy) + ")";
          const ru = E.outBack(P(t, 30.3, 30.55), 1.8), ro = $("ratio");
          fade(ro, C(ru * 2) * (1 - P(t, 31.45, 31.6))); ro.style.transform = "scale(" + C(ru, 0, 1.15).toFixed(3) + ")"; ro.style.transformOrigin = "0 100%";
          const shrink = ioq(P(t, 31.45, 31.72));
          $("jL").style.transform = "scale(" + L(1, 0.28, shrink).toFixed(3) + ")"; $("jL").style.transformOrigin = "960px 540px";
          $("jL").style.opacity = (1 - P(t, 31.6, 31.75)).toFixed(3);
          $("exB").style.opacity = (bin * (1 - shrink)).toFixed(3);
        }

        // ================= K: the grid =================
        const GR = [];
        for (let k = 0; k < 16; k++) { const el = mk("div", "thumb", $("grid"), art(ILLK[(k * 7 + 2) % ILLK.length])); el.style.width = "400px"; el.style.height = "225px"; GR.push({ el, c: k % 4, r: Math.floor(k / 4) }); }
        $("gridCap").innerHTML = '<div><span>' + esc(v.gridA) + '</span> <span style="color:#b8c1d9">' + esc(v.gridB) + "</span> <span>" + esc(v.gridC) + "</span></div>";
        const gcW = [...$("gridCap").querySelectorAll("span")];
        function sceneK(t) {
          const on = t >= 31.55 && t < 33.75;
          K.show($("kL"), on);
          if (!on) return;
          $("kL").style.opacity = P(t, 31.55, 31.7).toFixed(3);
          const flat = ioq(P(t, 31.7, 32.3));
          $("grid").style.transform = "rotateX(" + L(38, 0, flat).toFixed(2) + "deg) rotateZ(" + L(-10, 0, flat).toFixed(2) + "deg) scale(" + L(0.8, 1, flat).toFixed(3) + ")";
          $("grid").style.transformOrigin = "960px 540px";
          const sh = ioq(P(t, 33.35, 33.7));
          GR.forEach((g) => {
            const x = 960 + (g.c - 1.5) * 420, y = 540 + (g.r - 1.5) * 245, u = E.outCubic(P(t, 31.6 + (g.c + g.r) * 0.04, 31.95 + (g.c + g.r) * 0.04));
            const s = L(1, 0.12, sh);
            g.el.style.transform = "translate(" + px(x - 200) + "," + px(y - 112) + ") scale(" + (L(0.85, 1, u) * s).toFixed(3) + ")";
            g.el.style.opacity = u.toFixed(3);
          });
          gcW.forEach((w, k) => blurIn(w, t, 32.3 + k * 0.1, 0.3, 16, 1.05));
          const gb = $("gridCap").firstChild, gbu = E.outCubic(P(t, 32.25, 32.45)); gb.style.opacity = gbu.toFixed(3); gb.style.transform = "scale(" + L(0.94, 1, gbu).toFixed(3) + ")";
          $("gridCap").style.opacity = (1 - P(t, 33.3, 33.45)).toFixed(3);
        }

        // ================= L: dots, the counter, the mark =================
        const dots = $("dots").getContext("2d");
        const NV = parseInt(String(v.videos).replace(/\D/g, ""), 10) || 2400;
        function sceneL(t) {
          const on = t >= 33.6 && t < 36.6;
          K.show($("lL"), on);
          if (!on) return;
          const g = dots;
          g.clearRect(0, 0, 1920, 1080);
          const cols = 64, rows = 32, grow = E.outCubic(P(t, 33.7, 34.3)), scatter = P(t, 35.3, 35.75), swirl = P(t, 35.7, 36.45);
          if (!mW) { const ml = $("mL"), pv = ml.style.display; ml.style.display = ""; mW = $("mLock").offsetWidth; rW = $("mRow").offsetWidth; ml.style.display = pv; }
          const mx0 = 960 - mW / 2, my0 = 330 + (270 - MS) / 2, ms = MS / 200;
          const ROWY = [56, 104, 152], ENDX = [166, 150, 120];
          for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
            const k = j * cols + i;
            let x = 90 + i * 27.6, y = 105 + j * 27.6;
            // early: dots gathered into 16 clusters (the thumbnails)
            const cl = (Math.floor(i / 16) + Math.floor(j / 8) * 4), cx = 960 + ((cl % 4) - 1.5) * 420, cy = 540 + (Math.floor(cl / 4) - 1.5) * 245;
            x = L(cx + ((i % 16) - 7.5) * 3, x, grow); y = L(cy + ((j % 8) - 3.5) * 3, y, grow);
            // bulge towards the viewer around the middle
            const dx = x - 960, dy = y - 540, d = Math.hypot(dx / 960, dy / 540);
            const bul = 0.3 * bump(t, 33.8, 34.6);
            x += dx * bul * (1 - d); y += dy * bul * (1 - d);
            if (scatter > 0) { x += (R(k * 1.3) - 0.5) * 70 * scatter; y += (R(k * 2.9) - 0.5) * 70 * scatter; }
            const behind = (1 - C((Math.abs(dx) - 420) / 120)) * (1 - C((Math.abs(dy) - 170) / 80)) * (1 - P(t, 35.0, 35.3));
            let col = "rgba(230,236,255,", a = L(0.55, 0.9, grow) * (1 - 0.65 * behind * P(t, 33.8, 33.95));
            if (swirl > 0) {
              // each dot streams into one of the mark's three strokes
              const bar = k % 3, f = R(k * 4.4), tx = mx0 + (34 + (ENDX[bar] - 34) * f) * ms, ty = my0 + (ROWY[bar] + Math.sin(f * 3.4 + bar) * 7 + (R(k * 6.1) - 0.5) * 26) * ms;
              const u = ioq(P(swirl, 0.25 * R(k * 9.3) + 0.35 * C((x - 300) / 1600), 0.4 + 0.25 * R(k * 9.3) + 0.35 * C((x - 300) / 1600)));
              const px0 = x, py0 = y;
              x = L(px0, tx, u); y = L(py0, ty, u) - 60 * Math.sin(Math.PI * u) * (R(k * 7.1) - 0.5);
              col = bar === 0 ? hexA(GREEN, "").slice(0, -1) : bar === 1 ? hexA("#7fa6f5", "").slice(0, -1) : hexA(PINK, "").slice(0, -1);
              a = L(a, 0.95, u);
              if (u > 0.02 && u < 0.98) { const vx = tx - px0, vy = ty - py0, sp = Math.sin(Math.PI * u) * 0.06; g.strokeStyle = col + (a * 0.6).toFixed(3) + ")"; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x - vx * sp, y - vy * sp); g.stroke(); }
            }
            g.fillStyle = col + a.toFixed(3) + ")"; g.fillRect(x - 2.2, y - 2.2, 4.4, 4.4);
          }
          const cu = P(t, 33.75, 33.92), rollU = E.outCubic(P(t, 33.9, 34.6));
          const n = Math.round(NV * L(0.55, 1, rollU));
          $("cnt").innerHTML = n.toLocaleString("en-US") + "<b>+</b>";
          $("cnt").style.opacity = (cu * (1 - P(t, 35.05, 35.35))).toFixed(3); $("cnt").style.filter = blurS(10 * (1 - cu) + 12 * P(t, 35.05, 35.35));
          $("cntSub").innerHTML = esc(v.videosWord) + (t >= 34.7 ? ' <span style="opacity:' + P(t, 34.7, 34.9).toFixed(2) + '">' + esc(v.creators) + "</span>" : "");
          $("cntSub").style.opacity = (P(t, 33.85, 34.05) * (1 - P(t, 35.05, 35.35))).toFixed(3);
          $("lL").style.opacity = (1 - P(t, 36.4, 36.58)).toFixed(3);
        }

        // ================= M: end card =================
        const MS = 270;
        $("mMark").innerHTML = MARK(MS);
        $("mWm").textContent = v.brand; $("mLine").textContent = v.endLine; $("mBtn").textContent = v.cta; $("mDom").textContent = v.domain;
        let mW = 0, rW = 0;
        function sceneM(t) {
          const on = t >= 36.5;
          K.show($("mL"), on);
          if (!on) return;
          if (!mW) { mW = $("mLock").offsetWidth; rW = $("mRow").offsetWidth; }
          $("mLock").style.left = px(960 - mW / 2); $("mRow").style.left = px(960 - rW / 2);
          const lu = E.outCubic(P(t, 36.5, 36.9));
          $("mLock").style.opacity = lu.toFixed(3); $("mLock").style.transform = "scale(" + L(1.06, 1, lu).toFixed(3) + ")";
          $("mMark").querySelectorAll(".mk").forEach((p) => K.draw(p, 1));
          const tu = E.outCubic(P(t, 37.2, 37.55)); $("mLine").style.opacity = tu.toFixed(3); $("mLine").style.transform = "translateY(" + px(12 * (1 - tu)) + ")";
          const bu = E.outBack(P(t, 38.9, 39.2), 1.8); $("mRow").style.opacity = C(bu * 2).toFixed(3); $("mRow").style.transform = "scale(" + C(bu, 0, 1.12).toFixed(3) + ")";
        }

        // ================= fx: the orb =================
        const fx = mk("canvas", "layer", $("scene")); fx.width = 1920; fx.height = 1080; fx.style.pointerEvents = "none";
        $("scene").insertBefore(fx, $("hud"));
        const fxc = fx.getContext("2d");
        function drawFx(t) {
          fxc.clearRect(0, 0, 1920, 1080);
          const oa = t >= 26.45 && t < 27.15 ? bump(t, 26.45, 27.15) : 0;
          if (oa > 0) {
            const r = L(80, 520, E.outCubic(P(t, 26.45, 27.0)));
            const g = fxc.createRadialGradient(960, 520, 0, 960, 520, r); g.addColorStop(0, "rgba(210,225,255," + (0.95 * oa).toFixed(3) + ")"); g.addColorStop(0.35, "rgba(90,130,230," + (0.55 * oa).toFixed(3) + ")"); g.addColorStop(1, "rgba(40,60,140,0)");
            fxc.fillStyle = g; fxc.fillRect(0, 0, 1920, 1080);
            fxc.strokeStyle = "rgba(160,190,255," + (0.35 * oa).toFixed(3) + ")"; fxc.lineWidth = 2;
            [1.1, 1.5].forEach((m) => { fxc.beginPath(); fxc.arc(960, 520, r * m, 0, TAU); fxc.stroke(); });
          }
          // a white flash from the logo to the paragraph
          const fl = bump(t, 8.18, 8.36);
          if (fl > 0) { fxc.fillStyle = "rgba(255,255,255," + fl.toFixed(3) + ")"; fxc.fillRect(0, 0, 1920, 1080); }
        }

        // ================= HUD =================
        $("hTL").innerHTML = '<span style="font-weight:600;letter-spacing:0.16em">' + esc(v.brand.toUpperCase()) + "</span>&nbsp;&nbsp;" + esc(v.reel.toUpperCase());
        function hud(t) {
          const dark = (t >= 6.5 && t < 8.26) || (t >= 21.75 && t < 36.5);
          const col = dark ? "rgba(170,182,215,0.75)" : "rgba(60,68,90,0.7)";
          $("hud").style.color = col;
          ["hTL", "hTR", "hBR"].forEach((id) => { $(id).style.color = col; });
          const bar = 1 + (Math.floor(t * 2.4) % 24);
          $("hTR").innerHTML = '<span style="display:inline-flex;gap:3px;vertical-align:-2px;margin-right:10px"><i style="width:4px;height:14px;background:' + GREEN + '"></i><i style="width:4px;height:14px;background:' + BLUE + '"></i><i style="width:4px;height:14px;background:' + PINK + '"></i></span>BAR ' + String(bar).padStart(2, "0") + "/24&nbsp;&nbsp;144 BPM";
          const f = Math.floor(t * 30), ss = Math.floor(f / 30), ff = f % 30;
          $("hBR").textContent = "FRAME 00:00:" + String(ss).padStart(2, "0") + ":" + String(ff).padStart(2, "0");
        }

        function render(t) {
          drawBg(t);
          sceneA(t);
          sceneB(t);
          sceneC(t);
          sceneD(t);
          sceneEFG(t);
          sceneH(t);
          sceneI(t);
          sceneJ(t);
          sceneK(t);
          sceneL(t);
          sceneM(t);
          drawFx(t);
          hud(t);
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lockW = 0; chPos = null; mW = 0; render(lastT); });
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
