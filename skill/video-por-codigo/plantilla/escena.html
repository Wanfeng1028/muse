<!doctype html>
<!--
  Scene contract (the only fixed part — everything else is up to you):
  - window.DURACION = seconds of video.
  - window.render(t) paints the exact frame at second t. Deterministic: no Math.random()
    without seed, no Date, no setTimeout, no CSS transitions/animations. Everything comes from t.
  - Size: 1920x1080 (horizontal) or 1080x1920 (vertical). Change W/H below.
  - window.VOZ comes from ../voz.js (generated by voz.py). Optional.
  - window.LISTO: a Promise the renderer awaits before frame 0 (fonts, images).
  Opened directly in a browser, it plays in real time (click to start, with voice).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>escena</title>
<script src="../voz.js"></script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080;           // vertical: 1080, 1920
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

const VOZ = window.VOZ || null;
window.DURACION = VOZ ? VOZ.duracion + 1.5 : 30;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const ease = {
  outExpo: k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  inOutCubic: k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outBack: k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2),
};
// 0→1 progress between second a and b, with easing.
const progreso = (t, a, b, fn = ease.outExpo) => fn(clamp((t - a) / (b - a)));

// Seeded random: const r = aleatorio(7); r() → same sequence every time.
function aleatorio(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

const normal = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9ñ]/g, '');
// Second when the voice says `texto` (n-th time). palabra('millones') or palabra('crecimos', 2).
function palabra(texto, n = 1) {
  if (!VOZ) return null;
  const target = normal(texto);
  const hits = VOZ.palabras.filter(w => normal(w.texto) === target);
  if (!hits[n - 1]) { console.warn('no se dice:', texto, n); return null; }
  return hits[n - 1].inicio;
}
// {inicio, fin} of a section of the script: seccion('s2').
const seccion = id => (VOZ && VOZ.secciones.find(s => s.id === id)) || null;
// Subtitle chunk being said at t (up to maxPalabras words), or ''.
function frase(t, maxPalabras = 8) {
  if (!VOZ) return '';
  const ws = VOZ.palabras;
  const i = ws.findIndex(w => w.inicio <= t && t < w.fin + 0.6);
  if (i < 0) return '';
  const start = Math.floor(i / maxPalabras) * maxPalabras;
  return ws.slice(start, start + maxPalabras).map(w => w.texto).join(' ');
}

// Preload fonts/images here; the renderer waits for it.
window.LISTO = Promise.all([
  // document.fonts.load('700 120px "Inter"'),
  // new Promise(r => { const img = new Image(); img.onload = r; img.src = '../logo.png'; logo = img; }),
]);

// ---------- the scene ----------
window.render = function (t) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#eee';
  ctx.font = '48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('escena vacía · t = ' + t.toFixed(2) + ' s', W / 2, H / 2);
  ctx.font = '36px sans-serif';
  ctx.fillText(frase(t), W / 2, H - 120);
};

// ---------- live preview when opened in a browser (not used by render.py) ----------
if (!location.search.includes('render=1')) {
  const fit = () => {
    const k = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
  };
  addEventListener('resize', fit); fit();
  let t0 = null;
  const audio = new Audio('../voz.wav');
  window.LISTO.then(() => window.render(0));
  cv.addEventListener('click', () => {
    t0 = performance.now(); audio.currentTime = 0; audio.play().catch(() => {});
    const loop = () => {
      const t = (performance.now() - t0) / 1000;
      if (t > window.DURACION) return;
      window.render(t); requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
</body>
</html>
