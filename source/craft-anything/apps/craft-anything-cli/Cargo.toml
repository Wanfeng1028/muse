[package]
name = "craft-anything-cli"
description = "Craft Anything on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-anything-engine = { workspace = true }
craft-anything-engines = { workspace = true }
craft-anything-evidence = { workspace = true }
craft-anything-platform = { workspace = true }
craft-anything-mcp = { workspace = true }
craft-anything-ai = { workspace = true }
craft-anything-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["craft-anything-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for craft-anything-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
