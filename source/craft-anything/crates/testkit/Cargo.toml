[package]
name = "craft-anything-testkit"
description = "Test helpers and synthetic sample builders for Craft Anything"
version.workspace = true
edition.workspace = true
license.workspace = true

publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
miniz_oxide = { workspace = true }
# In-test signing: generate keys and produce real signatures for signature-verification fixtures.
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "sha256", "pem"] }
sha2 = "0.10"
sha1 = "0.10"
rand = "0.8"
