contract_version: "2.0"
contracts:
  A:
    caller: acheng-director
    target: cinematic-vfx-prompt-engine
    modes: [CREATE, OPTIMIZE, REINFORCE, PERSONALIZE]
    required_inputs: [request_id, input_revision, shot_id, mode, locked_action, locked_result]
    allowed_write_paths: [vfx]
    frozen_in_optimize: [origin, collision_type, collision, phases]
    reject: [stale_revision, unknown_shot, unauthorized_field, changed_outcome]
  B:
    caller: acheng-director
    target: h3-prompt-writing
    modes: [T2VA, I2VA, FL2VA, L2VA, Ref2VA]
    required_inputs: [request_id, input_revision, segment_id, mode, shot_ids, references, sound_policy]
    allowed_write_paths: [alignment_line, ordered_sections, reference_map, execution_gate]
    reject: [missing_reference, duration_mismatch, unresolved_label, altered_dialogue, unexpanded_code, missing_standalone_context]
  C:
    caller: acheng-director
    target: im2-clean-image
    source_repository: im2-image-skills
    modes: [GENERATE, EDIT, REBUILD, MIXED]
    required_inputs: [request_id, input_revision, asset_id, source_roles, structure_lock, medium]
    allowed_write_paths: [image_transaction, seven_steps, recipe, prompt, avoid, reference_policy, references, actual_generation_settings, acceptance]
    reject: [changed_identity, changed_topology_without_rebuild, negative_contamination, unexpanded_code, missing_reference, missing_final_prompt]
response:
  required_fields: [request_id, input_revision, status, patch, evidence, unresolved]
  statuses: [READY, NEEDS_DIRECTOR_REVISION, EXECUTION_BLOCKED]
  recursion_allowed: false
  owner: acheng-director
