<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Long-form film</title>
<style>
  html, body { margin: 0; padding: 0; }
  #stage { position: relative; overflow: hidden; }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg"><defs></defs><g id="world"></g><g id="top"></g></svg>
<div id="caps"></div>
</div>
<script src="kit.js"></script>
<script src="figure.js"></script>
<script src="timeline.js"></script>
<script>
// Long-form engine: a narrated film is a list of segments (timeline.js, written by longform.py from the
// script and the measured narration). Each segment has a scene type; every style is a pure function of t.
const TL = window.TIMELINE;
K.setup({ format: "16x9", bpm: 60, bars: Math.ceil(TL.duration / 4), title: TL.title,
          palette: TL.palette || {} });
K.DUR = TL.duration; window.STUDIO.duration = TL.duration;
const C = K.C, W = K.W, H = K.H;
const SEGS = TL.segments;
const FONT = "Georgia, serif", SANS = "Helvetica Neue, Helvetica, Arial, sans-serif";

// chapters show in the preview timeline
(TL.chapters || []).forEach(ch => window.STUDIO.scenes.push({ name: ch.title, from: ch.t0, to: ch.t1 }));

// ── layers ───────────────────────────────────────────────
const bgG = K.group("bg");
const dots = [];
{ const r = K.rng(11);
  for (let i = 0; i < 70; i++) dots.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.2, v: 4 + r() * 10, el: K.el("circle", { fill: "#2a2a28" }, bgG) }); }
const sceneG = K.group("scenes");
const overlayG = K.group("overlay");   // per-segment text that must not move with a scene's camera (s.ov)
const footG = K.group("foot");
const sourceT = K.text("", { "font-family": SANS, "font-size": 20, fill: C.GREY, x: 60, y: H - 36 }, footG);
const chapterT = K.text("", { "font-family": SANS, "font-size": 20, fill: C.GREY, x: W - 60, y: 52, "text-anchor": "end", "letter-spacing": 3 }, footG);

// ── helpers ──────────────────────────────────────────────
const clipN = { n: 0 };
function maskText(str, attrs, parent) {           // text that rises out of its own mask line
  const id = "m" + (clipN.n++);
  const clip = K.clipRect(id);
  const g = K.el("g", { "clip-path": `url(#${id})` }, parent);
  const t = K.text(str, Object.assign({ "font-family": FONT }, attrs), g);
  return { g, t, clip, size: +attrs["font-size"] || 40 };
}
function placeMask(m, x, y, p, anchor) {          // p: 0 hidden below line → 1 risen
  const s = m.size;
  K.set(m.clip, { x: -50, y: y - s * 1.05, width: W + 100, height: s * 1.35 });
  K.set(m.t, { x, y: y + (1 - p) * s * 1.3, "text-anchor": anchor || "middle" });
}
function wrapWords(str, maxChars) {
  const words = String(str).split(/\s+/), lines = [];
  let cur = "";
  words.forEach(w => { if ((cur + " " + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
  if (cur) lines.push(cur);
  return lines;
}
// data items may be plain strings or {text, at}; an item with "at" was timed to its word by longform.py (item.t)
function txt(x) { return typeof x === "string" ? x : (x && x.text) || ""; }
function cueT(x, fallback) { return x && typeof x === "object" && x.t != null ? x.t - 0.05 : fallback; }
// the word clock for hand-built scenes: when is `phrase` said in segment s (nth occurrence)?
function said(s, phrase, nth = 1) {
  const norm = w => w.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9']/g, "");
  const want = phrase.split(/\s+/).map(norm), ws = s.words || [];
  let hits = 0;
  for (let i = 0; i + want.length <= ws.length; i++)
    if (want.every((w, k) => norm(ws[i + k][0]) === w || (k === want.length - 1 && norm(ws[i + k][0]).startsWith(w))) && ++hits === nth) return ws[i][1];
  window.STUDIO.warnings.push(`said(): "${phrase}" not found in ${s.id}`);
  return s.t0 + 0.5;
}
// camera keys from event times: sorted, at least `gap` s apart, so the camera never jumps between two keys at once
function camKeys(t0, v0, evs, gap = 0.8) {
  const keys = [[t0, v0]];
  evs.slice().sort((a, b) => a[0] - b[0]).forEach(([t, v]) => {
    const last = keys[keys.length - 1];
    if (t < last[0] + gap) { if (t <= last[0] + 1e-6 && keys.length > 1) { last[1] = v; return; } t = last[0] + gap; }
    keys.push([t, v]);
  });
  return keys;
}
function fmtNum(v, dec) { return v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
// enter/leave envelope for a segment: in over 0.45 s, out over 0.3 s (a push, not a fade)
function env(t, s) { return { i: K.eout(K.prog(t, s.t0, s.t0 + 0.45)), o: K.ein(K.prog(t, s.t1 - 0.3, s.t1)), p: K.prog(t, s.t0, s.t1) }; }
// stagger: item k of n reveals across the first `span` of the segment
function revealAt(s, k, n, span = 0.7, lead = 0.35) { return s.t0 + lead + (s.t1 - s.t0 - lead) * span * (n <= 1 ? 0 : k / (n - 1)); }

// ── scene builders: build(seg, group) returns render(t) ──
const B = {};

B.chapter = (s, g) => {
  const num = maskText(s.data.kicker || "", { "font-family": SANS, "font-size": 30, fill: C.ACCENT, "letter-spacing": 6 }, g);
  const lines = wrapWords(s.data.title, 26).map(l => maskText(l, { "font-size": 92, fill: C.INK }, g));
  const rule = K.el("rect", { fill: C.ACCENT }, g);
  K.label(s.data.title, s.t0, s.t1, "chapter card");
  return t => {
    const e = env(t, s), y0 = H / 2 - (lines.length - 1) * 55;
    placeMask(num, W / 2, y0 - 110, K.eout(K.prog(t, s.t0, s.t0 + 0.4)) * (1 - e.o));
    lines.forEach((m, k) => placeMask(m, W / 2, y0 + k * 110, K.eout(K.prog(t, s.t0 + 0.12 + k * 0.1, s.t0 + 0.55 + k * 0.1)) * (1 - e.o)));
    const rw = 220 * K.eio(K.prog(t, s.t0 + 0.2, s.t0 + 0.9)) * (1 - e.o);
    K.set(rule, K.rect(W / 2 - rw / 2, y0 + lines.length * 110 - 50, rw, 5, 2));
  };
};

B.statement = (s, g) => {
  const items = (s.data.lines || wrapWords(s.data.text, 30)), lines = items.map(txt);
  const acc = s.data.accent || [];
  const ms = lines.map((l, k) => maskText(l, { "font-size": s.data.size || 76, fill: acc.includes(k) ? C.ACCENT : C.INK }, g));
  ms.forEach(m => K.label(m.t.textContent, s.t0, s.t1, "statement"));
  const lh = (s.data.size || 76) * 1.3;
  return t => {
    const e = env(t, s), y0 = H * 0.46 - (lines.length - 1) * lh / 2;
    ms.forEach((m, k) => {
      const tk = cueT(items[k], revealAt(s, k, lines.length, s.data.span || 0.45, 0.1));
      placeMask(m, W / 2, y0 + k * lh, K.eout(K.prog(t, tk, tk + 0.35)) * (1 - e.o));
    });
  };
};

B.compare = (s, g) => {
  const L = s.data.left, R = s.data.right;
  const hl = maskText(L.title, { "font-family": SANS, "font-size": 30, fill: C.GREY, "letter-spacing": 4 }, g);
  const hr = maskText(R.title, { "font-family": SANS, "font-size": 30, fill: C.ACCENT, "letter-spacing": 4 }, g);
  const li = L.items.map(x => maskText(txt(x), { "font-size": 44, fill: C.GREY }, g));
  const ri = R.items.map(x => maskText(txt(x), { "font-size": 44, fill: C.INK }, g));
  const div = K.el("rect", { fill: "#2c2c2a" }, g);
  const strikes = L.items.map(() => K.el("rect", { fill: C.ACCENT }, g));
  [L.title, R.title, ...L.items, ...R.items].forEach(x => K.label(txt(x), s.t0, s.t1, "two columns"));
  return t => {
    const e = env(t, s), o = 1 - e.o, xl = W * 0.27, xr = W * 0.73, y0 = 300;
    placeMask(hl, xl, y0, e.i * o); placeMask(hr, xr, y0, K.eout(K.prog(t, s.t0 + 0.2, s.t0 + 0.6)) * o);
    const dh = (H - 380) * K.eio(K.prog(t, s.t0, s.t0 + 0.8)) * o;
    K.set(div, K.rect(W / 2 - 1, 230, 2, dh));
    const n = Math.max(li.length, ri.length);
    li.forEach((m, k) => { const tk = cueT(L.items[k], revealAt(s, k, n, 0.35, 0.3)); placeMask(m, xl, y0 + 110 + k * 90, K.eout(K.prog(t, tk, tk + 0.35)) * o); });
    ri.forEach((m, k) => {
      const tk = cueT(R.items[k], revealAt(s, k, n, 0.5, 0.3) + (s.t1 - s.t0) * 0.35);
      placeMask(m, xr, y0 + 110 + k * 90, K.eout(K.prog(t, tk, tk + 0.35)) * o);
      const sl = strikes[k];
      if (sl) { const bb = li[k].t.getComputedTextLength(), sw = bb * K.eio(K.prog(t, tk - 0.2, tk + 0.2)) * o;
        K.set(sl, K.rect(xl - bb / 2, y0 + 110 + k * 90 - 15, sw, 4)); }
    });
  };
};

B.stat = (s, g) => {
  const d = s.data;
  const big = maskText("", { "font-size": 200, fill: C.ACCENT }, g);
  const lab = wrapWords(d.label, 44).map(l => maskText(l, { "font-size": 50, fill: C.INK }, g));
  // notes: [{text, at}] — follow-up lines that land on their words under the label, so a long stat scene keeps moving
  const notes = (d.notes || []).map(x => ({ x, m: maskText(txt(x), { "font-family": SANS, "font-size": 34, fill: C.GREY }, g) }));
  K.label((d.prefix || "") + fmtNum(d.value, d.decimals || 0) + (d.suffix || "") + " " + d.label, s.t0, s.t1, "big number");
  notes.forEach(n => K.label(txt(n.x), s.t0, s.t1, "stat note"));
  return t => {
    const e = env(t, s), o = 1 - e.o;
    const c0 = cueT(d, s.t0 + 0.2), cnt = K.eout(K.prog(t, c0, c0 + Math.min(2.0, (s.t1 - c0) * 0.5)));
    big.t.textContent = (d.prefix || "") + fmtNum(d.value * cnt, d.decimals || 0) + (d.suffix || "");
    placeMask(big, W / 2, H * 0.47, e.i * o * (d.t != null ? K.eout(K.prog(t, c0 - 0.15, c0 + 0.15)) : 1));   // a cued number waits for its word instead of sitting at 0
    lab.forEach((m, k) => { const tk = s.t0 + 0.6 + k * 0.12; placeMask(m, W / 2, H * 0.47 + 110 + k * 66, K.eout(K.prog(t, tk, tk + 0.35)) * o); });
    const ny = H * 0.47 + 110 + lab.length * 66 + 30;
    notes.forEach((n, k) => { const tk = cueT(n.x, revealAt(s, k + 1, notes.length + 1, 0.8, 0.4)); placeMask(n.m, W / 2, ny + k * 52, K.eout(K.prog(t, tk, tk + 0.35)) * o); });
  };
};

B.sms = (s, g) => {
  const d = s.data;
  const pw = 520, ph = 900, px = W / 2 - pw / 2 + (d.offset || 0), py = 90;
  const phone = K.el("rect", { fill: "#151515", stroke: "#3a3a38", "stroke-width": 3 }, g);
  const screen = K.el("rect", { fill: "#000" }, g);
  const notch = K.el("rect", { fill: "#151515" }, g);
  const who = K.text(d.sender || "+1 (555) 010-0199", { "font-family": SANS, "font-size": 24, fill: C.INK, "text-anchor": "middle" }, g);
  const whoSub = K.text(d.senderNote || "Text Message", { "font-family": SANS, "font-size": 18, fill: C.GREY, "text-anchor": "middle" }, g);
  const lines = wrapWords(d.text, 30);
  const bub = K.el("rect", { fill: "#262628" }, g);
  const tl = lines.map(l => K.text(l, { "font-family": SANS, "font-size": 25, fill: C.INK }, g));
  const linkLine = K.el("rect", { fill: C.ACCENT }, g);
  const reply = d.reply ? K.el("rect", { fill: "#0a84ff" }, g) : null;
  const replyT = d.reply ? K.text(d.reply, { "font-family": SANS, "font-size": 25, fill: "#fff", "text-anchor": "middle" }, g) : null;
  K.label(d.text, s.t0, s.t1, "text message on a phone");
  return t => {
    const e = env(t, s), o = 1 - e.o;
    const yo = (1 - e.i) * (H - 60) + e.o * -(H - 60);
    K.set(phone, K.rect(px, py + yo, pw, ph, 64)); K.set(screen, K.rect(px + 18, py + 18 + yo, pw - 36, ph - 36, 50));
    K.set(notch, K.rect(W / 2 - 70 + (d.offset || 0), py + 30 + yo, 140, 34, 17));
    K.set(who, { x: px + pw / 2, y: py + 120 + yo }); K.set(whoSub, { x: px + pw / 2, y: py + 148 + yo });
    
    const tb = cueT(d, s.t0 + 0.5), typed = K.prog(t, tb, tb + Math.min(1.6, (s.t1 - s.t0) * 0.35));
    const nShow = Math.ceil(lines.length * typed);
    const bh = 26 + lines.length * 34, bw = pw - 110, bx = px + 40, by = py + 200 + yo;
    const pop = K.step(t, tb - 0.15, 16, 0.7);
    K.set(bub, K.rect(bx, by, bw * Math.min(1, pop), bh * Math.min(1, pop), 26)); 
    tl.forEach((x, k) => { K.set(x, { x: bx + 24, y: by + 42 + k * 34 }); x.style.opacity = k < nShow ? 1 : 0; });
    if (d.highlight != null) {
      const k = d.highlight, x = tl[k], len = x.getComputedTextLength();
      const hp = K.eio(K.prog(t, tb + 1.9, tb + 2.5));
      K.set(linkLine, K.rect(bx + 24, by + 50 + k * 34, len * hp, 4));
      x.setAttribute("fill", hp > 0.5 ? C.ACCENT : C.INK);
    } else K.set(linkLine, K.rect(0, 0, 0, 0));
    if (reply) {
      const rt = s.t0 + (d.replyAt || 0.6) * (s.t1 - s.t0), rp = K.step(t, rt, 16, 0.7);
      const rw = 90, rx = px + pw - 40 - rw, ry = by + bh + 40;
      K.set(reply, K.rect(rx + rw * (1 - Math.min(1, rp)), ry, rw * Math.min(1, rp), 56, 26)); 
      K.set(replyT, { x: rx + rw / 2, y: ry + 37 }); replyT.style.opacity = t > rt + 0.1 ? 1 : 0;
    }
  };
};

B.flow = (s, g) => {   // a chain of labelled nodes along one line; the line draws through them
  const d = s.data, n = d.nodes.length;
  const line = K.el("rect", { fill: C.GREY }, g);
  const items = d.nodes.map((nd, k) => {
    const c = K.el("circle", { fill: C.BG, stroke: k === (d.accent ?? -1) ? C.ACCENT : C.INK, "stroke-width": 4 }, g);
    const lab = wrapWords(txt(nd), 14).map(l => maskText(l, { "font-family": SANS, "font-size": 30, fill: k === (d.accent ?? -1) ? C.ACCENT : C.INK }, g));
    K.label(txt(nd), s.t0, s.t1, "flow diagram");
    return { c, lab };
  });
  const title = d.title ? maskText(d.title, { "font-size": 54, fill: C.INK }, g) : null;
  if (d.title) K.label(d.title, s.t0, s.t1, "diagram title");
  return t => {
    const e = env(t, s), o = 1 - e.o, x0 = 220, x1 = W - 220, y = H * 0.52;
    if (title) placeMask(title, W / 2, 200, e.i * o);
    const lastT = cueT(d.nodes[n - 1], revealAt(s, n - 1, n, d.span || 0.75, 0.4));
    const lp = K.prog(t, s.t0 + 0.3, lastT + 0.2);
    K.set(line, K.rect(x0, y - 2, (x1 - x0) * lp * o, 4));
    items.forEach((it, k) => {
      const x = n === 1 ? W / 2 : K.lerp(x0, x1, k / (n - 1)), tk = cueT(d.nodes[k], revealAt(s, k, n, d.span || 0.75, 0.4));
      const r = 26 * Math.min(1.2, K.step(t, tk, 15, 0.55)) * o;
      K.set(it.c, { cx: x, cy: y, r: Math.max(0, r) });
      it.lab.forEach((m, j) => placeMask(m, x, y + 80 + j * 38, K.eout(K.prog(t, tk + 0.05, tk + 0.4)) * o));
    });
  };
};

B.hub = (s, g) => {    // one centre, spokes revealed around it
  const d = s.data, n = d.spokes.length;
  const centre = K.el("circle", { fill: C.ACCENT }, g);
  const ct = maskText(d.center, { "font-family": SANS, "font-size": 32, fill: C.BG, "font-weight": 700 }, g);
  const spokes = d.spokes.map(sp => ({ l: K.el("line", { stroke: C.GREY, "stroke-width": 3 }, g), c: K.el("circle", { fill: C.BG, stroke: C.INK, "stroke-width": 3 }, g),
    lab: wrapWords(txt(sp), 16).map(l => maskText(l, { "font-family": SANS, "font-size": 28, fill: C.INK }, g)) }));
  [d.center, ...d.spokes].forEach(x => K.label(txt(x), s.t0, s.t1, "hub diagram"));
  return t => {
    const e = env(t, s), o = 1 - e.o, cx = W / 2, cy = H * 0.5, R = 330;
    const cr = 95 * Math.min(1.15, K.step(t, s.t0 + 0.1, 12, 0.6)) * o;
    K.set(centre, { cx, cy, r: Math.max(0, cr) });
    placeMask(ct, cx, cy + 11, K.eout(K.prog(t, s.t0 + 0.3, s.t0 + 0.6)) * o);
    spokes.forEach((sp, k) => {
      const a = -Math.PI / 2 + k * 2 * Math.PI / n, tk = cueT(d.spokes[k], revealAt(s, k, n, 0.7, 0.6));
      const p = K.eio(K.prog(t, tk, tk + 0.4)) * o;
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R * 0.78;
      const rx = cx + Math.cos(a) * 95, ry = cy + Math.sin(a) * 95 * 0.78;   // spokes grow out from the rim, never across the centre
      K.set(sp.l, { x1: rx, y1: ry, x2: K.lerp(rx, x, p), y2: K.lerp(ry, y, p) }); K.show(sp.l, p > 0.001);
      K.set(sp.c, { cx: x, cy: y, r: 16 * Math.min(1.2, K.step(t, tk + 0.35, 15, 0.6)) * o });
      const below = Math.sin(a) > 0.2, ly = below ? y + 56 : y - 36 - (sp.lab.length - 1) * 34;
      sp.lab.forEach((m, j) => placeMask(m, x, ly + j * 34, K.eout(K.prog(t, tk + 0.4, tk + 0.7)) * o));
    });
  };
};

B.list = (s, g) => {
  const d = s.data, n = d.items.length;
  const title = d.title ? maskText(d.title, { "font-size": 58, fill: C.INK }, g) : null;
  const rows = d.items.map((it, k) => ({ box: K.el("rect", { fill: "none", stroke: C.ACCENT, "stroke-width": 3 }, g),
    tick: K.el("path", { fill: "none", stroke: C.ACCENT, "stroke-width": 5, "stroke-linecap": "round", "stroke-linejoin": "round" }, g),
    m: maskText(txt(it), { "font-size": 44, fill: C.INK }, g) }));
  if (d.title) K.label(d.title, s.t0, s.t1, "list title");
  d.items.forEach(x => K.label(txt(x), s.t0, s.t1, "list"));
  return t => {
    const e = env(t, s), o = 1 - e.o, x0 = d.x || 360, y0 = d.title ? 330 : 260, gap = Math.min(110, 560 / Math.max(1, n - 1));
    if (title) placeMask(title, x0 - 20, 200, e.i * o, "start");
    rows.forEach((r, k) => {
      const tk = cueT(d.items[k], revealAt(s, k, n, d.span || 0.8, 0.5)), y = y0 + k * gap, p = K.step(t, tk, 15, 0.6) * o;
      K.set(r.box, K.rect(x0 - 20 - 40 * Math.min(1, p) / 2 + 20 - 20, y - 34, 40 * Math.min(1, p), 40 * Math.min(1, p), 6));
      const tp = K.eio(K.prog(t, tk + 0.2, tk + 0.45)) * o;
      r.tick.setAttribute("d", `M ${x0 - 32} ${y - 14} L ${x0 - 22} ${y - 4} L ${x0 - 22 + 22 * tp} ${y - 4 - 24 * tp}`);
      r.tick.style.opacity = tp > 0.01 ? 1 : 0;
      placeMask(r.m, x0 + 40, y, K.eout(K.prog(t, tk + 0.05, tk + 0.4)) * o, "start");
    });
  };
};

B.quote = (s, g) => {
  const d = s.data, lines = wrapWords("“" + d.text + "”", 40);
  const ms = lines.map(l => maskText(l, { "font-size": 58, fill: C.INK, "font-style": "italic" }, g));
  const who = maskText("— " + d.who, { "font-family": SANS, "font-size": 28, fill: C.ACCENT, "letter-spacing": 2 }, g);
  const bar = K.el("rect", { fill: C.ACCENT }, g);
  K.label(d.text + " — " + d.who, s.t0, s.t1, "quote card");
  return t => {
    const e = env(t, s), o = 1 - e.o, lh = 80, y0 = H * 0.44 - (lines.length - 1) * lh / 2;
    K.set(bar, K.rect(250, y0 - 60, 8, (lines.length * lh + 20) * K.eio(K.prog(t, s.t0, s.t0 + 0.6)) * o));
    ms.forEach((m, k) => placeMask(m, 300, y0 + k * lh, K.eout(K.prog(t, s.t0 + 0.15 + k * 0.12, s.t0 + 0.5 + k * 0.12)) * o, "start"));
    placeMask(who, 300, y0 + lines.length * lh + 30, K.eout(K.prog(t, s.t0 + 0.8, s.t0 + 1.1)) * o, "start");
  };
};

B.bars = (s, g) => {   // horizontal bar chart, values revealed one by one
  const d = s.data, n = d.rows.length, max = Math.max(...d.rows.map(r => r[1]));
  const title = maskText(d.title, { "font-size": 52, fill: C.INK }, g);

// Every beat with "at" fires on its spoken word; a beat without one fires at `time` (0..1 of the segment).
function drawSet(kind, g) {

    K.el("rect", { x: 1240, y: gy - 170, width: 520, height: 120, rx: 26, fill: "#24211f" }, g);

    K.el("rect", { x: 1250, y: gy - 50, width: 18, height: 50, fill: "#1b1918" }, g); K.el("rect", { x: 1732, y: gy - 50, width: 18, height: 50, fill: "#1b1918" }, g);

    K.el("rect", { x: 1090, y: gy - 278, width: 16, height: 278, fill: "#221f1d" }, g); K.el("rect", { x: 1654, y: gy - 278, width: 16, height: 278, fill: "#221f1d" }, g);
    K.el("path", { d: `M 1300 ${gy - 300} L 1330 ${gy - 470} L 1560 ${gy - 470} L 1590 ${gy - 300} Z`, fill: "#1b1d20", stroke: "#33363a", "stroke-width": 4 }, g);

function bubble(g) {   // a speech or thought bubble that pops from a point; text wraps inside

    const sc = Math.max(0, Math.min(1.08, p)), bx = x - w / 2 * sc, by = y - (h + 40) * sc;

    tail.setAttribute("d", kind === "think" ? `M ${x - 6 * sc} ${y - 30 * sc} a ${9 * sc} ${9 * sc} 0 1 0 0.1 0 M ${x - 18 * sc} ${y - 8 * sc} a ${5 * sc} ${5 * sc} 0 1 0 0.1 0`

const EMOTE = { "?": "?", "!": "!", "$": "$", "…": "…", "x": "✕" };
B.stage = (s, g) => {
  const d = s.data, gy = drawSet(d.set || "blank", g);
  const kick = d.kicker ? maskText(d.kicker, { "font-family": SANS, "font-size": 28, fill: C.ACCENT, "letter-spacing": 5 }, s.ov) : null;
  const cast = {}, order = [];
  (d.cast || []).forEach((c, i) => { cast[c.id] = { c, fig: F.figure(g, c), seed: i * 3 + 1 }; order.push(c.id); });
  const fx = K.el("g", {}, g);
  const beats = (d.beats || []).map(b => Object.assign({ T: b.t != null ? b.t : s.t0 + (b.time || 0) * (s.t1 - s.t0) }, b)).sort((a, b) => a.T - b.T);
  beats.forEach(b => { if (b.say || b.think) K.label(b.say || b.think, b.T, s.t1, b.say ? "speech bubble" : "thought bubble");
                       if (b.notify) K.label(b.notify, b.T, s.t1, "phone notification"); });
  if (d.kicker) K.label(d.kicker, s.t0, s.t1, "scene label");
  const bubbles = {}, emotes = {}, notes = {};
  order.forEach(id => { bubbles[id] = bubble(fx); emotes[id] = K.text("", { "font-family": SANS, "font-size": 70, "font-weight": 700, fill: C.ACCENT, "text-anchor": "middle" }, fx);
    const n = K.el("g", {}, fx); notes[id] = { g: n, box: K.el("rect", { fill: "#262628", stroke: "#3a3a38", "stroke-width": 2 }, n),
      from: K.text("", { "font-family": SANS, "font-size": 20, fill: C.GREY }, n), lines: [0, 1, 2, 3].map(() => K.text("", { "font-family": SANS, "font-size": 24, fill: C.INK }, n)) }; });
  return t => {
    const e = env(t, s), o = 1 - e.o;

      let keys = [[s.t0 - 1, c.pose || "stand"]], x = c.x * W, face = c.face || (c.x > 0.5 ? "left" : "right"), walking = 0;

    void fxp; void o;
    g.__cam = { cx: fx, cy: K.lerp(H / 2, gy - 330, 0.25 * p), z: 1 + 0.09 * p };
  };
};

// ── a crowd: rows of seated people on phones; the camera starts on one and pulls back to show the room ──

B.crowd = (s, g) => {

  const cnt = d.count ? maskText("", { "font-size": 140, fill: C.ACCENT }, g) : null;
  const cntL = d.count && d.count.label ? maskText(d.count.label, { "font-family": SANS, "font-size": 34, fill: C.INK }, g) : null;
  if (d.label) K.label(d.label, s.t0, s.t1, "crowd label");
  if (d.count) K.label(`${d.count.prefix || ""}${fmtNum(d.count.value, 0)}${d.count.suffix || ""} ${d.count.label || ""}`, s.t0, s.t1, "count");
  const hero = sp[Math.floor(cols / 2) + (rows - 1) * cols];
  return t => {
    const e = env(t, s), o = 1 - e.o;
    people.forEach((f, k) => {
      const q = sp[k], glow = 0.5 + 0.5 * Math.sin(t * (1.3 + (q.ph % 1)) + q.ph);
      F.place(f, q.x, q.y, q.h, F.idle(t * 0.7, k, "sitphone"), { face: q.face, glow });
    });
    const p0 = s.t0 + (s.t1 - s.t0) * (d.from ?? 0.05), p1 = s.t0 + (s.t1 - s.t0) * (d.to ?? 0.6), p = K.eio(K.prog(t, p0, p1));
    const z = Math.exp(K.lerp(Math.log(2.6), Math.log(1.0), p));
    const cx = K.lerp(hero.x, W / 2, p), cy = K.lerp(hero.y - hero.h * 0.5, H * 0.5, p);
    room.setAttribute("transform", `translate(${W / 2} ${H / 2}) scale(${z}) translate(${-cx} ${-cy})`);
    if (label) placeMask(label, W / 2, 150, K.eout(K.prog(t, p1 - 0.3, p1 + 0.2)) * o);
    if (cnt) {
      const c0 = cueT(d.count, p1), k = K.eout(K.prog(t, c0, c0 + 1.6));
      cnt.t.textContent = (d.count.prefix || "") + fmtNum(d.count.value * k, 0) + (d.count.suffix || "");
      placeMask(cnt, W / 2, 860, K.eout(K.prog(t, c0 - 0.1, c0 + 0.25)) * o);
      if (cntL) placeMask(cntL, W / 2, 920, K.eout(K.prog(t, c0 + 0.2, c0 + 0.5)) * o);
    }
  };
};


// ── a full illustrated panel (webtoon / motion comic): one composed image per beat, a real camera over it ──
// data: { image: "panels/p03.png", shot?: "EST"|"WIDE"|"MED"|"CU"|"ECU"|"INS"|"OTS"|"TWO", focus?: [x, y] (0..1 of the frame),
//         camera?: "push"|"pull"|"pan-left"|"pan-right"|"tilt-up"|"tilt-down"|"hold" | {from: {x, y, z}, to: {x, y, z}},
//         flashback?: true, caption_card?: "text" | {text, at?, hold?}, freeze?: true | {at}, shake?: {at, amp?},
//         enter?: "cut"|"fade", exit?: "cut"|"fade" }
// The camera crops and scales the still (z >= 1 keeps the frame covered); each shot type has a default move.
const SHOT_CAM = { EST: ["pull", 1.16, 1.0], WIDE: ["pan", 1.08, 1.08], MED: ["push", 1.02, 1.08], CU: ["push", 1.04, 1.13],
                   ECU: ["push", 1.08, 1.2], INS: ["push", 1.03, 1.1], OTS: ["pan", 1.1, 1.12], TWO: ["push", 1.0, 1.05] };
const PANEL_IMAGES = [];
function panelCam(d) {
  if (d.camera && typeof d.camera === "object") return d.camera;
  const [fx, fy] = d.focus || [0.5, 0.45], [def, z0, z1] = SHOT_CAM[d.shot] || ["push", 1.02, 1.08];
  let mv = d.camera || def;
  if (mv === "pan") mv = fx < 0.5 ? "pan-left" : "pan-right";
  const zp = Math.max(z0, z1, 1.08), dx = 0.05, c = { x: 0.5, y: 0.5 }, f = { x: fx, y: fy };
  switch (mv) {
    case "pull":      return { from: { ...f, z: Math.max(z0, z1) }, to: { ...c, z: Math.min(z0, z1) } };
    case "pan-left":  return { from: { x: 0.5 + dx, y: fy, z: zp }, to: { x: 0.5 - dx, y: fy, z: zp } };
    case "pan-right": return { from: { x: 0.5 - dx, y: fy, z: zp }, to: { x: 0.5 + dx, y: fy, z: zp } };
    case "tilt-up":   return { from: { x: fx, y: 0.5 + dx, z: zp }, to: { x: fx, y: 0.5 - dx, z: zp } };
    case "tilt-down": return { from: { x: fx, y: 0.5 - dx, z: zp }, to: { x: fx, y: 0.5 + dx, z: zp } };
    case "hold":      return { from: { ...f, z: 1.03 }, to: { ...f, z: 1.045 } };
    default:          return { from: { x: K.lerp(0.5, fx, 0.4), y: K.lerp(0.5, fy, 0.4), z: Math.min(z0, z1) }, to: { ...f, z: Math.max(z0, z1) } };
  }
}
let fbVig = null;
B.panel = (s, g) => {
  const d = s.data || {}, id = "pf" + s.id.replace(/\W/g, "");
  PANEL_IMAGES.push(d.image);
  // grade: saturation (dropped on a freeze), then sepia for a flashback
  const flt = K.el("filter", { id, "color-interpolation-filters": "sRGB" }, K.defs);
  const sat = K.el("feColorMatrix", { type: "saturate", values: d.flashback ? 0.55 : 1 }, flt);
  if (d.flashback) K.el("feColorMatrix", { type: "matrix", values: ".393 .769 .189 0 0  .349 .686 .168 0 0  .272 .534 .131 0 0  0 0 0 1 0" }, flt);
  K.el("rect", { x: 0, y: 0, width: W, height: H, fill: "#000" }, g);
  const img = K.el("image", { href: d.image, x: 0, y: 0, width: W, height: H, preserveAspectRatio: "xMidYMid slice", filter: `url(#${id})` }, g);
  void img;
  if (d.flashback) {
    if (!fbVig) {
      const gr = K.el("radialGradient", { id: "fbvig", cx: "50%", cy: "50%", r: "70%" }, K.defs);
      K.el("stop", { offset: "40%", "stop-color": "#1a1206", "stop-opacity": 0 }, gr);
      K.el("stop", { offset: "100%", "stop-color": "#1a1206", "stop-opacity": 0.75 }, gr);
      fbVig = true;
    }
    K.el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#fbvig)" }, s.ov);
  }
  let card = null;
  if (d.caption_card) {
    const cc = typeof d.caption_card === "string" ? { text: d.caption_card } : d.caption_card;
    const c0 = cueT(cc, s.t0 + 0.15), c1 = cc.hold ? c0 + cc.hold : s.t1;
    const cg = K.el("g", {}, s.ov);
    const tx = K.text(cc.text, { "font-family": FONT, "font-size": 38, fill: "#f2ead8", x: 92, y: 118 }, cg);
    const bw = Math.max(260, cc.text.length * 19 + 64);
    cg.insertBefore(K.el("rect", { x: 60, y: 66, width: bw, height: 76, rx: 4, fill: "#0d0c0a", "fill-opacity": 0.86, stroke: "#f2ead8", "stroke-opacity": 0.35 }, cg), tx);
    K.label(cc.text, c0, c1, "caption card");
    card = { g: cg, c0, c1 };
  }
  const cam = panelCam(d);
  const fz = d.freeze ? (d.freeze === true ? s.t1 - 0.6 : cueT(d.freeze, s.t1 - 0.6)) : null;
  const sh = d.shake ? { t: cueT(d.shake, s.t0), a: d.shake.amp || 14 } : null;
  return t => {
    const end = fz != null ? Math.min(fz, s.t1) : s.t1;
    const p = K.eio(K.prog(Math.min(t, end), s.t0, end));
    let z = Math.exp(K.lerp(Math.log(cam.from.z), Math.log(cam.to.z), p));
    z = Math.max(1, z);
    let cx = K.lerp(cam.from.x, cam.to.x, p) * W, cy = K.lerp(cam.from.y, cam.to.y, p) * H;
    if (sh && t >= sh.t) {
      const k = Math.exp(-(t - sh.t) * 7) * sh.a;
      cx += k * Math.sin((t - sh.t) * 71); cy += k * Math.sin((t - sh.t) * 53 + 1.3);
    }
    // keep the frame covered: the camera can't look past the still's edge
    const hw = W / (2 * z), hh = H / (2 * z);
    cx = Math.min(Math.max(cx, hw), W - hw); cy = Math.min(Math.max(cy, hh), H - hh);
    g.__cam = { z, cx, cy };
    if (fz != null) K.set(sat, { values: (d.flashback ? 0.55 : 1) * K.lerp(1, 0.3, K.eout(K.prog(t, fz, fz + 0.25))) });
    const fin = d.enter === "fade" ? K.eout(K.prog(t, s.t0, s.t0 + 0.45)) : 1, fout = d.exit === "fade" ? 1 - K.ein(K.prog(t, s.t1 - 0.45, s.t1)) : 1;
    g.setAttribute("opacity", Math.min(fin, fout));
    if (card) card.g.setAttribute("opacity", K.eout(K.prog(t, card.c0, card.c0 + 0.25)) * (1 - K.ein(K.prog(t, card.c1 - 0.25, card.c1))));
  };
};

const OPAQUE = new Set(["stage", "board", "crowd"]);   // scenes with their own set: no drifting dots behind them
const FULL = new Set(["panel"]);                       // full-frame images: they cut (or fade), and nothing shows behind them

// ── build every segment once ─────────────────────────────
const built = SEGS.map((s, i) => {
  const g = K.el("g", {}, sceneG);
  s.ov = K.el("g", {}, overlayG);
  const fn = (B[s.type] || B.statement)(s, g);
  // scenes with their own set wipe on and off (left to right, 0.45 s) instead of cutting: no hard pops, no fades
  let wipe = null;
  if (OPAQUE.has(s.type)) {
    const id = "wipe" + i; wipe = K.clipRect(id, 0, -50, 0, H + 100); g.setAttribute("clip-path", `url(#${id})`);
    g.insertBefore(K.el("rect", { x: -400, y: -400, width: W + 800, height: H + 800, fill: C.BG }, g), g.firstChild);   // paints every pixel
  }
  return { s, g, fn, wipe, next: SEGS[i + 1] };
});
const WIPE = 0.45;

// ── burned-in captions (optional, "captions": true): word-lit pages built from the aligned words ──
// Long-form 16:9 usually ships captions as a YouTube caption track (out/captions.vtt) instead; burn them for shorts.
const capPages = [];
if (TL.captions) {
  const capsDiv = document.getElementById("caps");
  SEGS.forEach(s => {
    const ws = s.words || [];
    let page = [];
    const flush = () => { if (page.length) capPages.push({ s, words: page }); page = []; };
    ws.forEach((w, k) => {
      page.push(w);
      const chars = page.map(x => x[0]).join(" ").length, end = /[.!?]$/.test(w[0]), comma = /[,;:]$/.test(w[0]);
      // short pages (about four words) so the eye can't run ahead of the voice
      if (end || page.length >= 4 || chars > 26 || (comma && page.length >= 2)) flush();
    });
    flush();
  });
  capPages.forEach((pg, i) => {
    const next = capPages[i + 1];
    pg.t0 = pg.words[0][1] - 0.05;
    pg.t1 = next && next.s === pg.s ? next.words[0][1] - 0.05 : Math.min(pg.s.t1, pg.words[pg.words.length - 1][2] + 0.5);
    const box = document.createElement("div"), inner = document.createElement("div");
    Object.assign(box.style, { position: "absolute", left: "80px", width: (W - 160) + "px", top: (H - 128) + "px", height: "64px", overflow: "hidden", textAlign: "center",
      fontFamily: SANS, fontSize: "44px", fontWeight: "600", lineHeight: "64px", fontStyle: pg.s.mono ? "italic" : "normal" });
    pg.spans = pg.words.map(w => { const sp = document.createElement("span"); sp.textContent = w[0] + " "; sp.style.whiteSpace = "pre"; inner.appendChild(sp); return sp; });
    box.appendChild(inner); capsDiv.appendChild(box);
    pg.box = box; pg.inner = inner;
    window.STUDIO.text.push({ t0: pg.t0, t1: pg.t1, where: "caption", text: pg.words.map(w => w[0]).join(" ") });
  });
}

// vignette: a radial darkening over the scenes, under the captions (grade.vignette 0 turns it off)
const vig = (() => {
  const amt = (TL.grade && TL.grade.vignette != null) ? TL.grade.vignette : 0.35;
  if (!amt) return null;
  const gr = K.el("radialGradient", { id: "vig", cx: "50%", cy: "50%", r: "75%" }, K.defs);
  K.el("stop", { offset: "55%", "stop-color": "#000", "stop-opacity": 0 }, gr);
  K.el("stop", { offset: "100%", "stop-color": "#000", "stop-opacity": amt }, gr);
  return K.el("rect", { x: 0, y: 0, width: W, height: H, fill: "url(#vig)" }, K.top);
})();
void vig;

// panel images must be decoded before a frame is taken (render.py waits on STUDIO.ready)
window.STUDIO.ready = Promise.all([...new Set(PANEL_IMAGES.filter(Boolean))].map(src => {
  const im = new Image(); im.src = src;
  return im.decode().catch(() => { (window.STUDIO.warnings = window.STUDIO.warnings || []).push(`panel image missing or unreadable: ${src}`); });
}));

// ── render(t) ────────────────────────────────────────────
K.run(t => {
  dots.forEach(d => K.set(d.el, { cx: (d.x + t * d.v) % W, cy: d.y, r: d.s }));
  K.show(bgG, !built.some(b => (OPAQUE.has(b.s.type) && t >= b.s.t0 + WIPE && t <= b.s.t1) || (FULL.has(b.s.type) && t >= b.s.t0 && t <= b.s.t1)));
  let src = "", chap = "";
  built.forEach(b => {
    const on = t >= b.s.t0 - 0.01 && t <= b.s.t1 + 0.01 + (b.wipe ? WIPE : 0);
    K.show(b.g, on); K.show(b.s.ov, on && t <= b.s.t1 + 0.01);
    if (b.wipe && on) {
      const inn = K.eio(K.prog(t, b.s.t0, b.s.t0 + WIPE)), out = !b.next || !OPAQUE.has(b.next.type) ? K.eio(K.prog(t, b.s.t1, b.s.t1 + WIPE)) : 0;
      const pad = 200;                                     // the scene camera can zoom; keep the clip wider than the frame
      K.set(b.wipe, { x: -pad + out * (W + 2 * pad), width: Math.max(0, (W + 2 * pad) * (inn - out)), y: -pad, height: H + 2 * pad });
    }
    if (on) {
      b.fn(t);
      // slow drift so nothing sits still (1.0 → 1.03), or the scene's own camera if it set one
      const cam = b.g.__cam, z = cam ? cam.z : K.lerp(1, 1.03, K.prog(t, b.s.t0, b.s.t1));
      b.g.setAttribute("transform", `translate(${W / 2} ${H / 2}) scale(${z}) translate(${-(cam ? cam.cx : W / 2)} ${-(cam ? cam.cy : H / 2)})`);
      src = b.s.source || ""; chap = FULL.has(b.s.type) ? "" : b.s.chapter || "";   // a drama panel carries no chapter label
    }
  });
  sourceT.textContent = src ? "Source: " + src : "";
  chapterT.textContent = chap.toUpperCase();
  capPages.forEach(pg => {
    // a page leaves in the 0.18 s before the next one rises, so two pages never share the band
    const vis = t >= pg.t0 && t < pg.t1;
    pg.box.style.visibility = vis ? "visible" : "hidden";
    if (!vis) return;
    const up = K.eout(K.prog(t, pg.t0, pg.t0 + 0.12)), gone = K.ein(K.prog(t, pg.t1 - 0.1, pg.t1));
    pg.inner.style.transform = `translateY(${(1 - up) * 100 - gone * 100}%)`;
    pg.spans.forEach((sp, k) => {
      const w = pg.words[k], nx = pg.words[k + 1], lit = K.prog(t, w[1] - 0.02, w[1] + 0.08);
      const now = t >= w[1] - 0.02 && (!nx || t < nx[1] - 0.02) && t < w[2] + 0.15;   // one word at a time, lit as it is said
      sp.style.color = now ? C.ACCENT : K.mix("#6b6b67", pg.s.mono ? "#e9dcc0" : C.INK, lit);   // inner monologue reads warmer
    });
  });
});
</script>
</body>
