    <script>
      (function () {
        const v = K.vars();
        K.bind(v);
        const $ = K.$, E = K.E, P = K.prog, C = K.clamp, L = K.lerp, R = K.rnd;
        const DUR = 33, TAU = Math.PI * 2;
        const ACC = v.accent, INK = v.ink;
        const accA = (a) => { const n = parseInt(String(ACC).replace("#", ""), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };
        const ioq = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        const ios = (u) => -(Math.cos(Math.PI * u) - 1) / 2;
        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const blur = (el, b) => { el.style.filter = b > 0.25 ? "blur(" + b.toFixed(1) + "px)" : "none"; };
        const fade = (el, a) => { K.show(el, a > 0.002); el.style.opacity = C(a).toFixed(3); };
        const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        const MBF = {};
        const mblur = (el, key, sx, sy) => {
          if (sx < 0.3 && sy < 0.3) { el.style.filter = "none"; return; }
          let g = MBF[key];
          if (!g) {
            const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter");
            f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-40%"); f.setAttribute("y", "-40%"); f.setAttribute("width", "180%"); f.setAttribute("height", "180%");
            g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g);
            let defs = document.getElementById("mbDefs");
            if (!defs) { const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute"; defs = document.createElementNS(ns, "defs"); defs.id = "mbDefs"; svg.appendChild(defs); document.body.appendChild(svg); }
            defs.appendChild(f); MBF[key] = g;
          }
          g.setAttribute("stdDeviation", sx.toFixed(1) + " " + sy.toFixed(1));
          el.style.filter = "url(#mb_" + key + ")";
        };
        const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
        const hm = (h) => { let H = Math.floor(h + 1e-6), M = Math.round((h - H) * 60); if (M === 60) { H++; M = 0; } return String(H).padStart(2, "0") + ":" + String(M).padStart(2, "0"); };

              const fl = P(t, 27.5, 28.26), from = tessDotPos(27.5), q = 1 - fl;
              const x = q * q * from[0] + 2 * q * fl * 1320 + fl * fl * (period[0] + 20), y = q * q * from[1] + 2 * q * fl * 250 + fl * fl * (period[1] - 150);
              setDot(x, y, L(tessDotR(27.5), 12, P(t, 27.5, 28.1)));
            } else {
              const land = E.outBounce(P(t, 28.2, 28.46));
              setDot(L(period[0] + 20, period[0], E.outCubic(P(t, 28.2, 28.3))), L(period[1] - 150, period[1], land), 12);
            }
            return;
          }
          const g = endGeo(t, G), mr = g.mr;
          if (t < 32.28) { setDot(L(period[0], mr.dot[0], g.fold), L(period[1], mr.dot[1], g.fold), L(12, mr.dot[2], g.fold)); return; }
          const u = ioq(P(t, 32.3, 32.5));
          setDot(L(mr.dot[0], 960, u), L(mr.dot[1], 540, u), L(mr.dot[2], 14, u));
        }

        // ================= fx: red floods =================
        function flood(t) {
          fx.clearRect(0, 0, 1920, 1080);
          const disc = (x, y, r, soft) => { const g = fx.createRadialGradient(x, y, Math.max(0, r - soft), x, y, r + soft); g.addColorStop(0, ACC); g.addColorStop(1, accA(0)); fx.fillStyle = g; fx.fillRect(0, 0, 1920, 1080); };
          // opening: the whole frame is the now-dot
          if (t < 0.46) { const r = 15 + 1584 * Math.pow(1 - t / 0.45, 2.7); disc(960, 540, r, 2 + r * 0.05); }
          // zoom streaks while the week collapses into the dot
          const zs = bump(t, 5.72, 5.92);
          if (zs > 0) {
            for (let k = 0; k < 26; k++) {
              const a = R(k * 4.3 + 2) * TAU, r0 = L(30, 170, R(k * 1.7)) * L(1.5, 0.6, P(t, 5.72, 5.92)), len = L(120, 320, R(k * 2.9));
              const cx = Math.cos(a), cy = Math.sin(a) * 0.36;
              const x0 = 960 + cx * r0, y0 = 540 + cy * r0, x1 = 960 + cx * (r0 + len), y1 = 540 + cy * (r0 + len);
              const tone = R(k * 5.5) < 0.3 ? "20,20,22" : "120,120,126";
              [[48, 0.1], [28, 0.18], [12, 0.3]].forEach(([wd, al]) => {
                const gr = fx.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, "rgba(" + tone + "," + (al * zs).toFixed(3) + ")"); gr.addColorStop(1, "rgba(" + tone + ",0)");
                fx.strokeStyle = gr; fx.lineWidth = wd * L(0.6, 1.2, R(k * 8.3)); fx.lineCap = "round"; fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x1, y1); fx.stroke();
              });
            }
          }
          // send button floods the screen
          if (t >= 13.58 && t < 14.0) {
            const c = winCam(Math.min(t, 13.99)), p = onScreen(c, SEND[0], SEND[1] - 330);
            const r = 20 * c.s + 2400 * Math.pow(P(t, 13.58, 14.05), 4);
            disc(p[0], p[1], r, 6 + r * 0.03);
          }
          // the red collapses into the tilted now-line
          if (t >= 13.99 && t < 14.3) {
            const c = winCam(t), a = proj(262, tY(8.7), 0, c), b = proj(1476, tY(8.7), 0, c);
            const k = (b[1] - a[1]) / (b[0] - a[0]), yl = a[1] - k * a[0], yr = yl + k * 1920;
            const top = L(1400, 1, E.outCubic(P(t, 13.98, 14.16))), bot = L(560, 1, E.outCubic(P(t, 13.97, 14.2)));
            fx.fillStyle = ACC; fx.beginPath(); fx.moveTo(-10, yl - top); fx.lineTo(1930, yr - top); fx.lineTo(1930, yr + bot); fx.lineTo(-10, yl + bot); fx.closePath(); fx.fill();
          }
        }

        // ================= cursor =================
        function cursor(t) {
          const on = t >= 13.2 && t < 13.64;
          K.show($("cursor"), on);
          if (!on) return;
          const u = E.outCubic(P(t, 13.2, 13.42));
          const x = L(1500, 1126, u), y = L(860, 596, u), s = 1 - 0.12 * bump(t, 13.45, 13.56);
          $("cursor").style.transform = "translate(" + px(x - 13) + "," + px(y - 7) + ") scale(" + s.toFixed(3) + ")";
          $("cursor").style.opacity = (C(P(t, 13.2, 13.26) * 1) * (1 - P(t, 13.58, 13.64))).toFixed(3);
        }

        function render(t) {
          flood(t);
          intro(t);
          if (t < 5.86) { if (t >= 0.44) setDot(960, 540, t < 5.5 ? (t < 0.46 ? 15 : L(15, 13, P(t, 0.46, 0.8))) : 13); else K.show(dotEl, false); }
          dark(t);
          if (t >= 9.5 && t < 24.72) K.show(dotEl, false);
          app(t);
          feats(t);
          tess(t);
          end(t);
          dotLate(t);
          cursor(t);
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dWmW = 0; EG = null; SPR = null; render(lastT); });
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
