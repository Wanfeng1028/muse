        const bump = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
        const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; };
        const blur = (el, b) => { el.style.filter = b > 0.25 ? "blur(" + b.toFixed(1) + "px)" : "none"; };

          if (!g) { const ns = "http://www.w3.org/2000/svg", f = document.createElementNS(ns, "filter"); f.setAttribute("id", "mb_" + key); f.setAttribute("x", "-30%"); f.setAttribute("y", "-30%"); f.setAttribute("width", "160%"); f.setAttribute("height", "160%"); g = document.createElementNS(ns, "feGaussianBlur"); f.appendChild(g); $("defs").appendChild(f); MBF[key] = g; }

          const on = t >= 9.96 && t < 11.8;
          K.show($("dealL"), on);
          if (!on) return;
          const up = E.inOutCubic(P(t, 10.8, 10.98));
          const d1 = $("d1"), d2 = $("d2");
          d1.style.top = L(400, 272, up).toFixed(1) + "px";
          riseLetters(D1, t, 10.04, 0.03, 0.22, 60);
          K.show(d2, t >= 10.9);
          d2.style.top = "536px";
          riseLetters(D2, t, 10.9, 0.025, 0.22, 60);
          // price pills, struck and dropped
          const xs = PRICES.map((_, i) => 960 + (i - (PRICES.length - 1) / 2) * 300);
          pillEls.forEach((p, i) => {
            const u = E.outBack(P(t, 10.18 + i * 0.05, 10.34 + i * 0.05), 1.8);
            const fall = E.inCubic(P(t, 10.58 + i * 0.03, 10.86 + i * 0.03));
            K.show(p, u > 0 && fall < 1);
            p.style.transform = "translate(" + (xs[i] - p.offsetWidth / 2).toFixed(1) + "px," + (694 + fall * 180).toFixed(1) + "px) rotate(" + (fall * (i - 1) * 18).toFixed(1) + "deg) scale(" + C(u, 0, 1.2).toFixed(3) + ")";
            p.style.opacity = (C(u * 2) * (1 - fall)).toFixed(3);
            p.style.filter = fall > 0.02 ? "blur(" + (fall * 8).toFixed(1) + "px)" : "none";
          });
          const st = $("strike");
          K.draw(st, E.inOutCubic(P(t, 10.36, 10.52)));
          st.style.opacity = 1 - P(t, 10.62, 10.75);
          K.draw($("ring1"), E.inOutCubic(P(t, 10.98, 11.4)));
          K.draw($("swoosh"), E.outCubic(P(t, 11.1, 11.35)));
          $("swoosh").style.opacity = 1 - P(t, 11.45, 11.55);
          // a dark iris opens from the middle into the proof scene
          const ir = P(t, 11.52, 11.8);
          if (ir > 0) {
            const r = L(0, 1200, Math.pow(ir, 1.8));
            fx.save(); fx.fillStyle = "#040816"; fx.beginPath(); fx.arc(960, 520, r, 0, TAU); fx.fill(); fx.restore();
          }
        }

        function proof(t) {
          const on = t >= 11.76 && t < 13.4;
          K.show($("proofL"), on);
          if (!on) return;
          const up = E.inOutCubic(P(t, 12.58, 12.76));
          const ny = L(372, 222, up);
          numEl.style.top = ny.toFixed(1) + "px";
          numEl.style.fontSize = L(230, 180, up).toFixed(1) + "px";
          $("nlab").style.top = (ny + L(232, 190, up)).toFixed(1) + "px";
          $("nlab").style.opacity = P(t, 11.95, 12.1);
          numEl.style.opacity = P(t, 11.76, 11.84);
          digitEls.forEach((d, k) => {
            const settle = 12.04 + k * 0.085;
            if (t >= settle) { d.el.textContent = d.ch; d.el.style.filter = "none"; d.el.style.transform = "none"; return; }
            d.el.textContent = String(Math.floor(R(k * 13.1 + Math.floor(t * 40)) * 10));
            mblur(d.el, "dg" + k, 2, 22 + 12 * R(k + Math.floor(t * 40)));
            d.el.style.transform = "scaleY(1.3)";
          });
          const flash = bump(t, 12.34, 12.6);
          numEl.style.textShadow = flash > 0.05 ? "0 0 " + (40 * flash).toFixed(0) + "px rgba(120,170,255," + (0.8 * flash).toFixed(2) + ")" : "none";
          const sEl = $("stars");
          sEl.style.transform = "translate(" + (960 - sEl.offsetWidth / 2).toFixed(1) + "px,640px)";
          starEls.forEach((s, i) => { const u = E.outBack(P(t, 12.6 + i * 0.075, 12.76 + i * 0.075), 2.6); s.style.transform = "scale(" + C(u, 0, 1.3).toFixed(3) + ")"; s.style.opacity = C(u * 3); });
          const ru = E.outCubic(P(t, 12.8, 12.94));
          rateEl.style.opacity = ru; rateEl.style.transform = "translateX(" + ((1 - ru) * 20).toFixed(1) + "px)";
          const gu = E.outCubic(P(t, 12.9, 13.06));
          const gl = $("guar");
          gl.style.transform = "translate(" + (960 - gl.offsetWidth / 2).toFixed(1) + "px," + (752 + (1 - gu) * 16).toFixed(1) + "px)";
          gl.style.opacity = gu;
          rays(fx, 960, ny + 105, t, 12.34, 36, 160, 520, "#8fb2ff", 90);
          const fl = bump(t, 13.26, 13.42);
          if (fl > 0) { fx.fillStyle = "rgba(210,216,232," + (0.7 * fl).toFixed(3) + ")"; fx.fillRect(0, 0, 1920, 1080); }
        }

        function end(t) {
          const on = t >= 13.36;
          K.show($("endL"), on);
          if (!on) return;
          const mk2 = $("emark"), lk = $("elock"), wm = $("ewm"), clip = $("ewmClip");
          const c1 = E.outBack(P(t, 13.4, 13.52), 2), c2 = E.outBack(P(t, 13.46, 13.58), 2), dm = E.outBack(P(t, 13.52, 13.66), 2);
          $("eC1").style.opacity = C(c1 * 3); $("eC2").style.opacity = C(c2 * 3);
          mk2.querySelector("path").style.opacity = C(dm * 3);
          mk2.querySelector("path").style.transform = "translateY(" + ((1 - C(dm)) * -50).toFixed(1) + "px)";
          const mv = E.inOutCubic(P(t, 13.68, 13.92));
          const W = wm.offsetWidth, total = 170 + 30 + W, left = 960 - total / 2;
          const cx = L(960, left + 85, mv), cy = L(520, 400, mv), ms = L(1.8, 1, mv);
          mk2.style.transform = "scale(" + ms.toFixed(3) + ")";
          lk.style.transform = "translate(" + (cx - 85).toFixed(1) + "px," + (cy - 93).toFixed(1) + "px)";
          blur(mk2, bump(t, 13.66, 13.94) * 6);
          const rv = E.outCubic(P(t, 13.8, 14.08));
          clip.style.width = (W * rv + 2).toFixed(1) + "px";
          K.show(clip, t >= 13.8);
          $("ewmU").style.width = ($("ewmB").offsetWidth * E.inOutCubic(P(t, 14.12, 14.28))).toFixed(1) + "px";
          $("et1").style.top = "578px"; $("et2").style.top = "656px";
          riseLetters(ET1, t, 13.84, 0.006, 0.16, 24);
          riseLetters(ET2, t, 13.96, 0.007, 0.16, 24);
          const url = $("url");
          const uu = E.outBack(P(t, 14.3, 14.46), 1.8);
          url.style.opacity = C(uu * 3);
          url.style.transform = "translate(" + (960 - url.offsetWidth / 2).toFixed(1) + "px,796px) scale(" + C(uu, 0, 1.2).toFixed(3) + ")";
          $("shine").style.left = L(-80, url.offsetWidth + 40, P(t, 14.46, 14.72)).toFixed(1) + "px";
          rays(fx, 960, 470, t, 13.4, 30, 110, 360, "#5a79c9", 40);
        }

        function hud(t) {
          const on = t < 13.3;
          K.show($("hud"), on);
          if (!on) return;
          const light = (t >= 6.34 && t < 6.66) || (t >= 9.98 && t < 11.62);
          const col = light ? "rgba(20,26,60,0.45)" : "rgba(210,215,240,0.4)";
          $("hud").style.color = col;
          const SEC = [[0, "01 · THE PROBLEM"], [3.3, "02 · THE STACK"], [4.95, "03 · THE TOOLS"], [7.0, "04 · THE PRODUCT"], [9.98, "05 · THE DEAL"], [11.76, "06 · THE PROOF"]];
          const sec = SEC.filter((s) => t >= s[0]).pop()[1];
          $("hTL").textContent = "┌ " + String(v.code).toUpperCase() + " — " + sec;
          $("hTR").textContent = String(v.domain).toUpperCase() + " ┐";
          $("hBL").textContent = "└ FRAME " + String(Math.floor(t * 60)).padStart(4, "0") + " / 0900 · 60FPS";
          $("hBR").style.background = light ? "rgba(20,26,60,0.12)" : "rgba(255,255,255,0.12)";
          const bi = $("hBRi");
          bi.style.background = light ? "rgba(20,26,60,0.45)" : "rgba(255,255,255,0.55)";
          bi.style.left = (t / DUR * 120).toFixed(1) + "px";
        }

        function render(t) {
          fx.clearRect(0, 0, 1920, 1080);
          drawBg(t);
          problem(t);
          if (t >= 3.0 && t < 3.45) {
            // cards collapse into a point, then the warp
            const u = P(t, 3.0, 3.34);
            fx.save();
            fx.strokeStyle = "rgba(120,150,255," + (0.35 * bump(t, 3.0, 3.4)).toFixed(3) + ")"; fx.lineWidth = 2;
            fx.beginPath(); fx.arc(960, 540, L(420, 40, E.inCubic(u)), 0, TAU); fx.stroke();
            const pt = P(t, 3.12, 3.22) * (1 - P(t, 3.36, 3.46));
            const gl = fx.createRadialGradient(960, 540, 0, 960, 540, 46); gl.addColorStop(0, "rgba(240,246,255," + pt.toFixed(3) + ")"); gl.addColorStop(0.2, "rgba(150,190,255," + (0.8 * pt).toFixed(3) + ")"); gl.addColorStop(1, "rgba(40,90,255,0)");
            fx.fillStyle = gl; fx.fillRect(0, 0, 1920, 1080); fx.restore();
          }
          rays(fx, 960, 490, t, 3.38, 90, 40, 900, "#dce7ff", 7);
          rays(fx, 960, 490, t, 3.66, 40, 200, 700, "#8fb2ff", 11);
          const fl = bump(t, 3.7, 3.84);
          if (fl > 0) { fx.fillStyle = "rgba(200,208,228," + (0.45 * fl).toFixed(3) + ")"; fx.fillRect(0, 0, 1920, 1080); }
          stack(t);
          tools(t);
          wall(t);
          product(t);
          if (t >= 9.84 && t < 10.04) {
            const u = E.inOutCubic(P(t, 9.84, 10.02));
            fx.save(); fx.fillStyle = "#f5f6fb"; fx.beginPath(); fx.moveTo(L(-400, 2400, u) - 900, 0); fx.lineTo(L(-400, 2400, u), 0); fx.lineTo(L(-400, 2400, u) - 500, 1080); fx.lineTo(L(-400, 2400, u) - 1400 - 2000 * u, 1080); fx.closePath(); fx.fill();
            fx.strokeStyle = BLUE; fx.lineWidth = 16; fx.lineCap = "round"; fx.beginPath(); fx.moveTo(L(-400, 2400, u), 0); fx.lineTo(L(-400, 2400, u) - 500, 1080); fx.stroke(); fx.restore();
          }
          deal(t);
          proof(t);
          end(t);
          hud(t);
        }

        let lastT = 0;
        const draw = (t) => { lastT = t; render(t); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(lastT));
        window.__timelines = window.__timelines || {};
        K.run("main", DUR, draw);
      })();
    </script>
  </body>
</html>
