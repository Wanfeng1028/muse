name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 排盘回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库已提交 package-lock.json：按锁定版本安装，并开 npm 缓存
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 排盘引擎回归
        run: npm test
